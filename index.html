<!DOCTYPE html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>За баром</title>
<style>
  :root{
    --wood:#241A16; --wood2:#2F211B; --panel:#3A2A22; --line:#4E3A2F;
    --paper:#EDE3D0; --ink:#2B211C; --brass:#C9974A; --brass-dim:#8A6A34;
    --ox:#9B3A2E; --herb:#6E8A4E; --mut:#A28C7B; --r:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;overflow-x:hidden;background:var(--wood);color:var(--paper);
    font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
    font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
  .wrap.game{padding-bottom:100px}
  h1{font-size:21px;margin:0;letter-spacing:-.01em;font-weight:650}
  h2{font-size:15px;margin:0 0 8px;font-weight:600;color:var(--mut)}
  button{font:inherit;color:inherit;cursor:pointer}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;
    border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}
  .bar.stick{position:sticky;top:0;z-index:6;background:var(--wood);padding-top:12px;margin-top:-12px}
  .bar.stick h1{font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar.stick .ghost{flex:0 0 auto}
  .stats{display:flex;gap:13px;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums;align-items:center}
  .stats b{color:var(--brass);font-weight:600}
  .ghost{background:none;border:1px solid var(--line);border-radius:var(--r);
    padding:7px 11px;font-size:13px;color:var(--mut)}
  .ghost:hover{border-color:var(--brass-dim);color:var(--paper)}

  .guest{display:flex;gap:12px;align-items:flex-start;margin-bottom:18px}
  .face{width:46px;height:46px;flex:0 0 46px;border-radius:50%;background:var(--panel);
    border:1px solid var(--line);display:grid;place-items:center;font-size:24px}
  .bubble{background:var(--panel);border:1px solid var(--line);border-radius:4px 14px 14px 14px;
    padding:11px 14px;flex:1}
  .bubble p{margin:0}
  .bubble .who{font-size:12px;color:var(--mut);margin-bottom:3px}
  .order{color:var(--brass);font-weight:650}

  .step{margin-bottom:18px}
  .opts{display:flex;flex-wrap:wrap;gap:7px}
  .opt{background:var(--wood2);border:1px solid var(--line);border-radius:var(--r);
    padding:9px 13px;font-size:14.5px;text-align:left}
  .opt:hover{border-color:var(--brass-dim)}
  .opt.on,.opt[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#231910;font-weight:600}
  .opt.wide{width:100%}

  .built{border:1px dashed var(--line);border-radius:var(--r);padding:10px;margin-top:9px;background:rgba(0,0,0,.14)}
  .built .empty{color:var(--mut);font-size:13.5px;margin:2px 0}
  .row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  .row:last-child{border-bottom:0}
  .row .nm{flex:1;font-size:14.5px}
  .row input{width:66px;background:var(--wood);border:1px solid var(--line);border-radius:7px;
    color:var(--paper);padding:6px 7px;font:inherit;font-size:14px;text-align:right}
  .row input:focus{outline:2px solid var(--brass-dim);outline-offset:1px}
  .row .unit{font-size:12px;color:var(--mut);width:24px}
  .row .x{background:none;border:0;color:var(--mut);font-size:19px;padding:0 4px;line-height:1}
  .row .x:hover{color:var(--ox)}

  /* карточка «найди ошибку» */
  .card{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .card .hd{background:var(--panel);padding:9px 13px;font-weight:650}
  .pick{display:block;width:100%;text-align:left;background:var(--wood2);border:0;
    border-top:1px solid rgba(255,255,255,.06);padding:11px 13px;font-size:14.5px;
    display:flex;justify-content:space-between;gap:10px}
  .pick:hover{background:#3A281F}
  .pick.on{background:var(--brass);color:#231910;font-weight:600}
  .pick .k{color:var(--mut);font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}
  .pick.on .k{color:#5B4318}

  .cta{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--wood) 26%);padding:16px 14px 14px}
  .cta .in{max-width:560px;margin:0 auto;display:flex;gap:9px}
  .serve{flex:1;background:var(--brass);border:0;border-radius:var(--r);padding:14px;
    font-size:16px;font-weight:650;color:#231910}
  .serve:disabled{background:var(--panel);color:var(--mut)}
  .skip{background:none;border:1px solid var(--line);border-radius:var(--r);padding:14px 13px;font-size:14px;color:var(--mut)}

  .receipt{background:var(--paper);color:var(--ink);border-radius:3px;padding:16px 15px 20px;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13.5px;line-height:1.6;
    box-shadow:0 10px 30px rgba(0,0,0,.45)}
  .receipt .top{display:flex;justify-content:space-between;border-bottom:1px dashed rgba(43,33,28,.4);
    padding-bottom:7px;margin-bottom:9px;font-size:12px}
  .receipt .name{font-size:17px;font-weight:700;margin:0 0 10px;font-family:inherit}
  .rline{display:flex;gap:8px;align-items:baseline}
  .rline .mark{width:14px;flex:0 0 14px;font-weight:700}
  .ok{color:#3F6B2E}.bad{color:#96291D}.fix{color:#96291D}
  .receipt .sep{border-top:1px dashed rgba(43,33,28,.4);margin:10px 0}
  .stamp{margin-top:12px;display:inline-block;border:2.5px solid;border-radius:5px;padding:3px 11px;
    font-weight:800;letter-spacing:.06em;transform:rotate(-3.5deg);font-size:15px}
  .stamp.good{color:#3F6B2E}.stamp.bad{color:#96291D}
  .howto{margin-top:8px;font-size:12.5px;color:rgba(43,33,28,.75)}
  .howto ol{margin:4px 0 0;padding-left:20px}
  .howto li{margin-bottom:2px}
  .reaction{margin:14px 0 0;font-size:15.5px}
  .reaction .who{font-size:12px;color:var(--mut)}

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
  .note{font-size:13px;color:var(--mut);margin:0 0 18px}
  .modes{display:grid;gap:8px;margin-bottom:18px}
  .mode{text-align:left;background:var(--wood2);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px}
  .mode.on{border-color:var(--brass);background:#3A2A1C}
  .mode b{display:block;font-size:15px;margin-bottom:2px}
  .mode span{font-size:12.5px;color:var(--mut)}
  .mode.on b{color:var(--brass)}
  table.learn{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
  table.learn td{padding:4px 0;border-bottom:1px solid rgba(255,255,255,.06)}
  table.learn td:last-child{text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion:no-preference){
    .receipt,.guest,.card{animation:in .22s ease-out}
    @keyframes in{from{opacity:0;transform:translateY(6px)}}
  }
  /* ---------- главный экран ---------- */
  .hero{padding:26px 0 10px}
  .hero h1{font-size:29px;line-height:1.1;margin-bottom:6px}
  .hero p{color:var(--mut);font-size:14.5px;margin:0 0 22px}
  .pickers{display:grid;gap:10px}
  .pick2{display:block;width:100%;text-align:left;background:var(--wood2);
    border:1px solid var(--line);border-radius:14px;padding:16px 17px}
  .pick2:hover{border-color:var(--brass-dim)}
  .pick2 b{display:block;font-size:19px;font-weight:650;margin-bottom:3px}
  .pick2 span{font-size:13.5px;color:var(--mut)}
  .pick2.accent{background:linear-gradient(180deg,#3E2C1E,#33241B);border-color:var(--brass-dim)}
  .pick2.accent b{color:var(--brass)}

  /* ---------- работа ---------- */
  .topbar{position:sticky;top:0;z-index:5;background:var(--wood);
    padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:12px}
  .topbar .line{display:flex;gap:8px;align-items:center}
  .search{flex:1;background:var(--wood2);border:1px solid var(--line);border-radius:var(--r);
    color:var(--paper);padding:12px 13px;font:inherit;font-size:16px}
  .search:focus{outline:none;border-color:var(--brass-dim)}
  .search::placeholder{color:#7C6857}
  .presets{display:flex;gap:7px;overflow-x:auto;padding:9px 0 2px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .presets::-webkit-scrollbar{display:none}
  .pre{flex:0 0 auto;background:var(--wood2);border:1px solid var(--line);
    border-radius:20px;padding:7px 13px;font-size:14px;white-space:nowrap}
  .pre.on{background:var(--brass);border-color:var(--brass);color:#231910;font-weight:600}

  .seg{display:flex;gap:6px;background:var(--wood2);border:1px solid var(--line);
    border-radius:12px;padding:4px;margin-bottom:12px}
  .seg button{flex:1;background:none;border:0;border-radius:9px;padding:10px 8px;
    font-size:15px;color:var(--mut);font-weight:600}
  .seg button.on{background:var(--brass);color:#231910}
  .cross{display:block;width:100%;margin-top:14px;background:var(--wood2);
    border:1px dashed var(--brass-dim);border-radius:12px;padding:12px;
    font-size:14px;color:var(--brass);text-align:left}
  .facet{margin-bottom:12px}
  .facet h3{font-size:12px;text-transform:none;color:var(--mut);margin:0 0 6px;font-weight:600}
  .fchips{display:flex;flex-wrap:wrap;gap:6px}
  .fc{background:var(--wood2);border:1px solid var(--line);border-radius:18px;
    padding:6px 11px;font-size:13.5px}
  .fc.on{background:var(--brass);border-color:var(--brass);color:#231910;font-weight:600}

  .cnt{display:flex;justify-content:space-between;align-items:center;
    font-size:13px;color:var(--mut);margin:4px 0 8px}
  .cnt button{background:none;border:0;color:var(--brass);font-size:13px;padding:0}

  .glist{display:grid;grid-template-columns:minmax(0,1fr);gap:7px}
  .ghead{font-size:12px;color:var(--mut);margin:12px 0 2px;font-weight:600}
  .ghead:first-child{margin-top:0}
  .card2{display:block;width:100%;min-width:0;text-align:left;background:var(--wood2);
    border:1px solid var(--line);border-radius:12px;padding:11px 13px;overflow:hidden}
  .card2:hover{border-color:var(--brass-dim)}
  .card2 .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline;min-width:0}
  .card2 .nm{font-size:16.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card2 .pr{font-size:14px;color:var(--brass);white-space:nowrap;font-variant-numeric:tabular-nums}
  .card2 .sub{font-size:13px;color:var(--mut);margin-top:3px;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card2 .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  .tag{font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--mut)}
  .tag.s{color:var(--brass);border-color:var(--brass-dim)}
  .empty2{border:1px dashed var(--line);border-radius:12px;padding:18px 14px;text-align:center;color:var(--mut)}
  .empty2 b{display:block;color:var(--paper);margin-bottom:4px;font-weight:600}

  /* ---------- карточка рецепта ---------- */
  .rc{background:var(--paper);color:var(--ink);border-radius:10px;padding:18px 16px 20px;
    box-shadow:0 12px 34px rgba(0,0,0,.45)}
  .rc .h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .rc h2{font-size:23px;margin:0;color:var(--ink);font-weight:700;line-height:1.15}
  .rc .price{font-size:19px;font-weight:700;white-space:nowrap}
  .rc .meta{font-size:13px;color:#6B5647;margin-top:5px}
  .rc .badges{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
  .bdg{font-size:12.5px;border:1px solid rgba(43,33,28,.25);border-radius:6px;padding:3px 8px}
  .bdg.hot{background:#2B211C;color:var(--paper);border-color:#2B211C}
  .rc h4{font-size:12px;letter-spacing:.02em;color:#6B5647;margin:18px 0 6px;font-weight:700}
  .rc .ir{display:flex;justify-content:space-between;gap:10px;padding:5px 0;
    border-bottom:1px solid rgba(43,33,28,.14);font-size:15px}
  .rc .ir:last-child{border-bottom:0}
  .rc .ir b{font-weight:700;font-variant-numeric:tabular-nums}
  .rc .ir .d{color:#6B5647;font-size:13px;font-weight:400}
  .rc ol{margin:0;padding-left:20px;font-size:14.5px}
  .rc ol li{margin-bottom:5px}
  .rc .quote{background:rgba(43,33,28,.06);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:6px}
  .rc .quote em{display:block;color:#6B5647;font-size:12px;font-style:normal;margin-bottom:3px}
  .rc .sim{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .rc .sim button{background:rgba(43,33,28,.07);border:0;border-radius:7px;
    padding:6px 10px;font-size:13.5px;color:var(--ink)}
  .warn{font-size:12.5px;color:#6B5647;margin-top:14px;padding-top:10px;
    border-top:1px solid rgba(43,33,28,.14)}

  /* ---------- справочник ---------- */
  .card2 .sub2{font-size:13.5px;color:var(--mut);margin-top:4px;line-height:1.45}
  .card2 mark,.rc mark{background:rgba(201,151,74,.32);color:inherit;border-radius:3px;padding:0 1px}
  .rc.read{padding:20px 17px 24px}
  .rc.read h2{font-size:21px;margin:2px 0 14px}
  .rc.read p{font-size:16px;line-height:1.62;margin:0 0 12px}
  .rc.read .sub-h{font-size:15.5px;font-weight:700;color:var(--ink);
    margin:22px 0 8px;letter-spacing:0}
  .rc.read .callout{border-left:3px solid rgba(43,33,28,.3);padding-left:12px;font-weight:600}
  .tw{overflow-x:auto;margin:6px 0 16px;-webkit-overflow-scrolling:touch}
  .tw table{border-collapse:collapse;font-size:14px;min-width:100%;color:var(--ink)}
  .tw th,.tw td{border-bottom:1px solid rgba(43,33,28,.16);padding:7px 12px 7px 0;
    text-align:left;vertical-align:top}
  .tw th{font-weight:700;white-space:nowrap;border-bottom:1.5px solid rgba(43,33,28,.4)}
  .tw td:first-child{font-weight:600;padding-right:16px}
  .nav2{display:flex;gap:8px;margin-top:14px}
  .nav2 button,.nav2 span{flex:1;background:var(--wood2);border:1px solid var(--line);
    border-radius:12px;padding:12px;font-size:13.5px;color:var(--mut);text-align:left;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav2 span{border:0;background:none}
  .nav2 button:last-child{text-align:right}
  .nav2 button:hover{border-color:var(--brass-dim);color:var(--paper)}
</style>
<div class="wrap" id="app"></div>

const BOOKS = [["КЛАССИЧЕСКИЕ КОКТЕЙЛИ","Справочник бармена",[["1. Анатомия коктейля",[["p","Почти любой классический коктейль раскладывается на три роли. Понимание этой структуры важнее заучивания рецептов: зная роли, можно собрать напиток из того, что есть на баре, и починить чужой рецепт."],["t",[["Роль","Что делает","Примеры"],["База","Основа, задаёт характер. Обычно 40–60 мл","Джин, виски, ром, текила, водка, коньяк"],["Модификатор","Смягчает и дополняет базу, добавляет объём и сложность. 15–30 мл","Вермут, ликёр, сок, сироп, шампанское"],["Акцент","Настраивает и связывает. Капли и дэши","Биттеры, абсент-ринс, соль, цедра, специи"]]],["p","Четвёртый, невидимый компонент — вода. Она попадает в напиток из тающего льда при стире или шейке и составляет от 20 до 30 % итогового объёма. Коктейль без разбавления не готов: он жёсткий, спиртуозный и несобранный."]]],["2. История коктейля",[["h","2.1. 1806: первое определение"],["p","Первое известное печатное определение слова появилось в мае 1806 года в газете The Balance and Columbian Repository. Читатель спросил, что такое cocktail, и редактор ответил: это стимулирующий напиток из спирта, сахара, воды и биттеров."],["p","То есть первым коктейлем в юридическом смысле был Old Fashioned. Его название появилось позже — когда бармены стали усложнять напитки, консервативные гости начали просить «сделать по-старому», old fashioned."],["p","Происхождение самого слова достоверно не установлено. Версий много: от подрезанного хвоста лошади до французского coquetier — подставки под яйцо, в которой аптекарь Пейшо в Новом Орлеане якобы подавал свои смеси. Ни одна не доказана."],["h","2.2. Джерри Томас и профессия бармена"],["p","В 1862 году Джерри Томас издал «How to Mix Drinks, or The Bon Vivant's Companion» — первую книгу рецептов коктейлей. До неё рецепты передавались устно и внутри заведений."],["p","Томас был не только систематизатором, но и шоуменом: его Blue Blazer — переливание горящего виски между двумя кружками — сделал бармена фигурой, на которую смотрят. Книга закрепила базовые семейства напитков, многие из которых существуют в тех же категориях до сих пор."],["h","2.3. Золотой век"],["p","Период примерно с 1870-х до 1919 года — время формирования канона. Появились Martini, Manhattan, Daiquiri, Sazerac, Ramos Gin Fizz. Отель и бар стали городской институцией, а профессия бармена — уважаемой."],["p","В это же время сформировалась техника: лёд стал доступен благодаря промышленному производству, появились шейкеры, стрейнеры, джиггеры. Коктейль перестал быть импровизацией и стал рецептурой."],["h","2.4. Сухой закон и эмиграция"],["p","Сухой закон 1920–1933 годов нанёс двойной удар: качество спирта упало, и коктейли начали строить так, чтобы это скрыть — больше сахара, больше сока, больше ликёров. Часть классики огрубела именно тогда."],["p","Второе следствие оказалось благотворным: американские бармены уехали в Лондон, Париж и Гавану. Гарри Крэддок в лондонском Savoy издал в 1930 году «The Savoy Cocktail Book», Гарри Макэлхон работал в Париже, кубинские бары приняли американскую публику. Коктейльная культура стала международной."],["h","2.5. Тики и послевоенная эпоха"],["p","С 1930-х Дон Бич и Трейдер Вик создали тропическое направление: сложные ромовые коктейли из множества компонентов, дроблёный лёд, экзотическая подача. Рецепты держались в секрете, компоненты шифровались."],["p","После войны тики достиг пика популярности и стал массовым — а вместе с массовостью пришли готовые смеси, консервированные соки и упрощения, которые к 1970-м обесценили направление."],["h","2.6. Тёмные времена"],["p","С 1960-х по 1990-е коктейльная культура деградировала. Причины: готовые кислые миксы вместо свежего сока, порошковые основы, водка как универсальная база без вкуса, мода на сладкие напитки ярких цветов."],["p","Классические рецептуры сохранялись в книгах, но в барах их готовили по искажённым версиям — Daiquiri стал замороженным сладким коктейлем из смеси, Margarita — из концентрата, Martini — синонимом любого напитка в конусном бокале."],["h","2.7. Ренессанс 2000-х"],["p","Разворот связывают с несколькими барами и людьми. В Нью-Йорке Саша Петраске открыл в 1999 году Milk & Honey, где вернул принципы: свежий сок, качественный лёд, точные пропорции, тишина и внимание к гостю. В Лондоне и Токио параллельно развивались собственные школы."],["p","Одновременно были переизданы старые книги, восстановлены исчезнувшие ингредиенты — креме де виолет, аллспайс-дрэм, качественные вермуты, — и вернулись забытые рецепты. К 2010-м профессия бармена снова стала ремеслом с историей, а не сервисной функцией."]]],["3. Семейства коктейлей",[["t",[["Семейство","Формула","Метод","Примеры"],["Old Fashioned / спирит-форвард","Спирт + сахар + биттеры","Стир","Old Fashioned, Sazerac"],["Мартини / дуо и трио","Спирт + креплёное вино (+ ликёр)","Стир","Martini, Manhattan, Negroni, Rob Roy"],["Сауэр","Спирт + кислое + сладкое","Шейк","Daiquiri, Whiskey Sour, Margarita, Sidecar"],["Хайбол","Спирт + газированное","Билд","Gin & Tonic, Cuba Libre, Highball"],["Физ","Сауэр + содовая, часто с белком","Шейк, затем долив","Gin Fizz, Ramos Gin Fizz"],["Коллинз","Сауэр в высоком бокале с содовой и льдом","Шейк или билд","Tom Collins, John Collins"],["Флип и ног","Спирт + яйцо + сахар (+ сливки)","Dry shake","Brandy Flip, Eggnog"],["Джулеп","Спирт + сахар + мята, дроблёный лёд","Свот и свэйп","Mint Julep"],["Смэш","Спирт + фрукт или трава + сахар","Мадл и шейк","Whiskey Smash"],["Кобблер","Вино или спирт + сахар + фрукты, дроблёный лёд","Шейк","Sherry Cobbler"],["Тики / тропические","Ром(ы) + цитрус + сиропы + специи","Шейк или бленд","Mai Tai, Zombie, Painkiller"],["Шампанские","Игристое + модификатор","Билд","French 75, Kir Royal, Spritz"],["Горячие","Спирт + горячая основа","Билд в подогретой посуде","Irish Coffee, Hot Toddy"]]]]],["4. Методы приготовления",[["t",[["Метод","Когда применяется","Как делать"],["Билд (build)","Хайболы и лонги: газированный компонент","Собирать прямо в бокале со льдом. Минимум перемешиваний, чтобы не выбить газ"],["Стир (stir)","Только спиртовые составы без сока, сахара и белка","20–30 секунд в смесительном стакане, ложкой по стенке. Цель — охладить и разбавить, сохранив прозрачность"],["Шейк (shake)","Есть цитрус, сироп, сок, сливки, белок","10–15 секунд жёстко. Насыщает воздухом, даёт текстуру и мутность"],["Dry shake","Коктейли с белком","Сначала без льда 10–15 секунд для эмульсии, затем со льдом. Reverse dry shake — наоборот, сначала со льдом"],["Мадл (muddle)","Фрукты, ягоды, сахар","Давить мягко. Раздавленная цедра и мята дают горечь"],["Свот (swat)","Мята и травы","Хлопнуть по листьям ладонью: выделяются масла, лист не рвётся"],["Свэйп (swizzle)","Дроблёный лёд","Вращать палочку между ладонями до инея на стенках"],["Тростинг (throwing)","Коктейли с вермутом и хересом","Переливание длинной струёй между сосудами: аэрация без мутности шейка"],["Ринс (rinse)","Ароматический акцент","Ополоснуть бокал 5 мл абсента или другого напитка, излишек слить"],["Флоат (float)","Слоистая подача","Наливать по барной ложке; более плотная или менее крепкая жидкость остаётся сверху"],["Бленд","Замороженные коктейли","Дроблёный лёд в блендере. Требует больше сахара: холод глушит сладость"]]],["p","Главное правило: есть цитрус, сахар, сок, белок или сливки — шейк. Только спирт и креплёное вино — стир. Шейк даёт воздух и мутность: для сауэра это достоинство, для Manhattan — дефект."]]],["5. Лёд",[["t",[["Тип","Где используется","Почему"],["Кубик стандартный","Шейк, стир, хайболы","Универсальный. Чем больше кубиков и чем они холоднее, тем медленнее таяние"],["Большой куб или сфера","Олд-фэшнд, виски со льдом","Малая площадь поверхности: медленное разбавление, напиток дольше держит вкус"],["Дроблёный лёд","Джулеп, свэйп, тики, кобблер","Быстрое охлаждение и намеренное разбавление; создаёт иней на стенках"],["Колотый (cracked)","Отдельные классические рецепты","Промежуточный вариант"],["Прозрачный лёд","Премиальная подача","Направленная заморозка вытесняет воздух и примеси. Тает медленнее и выглядит лучше"]]],["p","Лёд из шейкера не идёт в бокал: он уже частично растаял и продолжит разбавлять напиток. В бокал — свежий."],["p","Мокрый лёд, простоявший в ведре, разбавляет коктейль вдвое быстрее сухого из морозильника."],["p","Лёд впитывает запахи. Открытый контейнер рядом с цитрусами и мятой — источник посторонних тонов."],["p","Бокалы для коктейлей без льда охлаждаются заранее: в морозилке или льдом с водой, который сливается перед наливом."]]],["6. Посуда",[["t",[["Бокал","Объём","Для чего"],["Купе (coupe)","150–200 мл","Коктейли без льда: Daiquiri, Manhattan, Sidecar. Универсальная замена мартинке"],["Мартинка (конус)","150–240 мл","Martini. Неустойчив и легко проливается — многие бары перешли на купе"],["Никони / Nick & Nora","150 мл","Элегантная альтернатива для стиров, меньше расплёскивается"],["Олд-фэшнд (рокс)","200–300 мл","Напитки со льдом: Old Fashioned, Negroni, виски"],["Хайбол","250–350 мл","Лонги с газированным: G&T, Cuba Libre"],["Коллинз","300–400 мл","Высокий узкий: Tom Collins, Mojito"],["Копа де балон","600–700 мл","Испанский шар для G&T: держит аромат, вмещает много льда"],["Флейта","150–200 мл","Игристое и шампанские коктейли"],["Тюльпан для игристого","200–250 мл","Лучше флейты передаёт аромат; современный стандарт"],["Харрикейн","400–500 мл","Тропические: Piña Colada, Hurricane"],["Джулеп-маг","350 мл","Медная или серебряная кружка для джулепов"],["Айриш-маг","200–250 мл","Стеклянная кружка на ножке для Irish Coffee"],["Гленкейрн / тюльпан","150–200 мл","Дегустация крепкого чистым"]]]]],["7. Инструменты",[["t",[["Инструмент","Назначение"],["Бостонский шейкер","Два стакана (металл и металл или металл и стекло). Основной рабочий инструмент: быстрый, ёмкий, легко чистится"],["Кобблер-шейкер","Три части со встроенным ситечком. Удобен новичку, но часто заедает и медленнее в работе"],["Смесительный стакан","Для стира. Толстое стекло, широкое горло"],["Барная ложка","Стир, флоат, дозирование. Длинная витая ручка"],["Джиггер","Мерный стакан. Стандарт 30/45 или 20/40 мл. Работа «на глаз» даёт разброс до 30 %"],["Хоторн-стрейнер","Ситечко с пружиной для шейкера"],["Джулеп-стрейнер","Ситечко-ложка для смесительного стакана"],["Мелкое ситечко","Двойное процеживание: задерживает осколки льда и мякоть"],["Мадлер","Разминание фруктов, ягод и сахара"],["Цитрус-пресс","Ручной пресс для лайма и лимона; сок должен быть свежим"],["Нож и пилер","Гарниры и цедра"],["Дозирующие бутылки","Биттеры, ринсы"]]]]],["8. Базовые формулы и баланс",[["t",[["Формула","Пропорция","Применение"],["Сауэр классический","2 : 1 : 1 (спирт : кислое : сладкое)","Daiquiri, Whiskey Sour, Margarita — 60:30:30 или 50:25:25"],["Сауэр сухой","2 : 0,75 : 0,75","Для гостей, не любящих сладкое"],["Дуо","2 : 1 (спирт : креплёное)","Manhattan, Rob Roy"],["Эквал партс","1 : 1 : 1","Negroni, Last Word, Corpse Reviver №2"],["Old Fashioned","Спирт + 5–10 мл сахара + 2–3 дэша биттеров","Спирит-форвард"],["Хайбол","1 : 3 или 1 : 2 (спирт : газированное)","G&T, Highball"],["Мартини","От 5:1 до 2:1 (джин : вермут)","По вкусу гостя — уточнять всегда"]]],["h","Как чинить баланс"],["t",[["Проблема","Причина","Решение"],["Слишком кисло","Много цитруса или мало сахара","Добавить 3–5 мл сиропа"],["Слишком сладко","Много сиропа или сладкий ликёр","Добавить 3–5 мл цитруса, при повторе уменьшить сироп"],["Слишком крепко","Недостаточное разбавление","Дольше шейк или стир; проверить качество льда"],["Водянисто","Перебор с разбавлением, мокрый лёд","Меньше времени, сухой лёд из морозильника"],["Плоско, «нечего слушать»","Нет акцента","Дэш биттеров, цедра, щепотка соли"],["Резкий спиртовой хвост","Дисбаланс базы и модификаторов","Увеличить модификатор или добавить каплю сиропа"]]]]],["9. Рецептуры: спирит-форвард",[["t",[["Коктейль","Состав","Метод","Подача"],["Old Fashioned","60 мл бурбон/ржаной, 7 мл сироп, 2–3 дэша ангостуры","Стир","Олд-фэшнд, большой куб. Апельсиновая цедра"],["Manhattan","60 мл ржаной, 30 мл кра пости 60–70 %, туйон — миф"],["«Червь в мескале — традиция?»","Нет, маркетинг 1940-х. Хорошие мескали без червя"],["«Менделеев придумал 40 градусов?»","Нет. Цифра закрепилась для удобства расчёта акциза"],["«Текилу пьют с солью и лаймом?»","Так пьют mixto. 100 % агава пьют чистой, с сангритой"],["«Кристаллы на пробке вина — брак?»","Нет, винный камень. Безвреден"],["«Пробка пахнет картоном»","Пробковая болезнь. Бутылка меняется без обсуждения"],["«Чем дороже, тем лучше?»","Цена = возраст, редкость и маркетинг. Не всегда вкус"],["«Коньяк нужно греть над свечой?»","Нет, это портит аромат. Достаточно тепла ладони"]]]]],["11. Частые ошибки",[["t",[["Ошибка","Последствие"],["Бутилированный сок","Плоский «варёный» вкус. Главная ошибка в сауэрах"],["Старый вермут с полки","Компотный тон в Martini, Negroni, Manhattan"],["Мало льда","Быстрое таяние, водянистый напиток"],["Шейк спиртового коктейля","Мутность и осколки там, где нужна прозрачность"],["Тёплый бокал","Коктейль разваливается за минуту"],["Работа без джиггера","Разброс до 30 % между порциями"],["Перебор с мадлом мяты","Горечь от разорванных листьев"],["Долив газированного до перемешивания","Выбитый газ, плоский лонг"],["Грязный бокал под пиво","Пена умирает: жир на стенках"],["Не спросили вкус гостя","Martini, Negroni, Old Fashioned имеют широкий диапазон"]]]]]]],["ДЖИН","Справочник бармена",[["1. Что такое джин",[["p","Джин — крепкий спиртной напиток, получаемый ароматизацией нейтрального спирта (чаще всего зернового — пшеница, ячмень, реже меласса или виноград) растительным сырьём, среди которого вкусовое и ароматическое доминирование принадлежит ягодам можжевельника обыкновенного (Juniperus communis)."],["p","Юридическое определение удивительно скупое. В Евросоюзе достаточно, чтобы напиток был на основе этилового спирта сельскохозяйственного происхождения, имел преобладающий можжевеловый вкус и крепость не ниже 37,5 % об. В США минимум — 40 % об. Всё остальное — свобода производителя. Именно поэтому под словом «джин» на полке может стоять и хвойно-аскетичный Tanqueray, и огуречно-розовый Hendrick's."],["p","Ключевое отличие от водки: водку ведут к нейтральности и очищают от всего лишнего, джин на этой нейтральности, наоборот, строят вкус. Технологически джин — это ароматизированная водка; культурно — совершенно другой напиток с четырёхсотлетней биографией."]]],["2. История",[["h","2.1. Можжевельник как лекарство: до джина"],["p","Можжевельник использовали в медицине задолго до появления дистилляции в Европе. Ягоды считались мочегонным, антисептическим и «очищающим кровь» средством; их находят в описях египетских погребений, они упоминаются у Плиния Старшего и в средневековых травниках."],["p","С распространением перегонки в Европе (XII–XIII вв., через арабскую традицию и Салернскую медицинскую школу) можжевельник закономерно попал в спирт: спирт был растворителем и консервантом для лекарственного сырья. Во время эпидемий чумы XIV века можжевеловые настойки применяли как защитное средство — врачи в «клювах» чумных масок носили в том числе можжевеловые ягоды."],["p","Первый достоверно зафиксированный рецепт можжевеловой дистилляции на голландском языке — в книге «Een Constelijck Distileerboec» Филиппа Херманни, 1552 год. К этому моменту напиток уже был не изобретением, а практикой."],["h","2.2. Голландия: рождение женевера"],["p","Родина джина в его узнаваемом виде — Нижние Земли (современные Нидерланды и Бельгия). Там сложился женевер (jenever, от голландского названия можжевельника) — напиток на основе солодового вина (moutwijn): грубого дистиллята из ячменя, ржи и кукурузы. Спирт того времени был неочищенным, резким, с сильным зерновым характером; можжевельник и специи не столько украшали, сколько маскировали его."],["p","Дом Bols ведёт историю с 1575 года и считается одним из старейших непрерывно работающих производителей крепкого алкоголя в мире. Голландская Ост-Индская компания сыграла огромную роль: специи — кориандр, кардамон, гвоздика, кассия, цедра — приходили в Амстердам напрямую, и женевер стал побочным продуктом колониальной торговли."],["p","Распространённый барный миф: джин «изобрёл» лейденский профессор медицины Франциск Сильвий в середине XVII века. Красивая история, но женевер описан в источниках как минимум за столетие до его работ. Сильвий — популяризатор, а не изобретатель. Если рассказываете гостю, честнее подать это именно как легенду."],["h","2.3. «Голландская храбрость»"],["p","В ходе Тридцатилетней войны (1618–1648) и англо-голландских кампаний английские солдаты, воевавшие бок о бок с голландцами, обратили внимание на привычку союзников принимать женевер перед боем — для согрева и снятия страха. Отсюда выражение Dutch courage, «голландская храбрость», живущее в языке до сих пор."],["p","Солдаты вернулись домой со вкусом к напитку. Это первый канал проникновения джина в Англию — низовой, армейский, задолго до всякой политики."],["h","2.4. Англия: политика открывает шлюзы"],["p","Переломный момент — Славная революция 1688 года: на английский престол взошёл голландец Вильгельм III Оранский. Началась война с Францией, и правительство целенаправленно душило импорт французского бренди высокими пошлинами, одновременно поощряя отечественную дистилляцию из излишков зерна — это поддерживало землевладельцев."],["p","Акт 1690 года фактически отменил монополию Гильдии дистиллеров: производить спирт мог почти кто угодно, уведомив власти. Лицензия не требовалась. В сочетании с дешёвым зерном и дорогим пивом это создало условия для одного из крупнейших алкогольных кризисов в истории."],["h","2.5. Gin Craze: 1720–1751"],["p","К 1730-м годам в Лондоне джин продавался буквально везде: в лавках, у цирюльников, из тачек на улице, в тюрьмах. По оценкам того периода, в некоторых приходах Ист-Энда каждый четвёртый дом торговал спиртным. Годовое потребление крепкого в стране выросло в несколько раз за два десятилетия."],["p","Качество было катастрофическим. Дешёвый джин подслащивали, чтобы скрыть сивушные тона, и добавляли что попало: скипидар (для псевдо-можжевеловой ноты), серную кислоту, квасцы, свинцовые соли. Массовые отравления, слепота, смертность — реальные, задокументированные последствия."],["p","Джин получил прозвище Mother's Ruin — «погибель матерей»: он был одинаково доступен женщинам, что для эпохи было социальным шоком, и связывался с распадом семей и детской смертностью."],["h","Джиновые акты"],["t",[["Акт","Суть","Результат"],["1729","Высокая пошлина и лицензия £20 на розничную торговлю","Уход в подполье, рост «неофициального» джина"],["1736","Лицензия £50, налог £1 с галлона — фактический запрет","Бунты, доносительство ради наград, массовое неисполнение"],["1743","Смягчение: доступные лицензии, налог с производителя","Легализация вместо подполья — первый работающий подход"],["1751","Продажа только через лицензированные заведения с недвижимостью, надзор мировых судей","Постепенный спад кризиса, начало легальной индустрии"]]],["p","В 1751 году Уильям Хогарт выпустил парную гравюру: «Пивная улица» (Beer Street) — процветание, здоровье, труд; и «Джиновый переулок» (Gin Lane) — нищета, безумие, мать, роняющая младенца с лестницы. Это была прямая пропаганда в поддержку Gin Act, и она стала самым узнаваемым визуальным образом эпохи."],["p","Барная деталь: капитан Дадли Брэдстрит в 1738 году придумал схему обхода запрета — вывесил на стене дома фигуру кота (Puss and Mew). Прохожий говорил в трубку под лапой «Puss», получал ответ «Mew», опускал монету в щель — и из свинцовой трубки лился джин. Первый в истории торговый автомат по продаже алкоголя."],["h","2.6. Old Tom: переходный стиль"],["p","Название Old Tom, по одной из версий, восходит как раз к тем котам-автоматам. Стиль представлял собой подслащённый джин — сахар компенсировал грубость спирта, а иногда напиток отдыхал в бочках из-под других продуктов."],["p","Old Tom — это ступень между тяжёлым солодовым женевером и будущим сухим London Dry. Практически вся коктейльная классика XIX века (Tom Collins, Martinez) писалась именно под него, и при воспроизведении старых рецептов на современном London Dry вкус получается заметно суше оригинала."],["h","2.7. XIX век: колонна Коффи и рождение сухого стиля"],["p","В 1831 году ирландец Энеас Коффи запатентовал усовершенствованную ректификационную колонну непрерывного действия. Она позволила получать спирт высокой чистоты дёшево и в промышленных объёмах — это изменило джин радикально."],["p","Раз спирт больше не был грубым, отпала нужда в сахаре и тяжёлых специях для маскировки. Появился сухой стиль, где ботаника не прикрывает базу, а работает как самостоятельная композиция. Так сформировался London Dry — не географическое обозначение, а метод: весь вкус закладывается при перегонке, после неё в напиток не добавляют ничего, кроме воды и, при желании, ничтожного количества сахара."],["p","В ту же эпоху сложились дома, которые до сих пор стоят на полке любого бара: Gordon's (Александр Гордон, 1769, Саутуарк), Plymouth (винокурня Black Friars, 1793), Tanqueray (Чарльз Танкерей, 1830, Блумсбери), Beefeater (Джеймс Барроу, вторая половина XIX века)."],["p","Параллельно джин стал респектабельным. На смену грязным подвалам пришли gin palaces — джиновые дворцы: заведения с газовым освещением, зеркалами, полированной латунью и резным деревом. Для рабочего Лондона это были первые публичные пространства, выглядевшие роскошно."],["h","2.8. Индия, хинин и рождение Gin & Tonic"],["p","В британской Индии офицеры и колониальные служащие принимали хинин — экстракт коры хинного дерева — как средство профилактики малярии. Хинин чудовищно горький, и его разводили водой с сахаром. Дальнейшее было вопросом времени: к раствору добавили джин и лайм."],["p","Первую коммерческую тоническую воду запатентовал Эразм Бонд в 1858 году; Schweppes выпустила свою Indian Tonic Water около 1870-го. Так лекарственная процедура превратилась в самый популярный длинный коктейль в мире."],["p","Черчиллю приписывают фразу, что джин с тоником спас больше английских жизней, чем все врачи Империи. Документального подтверждения авторства нет — подавайте как красивую легенду, а не как факт."],["h","2.9. Королевский флот: Navy Strength и Pink Gin"],["p","Джин был официальным напитком офицерского состава Королевского флота (матросам полагался ром). Plymouth Gin десятилетиями поставлялся флоту по контракту, а флотская культура дала два устойчивых понятия."],["p","Navy Strength — крепость около 57 % об. («100 proof» по британской системе). Логика утилитарная: если бочка с джином протечёт на пороховой палубе, порох, пропитанный таким спиртом, всё равно загорится. Порох проверяли этой смесью буквально — отсюда и слово «proof»."],["p","Pink Gin — джин с несколькими каплями ангостуры. Ангостура была корабельным лекарством от морской болезни и расстройства желудка; смешать её с джином было естественным способом принять горькую настойку."],["h","2.10. Золотой век коктейлей"],["p","Вторая половина XIX века — формирование барного ремесла как профессии. В 1862 году Джерри Томас издал «How to Mix Drinks, or The Bon Vivant's Companion» — первое печатное руководство бармена, где джин уже один из главных стволов."],["p","К рубежу веков появились Martini (эволюционировавший из более сладкого Martinez), Gin Fizz, Tom Collins, Ramos Gin Fizz из Нового Орлеана. В 1930 году Гарри Крэддок выпустил «The Savoy Cocktail Book» — сборник, который до сих пор остаётся опорным текстом для классики; заметная часть его рецептов — на джине."],["h","2.11. Сухой закон и bathtub gin"],["p","Американский «сухой закон» (1920–1933) парадоксальным образом сделал джину рекламу. Виски требует выдержки, а джин можно получить настаиванием ботаники на любом спирте за сутки — без перегонки. Так появился bathtub gin, «джин из ванны»: кустарный продукт, часто на техническом или денатурированном спирте."],["p","Отсюда же — расцвет коктейлей с сильными цитрусовыми и сахарными компонентами: они маскировали качество базы. И отсюда эмиграция американских барменов в Лондон, Париж и Гавану, которая, собственно, и разнесла коктейльную культуру по миру."],["h","2.12. Спад: 1960–1990-е"],["p","После войны джин попал в затяжной кризис. Водка, продвигавшаяся как нейтральный, «беззапаховый» и современный напиток, отвоевала рынок; джин стал восприниматься как питьё старшего поколения. Ассортимент сузился до нескольких промышленных марок, эксперименты почти прекратились."],["h","2.13. Ренессанс: 1987 — наши дни"],["p","Разворот начался с позиционирования. В 1987 году вышел Bombay Sapphire — с голубой бутылкой, дизайнерской подачей и лёгким профилем на паровой инфузии; он показал, что джин можно продавать как премиальный и модный продукт."],["p","В 1999-м шотландская William Grant & Sons выпустила Hendrick's с огурцом и болгарской розой, добавляемыми после перегонки. Формально это не London Dry, зато это открыло целую категорию — New Western, где можжевельник перестаёт быть безусловным лидером букета."],["p","Отдельная веха — 2009 год: лондонская Sipsmith добилась пересмотра нормы, восходящей к акцизному акту 1823 года, которая запрещала перегонные кубы объёмом менее 1800 литров. Норма делала мелкое производство нелегальным. После её снятия число британских винокурен выросло за десятилетие в разы, и крафтовая волна пошла по всему миру: Monkey 47 из Шварцвальда, Gin Mare из Испании, The Botanist с Айлы, Roku от Suntory."],["p","Сегодня джин — самая быстрорастущая и самая экспериментальная категория крепкого алкоголя. На российском рынке присутствуют и классика (Beefeater, Gordon's, Bombay, Tanqueray, Hendrick's), и локальные производители — например, Barrister из Калининграда, занявший нишу доступного сухого джина для миксов."]]],["3. Стили джина",[["t",[["Стиль","Крепость","Характер","Применение"],["Genever / Jenever","35–42 %","Солодовая база (moutwijn), маслянистый, зерновой, ближе к молодому виски. Делится на Jonge (лёгкий, современный) и Oude (солодовый, традиционный)","Пить чистым охлаждённым, Improved Holland Gin Cocktail"],["Old Tom","40–44 %","Подслащённый, округлый, иногда с бочковой выдержкой. Исторический мостик между женевером и London Dry","Tom Collins, Martinez, Ramos Gin Fizz"],["London Dry","37,5–47 %","Всё ароматизирование только при перегонке; после неё — ничего, кроме воды. Сахар не более 0,1 г/л. Сухой, чистый, можжевеловый. Не география, а метод","Универсальная база: Martini, Negroni, G&T"],["Plymouth","41,2 %","Защищённое наименование, одна винокурня. Мягче London Dry, больше корневой землистости, меньше цитрусовой остроты","Классический Martini, Gimlet, Pink Gin"],["Navy Strength","57 % и выше","Тот же сухой профиль, но концентрированный: плотнее тело, длиннее финиш, агрессивнее ботаника","Коктейли с сильными модификаторами, где обычный джин теряется"],["New Western / Contemporary","40–47 %","Можжевельник присутствует, но не доминирует. Вперёд выходят цветы, огурец, чай, пряности, травы","G&T с авторским гарниром, современные авторские коктейли"],["Sloe Gin","25–29 %","Ликёр: джин, настоянный на ягодах тёрна с сахаром. Рубиновый цвет, сладко-кислый, миндально-косточковый тон","Sloe Gin Fizz, Bramble, дополнение к другим базам"],["Aged / Barrel-rested","40–47 %","Выдержка от нескольких недель до года. Появляются ваниль, дерево, золотистый цвет","Negroni, Martinez, замена виски в стирах"]]],["h","Терминология по способу производства"],["p","Distilled gin — ботаника участвует в перегонке. Полноценный джин."],["p","Compound / bathtub gin — ароматизаторы или настой добавлены в готовый спирт без повторной перегонки. Дёшево, наследие сухого закона; допустимо по закону, но уровнем ниже."],["p","One-shot — куб заряжают ровно тем количеством ботаники, которое нужно для итогового объёма; дистиллят разбавляют только водой. Multi-shot — перегоняют концентрат и затем разводят нейтральным спиртом. Multi-shot дешевле и не обязательно хуже, но one-shot традиционно считается более «честным»."]]],["4. Ботаника: что за что отвечает",[["p","Типичный джин строится на 6–12 компонентах. Есть «большая четвёрка», без которой классический профиль не собирается, и есть подписи конкретных марок."],["t",[["Компонент","Роль в букете"],["Можжевельник","Ядро: хвоя, смола, сосна, лёгкая перечность. Без него это не джин"],["Семена кориандра","Второй по важности: цитрусовая свежесть плюс мягкая пряность, связывает букет"],["Корень дягиля (angelica)","Землистость и сухость, но главное — фиксатор: удерживает летучие ароматы, даёт стойкость"],["Корень ириса (orris)","Второй фиксатор. Пудрово-фиалковый тон, добавляет вкусу маслянистость и вес"],["Цедра лимона и апельсина","Яркость, свежесть, «подъём» аромата в носу"],["Кассия, корица","Тёплая сладковатая пряность в середине вкуса"],["Солодка (лакрица)","Ощущение сладости без сахара, вязкость, округлость тела"],["Кардамон","Ароматная камфорно-цитрусовая нота, часто читается как «дорогая» специя"],["Кубеба, райские зёрна","Перечный, покалывающий финиш"],["Миндаль","Мягкость, ореховая текстура, сглаживает острые углы"],["Фенхель, анис","Сладко-травяной шлейф"],["Авторские подписи","Огурец и роза (Hendrick's), олива и розмарин (Gin Mare), сакура и сенча (Roku), брусника (Monkey 47)"]]]]],["5. Технология: как разница в методе слышна в бокале",[["t",[["Метод","Суть","Что даёт во вкусе","Пример"],["Мацерация в кубе","Ботанику замачивают в спирте (от нескольких часов до суток), затем перегоняют","Плотнее, тяжелее, насыщеннее; больше экстракции из корней","Beefeater (24 часа)"],["Паровая инфузия","Ботаника лежит в корзине над спиртом; пары проходят сквозь неё","Легче, воздушнее, ярче верхние ноты, мягче тело","Bombay Sapphire (Carterhead)"],["Раздельная перегонка","Каждый компонент перегоняют отдельно, затем купажируют","Точный контроль, чистая читаемость отдельных нот","Sacred, ряд крафтовых марок"],["Вакуумная дистилляция","Перегонка при пониженном давлении и низкой температуре","Сохраняются свежие, «живые» ноты, которые разрушает нагрев","Oxley, Sacred"],["Постдистилляционная инфузия","Часть ботаники добавляют уже после перегонки","Максимально свежий, узнаваемый акцент; формально выводит из категории London Dry","Hendrick's (огурец, роза)"]]]]],["6. Марки: органолептика и применение",[["t",[["Марка","Стиль / крепость","Аромат и вкус","Как использовать"],["Beefeater","London Dry, 40 / 47 %, 9 ботаник","Эталонная классика: чистый можжевельник, яркая лимонно-апельсиновая цедра, сухой чистый финиш","Рабочая лошадка бара. G&T с грейпфрутом, Negroni, любая классика"],["Tanqueray London Dry","London Dry, 43,1 %, всего 4 ботаники","Максимально хвойный и прямолинейный: можжевельник, кориандр, дягиль, солодка. Острый, сухой","Dry Martini, G&T с лаймом. Для тех, кто хочет «джиновый джин»"],["Tanqueray No. Ten","Premium, 47,3 %","Свежие цитрусы перегоняются целиком плюс ромашка. Сочный, круглый, маслянистый","Martini высокого уровня, Gimlet, чистым со льдом"],["Bombay Sapphire","London Dry, 40 / 47 %, 10 ботаник","Лёгкий, цветочный, можжевельник приглушён, деликатная пряность","Самый безопасный G&T для гостя, впервые пробующего джин"],["Gordon's","London Dry, 37,5 %","Мягкий, чуть сладковатый, простой и предсказуемый","Большой объём, хайболы, банкеты"],["Plymouth","Plymouth, 41,2 %","Землистый, корневой, мягкий, кремовая текстура, меньше цитруса","Классический Martini, Gimlet, Pink Gin с ангостурой"],["Hendrick's","New Western, 41,4 %","Огурец и болгарская роза, добавленные после перегонки. Свежий, парфюмированный","G&T с огурцом (не с лаймом), лёгкие освежающие коктейли"],["Monkey 47","New Western, 47 %, 47 ботаник","Шварцвальд: плотный, пряно-ягодный, брусника, длинный сложный финиш","Нейтральный тоник, минимум гарнира. Можно пить чистым"],["Roku","Япония (Suntory), 43 %","Шесть японских ботаник: сакура (цветок и лист), сенча, гёкуро, сансё, юдзу. Деликатный, зелёный, слегка перечный","G&T с ломтиком имбиря, лёгкие сауэры"],["The Botanist","Айла, 46 %, 22 дикие + 9 базовых","Травяной, цветочный, ментоловая свежесть, торфяной регион без торфа","Авторские коктейли, Martini для опытного гостя"],["Gin Mare","Средиземноморский, 42,7 %","Олива, розмарин, тимьян, базилик. Отчётливо солёно-травяной, почти «гастрономический»","G&T с розмарином и оливкой, коктейли к еде"],["Sipsmith","London Dry, 41,6 %","Возрождённая классика: сбалансированный, чуть маслянистый, честный сухой профиль","Martini, Negroni, всё, где нужен качественный London Dry"],["Barrister","Россия (Калининград), 40 / 43 %","Чистый сухой профиль без изысков, корректная база","Бюджетные хайболы и миксы, обучение и отработка техники"]]]]],["7. Классика на джине",[["t",[["Коктейль","Состав","Метод","Посуда и гарнир"],["Dry Martini","60 мл джин, 10 мл сухой вермут","Стир на льду","Купе / мартинка. Цедра лимона или олива"],["Negroni","30 мл джин, 30 мл Campari, 30 мл красный вермут","Стир, подача на льду","Олд-фэшнд. Апельсиновая цедра"],["Gin & Tonic","50 мл джин, 150 мл тоник","Билд, тоник по барной ложке","Хайбол или копа, лёд доверху. Гарнир по ботанике"],["Tom Collins","45 мл джин, 25 мл лимон, 15 мл сахарный сироп, содовая","Шейк базы, долив содовой","Коллинз. Лимон и вишня"],["Gimlet","60 мл джин, 20 мл лаймовый кордиал","Стир или короткий шейк","Купе. Лайм"],["White Lady","40 мл джин, 20 мл Cointreau, 20 мл лимон","Шейк (с белком — dry shake)","Купе. Без гарнира или цедра"],["Aviation","45 мл джин, 15 мл мараскино, 15 мл лимон, 5 мл crème de violette","Шейк","Купе. Коктейльная вишня"],["Bramble","50 мл джин, 25 мл лимон, 12 мл сироп, 15 мл crème de mûre","Билд на дроблёном льду, ликёр сверху","Олд-фэшнд. Ежевика и лимон"],["French 75","30 мл джин, 15 мл лимон, 10 мл сироп, игристое","Шейк базы, долив игристого","Флейта. Цедра лимона"],["Clover Club","45 мл джин, 20 мл лимон, 15 мл малиновый сироп, белок","Dry shake, затем на льду","Купе. Малина"],["Last Word","22 мл джин, 22 мл зелёный шартрез, 22 мл мараскино, 22 мл лайм","Шейк","Купе. Вишня"],["Ramos Gin Fizz","60 мл джин, 15 мл лимон, 15 мл лайм, 30 мл сироп, 30 мл сливки, белок, флёрдоранж, содовая","Длинный dry shake, затем со льдом, долив содовой","Хайбол без льда, «шапка» над кромкой"],["Pink Gin","60 мл джин, 2–3 капли ангостуры","Стир","Купе. Без гарнира"],["Martinez","45 мл Old Tom, 30 мл красный вермут, 7 мл мараскино, дэш биттера","Стир","Купе. Апельсиновая цедра"]]]]],["8. Практика за стойкой",[["h","8.1. Лёд и разбавление"],["p","Лёд влияет на итоговый напиток сильнее, чем выбор марки в среднем ценовом сегменте. Мало льда в хайболе означает быстрое таяние и водянистый G&T через пять минут. Бокал заполняется льдом доверху: чем больше масса льда, тем медленнее он тает."],["p","Стандартное разбавление в стире — около 20–25 % объёма, в шейке — 25–30 %. Именно поэтому Martini на тёплом джине и мокром льду не спасти ничем."],["h","8.2. Гарнир подбирается под ботанику"],["p","Лайм — рефлекс, а не решение. Он подходит цитрусово-хвойным джинам (Tanqueray, Beefeater) и убивает деликатные New Western."],["t",[["Джин","Гарнир"],["Tanqueray, Beefeater","Лайм, грейпфрут, лимонная цедра"],["Bombay Sapphire","Лайм или лимон, можно ягоды можжевельника"],["Hendrick's","Огурец лентой, лепестки розы"],["Gin Mare","Розмарин, оливка, вяленый томат"],["Roku","Имбирь, юдзу, зелёное яблоко"],["Monkey 47, The Botanist","Минимум: одна цедра или ничего — букет самодостаточен"],["Plymouth","Лимонная цедра, ангостура"]]],["h","8.3. Тоник"],["p","Классический (хинный, Indian) — под сухие London Dry. Горечь балансирует хвою."],["p","Средиземноморский, цветочный, бузиновый — под New Western и цветочные джины."],["p","Пропорция: 1:3 — стандарт; 1:2 — для крепких (47 % и Navy Strength)."],["p","Тоник наливается по барной ложке или по стенке: газ — часть вкуса, выбитая углекислота делает напиток плоским."],["p","Открытая бутылка тоника выдыхается за часы. Малый формат (200 мл) под порцию — правильнее, чем литровая на смену."],["h","8.4. Стир или шейк"],["p","Правило простое: только спиртовые составы — стир (Martini, Negroni, Martinez, Pink Gin). Есть цитрус, сахар, белок, сливки, соки — шейк (Tom Collins, White Lady, Aviation, Clover Club). Шейк насыщает воздухом и даёт мутноватую текстуру; для прозрачного спиртового коктейля это дефект, для сауэра — необходимость."],["h","8.5. Язык гостя: варианты Martini"],["t",[["Термин","Что значит"],["Dry","Меньше вермута"],["Extra dry","Вермут почти символически: споласкивание бокала или пара капель"],["Wet","Больше вермута, ближе к историческим пропорциям"],["Perfect","Поровну сухого и сладкого вермута"],["Dirty","С оливковым рассолом"],["With a twist","С лимонной цедрой вместо оливки"],["Naked / Neat","Без вермута вовсе — фактически охлаждённый джин"],["Vesper","Джин + водка + Lillet Blanc, шейк (из романа Флеминга)"],["50/50","Равные части джина и сухого вермута"]]],["h","8.6. Хранение и здравый смысл"],["p","Джин не улучшается со временем: выдержка в бутылке ничего не даёт, а открытая бутылка постепенно теряет летучие ноты. Ботаника «выдыхается» за несколько месяцев активного использования."],["p","Хранить вертикально, вне прямого света, при комнатной температуре. Высокая крепость разрушает пробку при контакте."],["p","Джин в морозилке — вопрос стиля: холод глушит ароматику, но даёт вязкость. Для Martini многие бары держат бутылку в морозилке осознанно."],["p","Мутность при добавлении воды или льда (louching) — не брак, а выпадение эфирных масел. Чаще встречается у неохлаждённо-фильтрованных крафтовых джинов."]]],["9. Мини-глоссарий",[["t",[["Термин","Значение"],["Botanicals","Растительное сырьё, формирующее вкус джина"],["Moutwijn","Солодовое вино — база традиционного женевера"],["London Dry","Метод производства: вкус только от перегонки, без добавок после"],["Proof","Британская система крепости; 100 proof ≈ 57 % об., от порохового теста"],["One-shot / Multi-shot","Перегонка «в размер» против перегонки концентрата с последующим разбавлением"],["Carterhead","Куб с корзиной для ботаники — паровая инфузия"],["Louching","Помутнение при разбавлении из-за выпадения эфирных масел"],["Mother's Ruin","Историческое прозвище джина эпохи Gin Craze"],["Dutch courage","Идиома «голландская храбрость», от женевера перед боем"],["Gin palace","Роскошное питейное заведение викторианского Лондона"],["Copa de balón","Испанский бокал-шар для G&T: большой объём, удержание аромата"]]]]]]],["ВОДКА","Справочник бармена",[["1. Что такое водка",[["p","Водка — крепкий напиток, полученный ректификацией спирта из сельскохозяйственного сырья и разбавлением водой, без выраженного собственного вкуса и аромата. Определение через отрицание: если у джина задача создать вкус, то у водки — убрать всё лишнее."],["p","Это делает категорию сложной для дегустации и лёгкой для использования. Водка не спорит с другими компонентами коктейля, и именно поэтому она стала мировым лидером продаж в XX веке."],["p","Важная поправка к расхожему мнению: «водка не имеет вкуса» — упрощение. Различия между сырьём, глубиной очистки и водой ощутимы, особенно при комнатной температуре и в чистом виде. Другое дело, что в коктейле эти различия почти всегда стираются."]]],["2. История",[["h","2.1. Спор о первенстве"],["p","Россия и Польша многие десятилетия спорят о происхождении водки, и спор этот скорее юридический и символический, чем документальный. Обе стороны опираются на упоминания зерновых дистиллятов XV–XVI веков, а обе традиции развивались параллельно на территории с общей историей и общим сырьём."],["p","В 1970-е годы вопрос разбирался на международном уровне в связи с правом использовать слово «водка» в экспортной торговле. Единого исторического ответа он не получил и вряд ли получит: техника перегонки распространялась по региону широко, и точка старта у неё не одна."],["h","2.2. Ранние формы: «хлебное вино»"],["p","Само слово «водка» в современном значении закрепилось поздно — примерно к XIX веку. До этого напиток называли хлебным вином, полугаром, горячим вином. Это был зерновой дистиллят двойной или тройной перегонки крепостью около 38 %, очищавшийся не углём, а естественными методами: молоком, яичным белком, вымораживанием."],["p","По вкусу он заметно отличался от современной водки: имел выраженный зерновой, хлебный характер и был ближе к молодому виски без выдержки, чем к нейтральному спирту. Возрождённая категория «полугар» сегодня позволяет это попробовать."],["h","2.3. Монополии и казённый интерес"],["p","Производство и продажа крепкого алкоголя веками были важнейшей статьёй государственного дохода в России. Система менялась многократно: откупа, кабаки, акцизы, казённая монополия конца XIX века, введённая при министре финансов Витте."],["p","Государственная монополия имела и техническое следствие: были введены стандарты крепости и очистки, что унифицировало продукт на огромной территории. Именно к этому периоду относится становление водки как промышленного, стандартизированного напитка."],["h","2.4. Смирнов и промышленное производство"],["p","Пётр Смирнов построил в Москве во второй половине XIX века крупнейшее в стране производство. Его вклад — не рецептура, а промышленный подход: угольная фильтрация, контроль качества, узнаваемая упаковка и агрессивная по тем временам реклама, включая участие в международных выставках."],["p","Марка стала образцом того, как локальный продукт превращается в бренд. После революции производство было национализировано, а наследники семьи эмигрировали."],["h","2.5. Менделеев и миф о сорока градусах"],["p","Широко распространено утверждение, что Дмитрий Менделеев вывел идеальную крепость водки в 40 градусов. Это не соответствует действительности."],["p","Менделеев действительно защитил диссертацию о соединении спирта с водой, но его работа была посвящена физико-химическим свойствам растворов, а не питьевым качествам, и рассматривала преимущественно другие концентрации. Цифра 40 закрепилась по фискальным и практическим причинам: округлённое значение удобно для расчёта акциза и контроля."],["p","За стойкой: это одна из самых частых баек, которую гости пересказывают уверенно. Развенчивать её стоит мягко — история про удобство налогообложения не менее интересна, чем про великого химика."],["h","2.6. Эмиграция: как водка попала в Америку"],["p","В 1930-х годах эмигрант Рудольф Кунетт купил права на марку Smirnoff у наследника семьи и начал производство в США. Дело шло плохо: американцы не понимали, что делать с напитком без вкуса. В 1939 году права перешли к компании Heublein."],["p","Легенда о партии бутылок, ошибочно укупоренных пробками от виски, из-за чего водку начали продавать как «белый виски без вкуса и запаха», — красивая, но недостоверная. Реальный прорыв был маркетинговым и произошёл через коктейль."],["h","2.7. Moscow Mule и перелом 1950-х"],["p","В начале 1940-х в Лос-Анджелесе сошлись три проблемы: нераспроданная водка Smirnoff, нераспроданный имбирный эль и партия медных кружек. Результатом стал Moscow Mule, который продвигали агрессивно и с фотографиями — бармены получали снимки кружки со своим баром."],["p","Дальше водка выиграла главный аргумент послевоенной Америки: она не пахла. Слоган о том, что она «не оставляет следов», работал на аудиторию, которой нужно было вернуться в офис после обеда. К 1970-м водка обошла виски по продажам в США — впервые в истории."],["h","2.8. Absolut, Grey Goose и изобретение премиум-сегмента"],["p","В 1979 году шведский Absolut вышел на американский рынок с аптечной формой бутылки и рекламной кампанией, ставшей хрестоматийной. Она доказала, что нейтральный продукт можно продавать через дизайн и культурный контекст."],["p","В 1997 году Сидни Франк создал Grey Goose — французскую водку в тяжёлой бутылке с ценой вдвое выше рынка. Продукт был разработан под ценовую позицию, а не наоборот. Категория «супер-премиум» в водке фактически создана этим ходом."],["p","С этого момента конкуренция в водке — соревнование историй: число перегонок, ледниковая вода, фильтрация через серебро, кварц или бриллиантовую крошку. Влияние большинства этих приёмов на вкус минимально или недоказуемо."],["h","2.9. Сегодня: возврат к сырью"],["p","Обратная волна началась в 2010-е: часть производителей отказалась от идеи максимальной нейтральности и стала подчёркивать сырьё. Появились односортовые ржаные водки, картофельные с выраженной кремовостью, виноградные с фруктовым тоном."],["p","Параллельно возродились исторические категории — полугар, старка, — которые формально водкой уже не считаются, но происходят из той же традиции. Для бара это полезный ход: они дают то, чего в водке нет, — характер."]]],["3. Законодательство и определения",[["t",[["Юрисдикция","Требования"],["Евросоюз","Спирт сельскохозяйственного происхождения, минимум 37,5 % об. Если сырьё не зерно и не картофель, это должно быть указано на этикетке"],["США","Минимум 40 % об., нейтральный спирт, обработанный так, чтобы не иметь выраженного характера, аромата, вкуса и цвета"],["Россия","Ректификованный спирт из пищевого сырья и вода, крепость по ГОСТ обычно 40 % и выше"],["«Водочный пояс»","Неформальное понятие: Польша, Скандинавия, Прибалтика, Россия, Украина, Белоруссия — регионы традиционного производства с собственными стандартами"]]]]],["4. Сырьё: что реально слышно в бокале",[["t",[["Сырьё","Профиль","Примеры"],["Пшеница","Мягкая, слегка сладковатая, гладкая, с анисовым или цитрусовым хвостиком","Grey Goose, Absolut, Ketel One"],["Рожь","Суховатая, пряная, с перечным и хлебным тоном, характерная","Belvedere, Sobieski, Zubrówka Biała"],["Картофель","Плотная, маслянистая, кремовая текстура, землистая сладость","Chopin Potato, Luksusowa"],["Кукуруза","Мягкая, слегка сладкая, лёгкая","Tito's"],["Виноград","Фруктовая, лёгкая цветочность, деликатная","Cîroc"],["Меласса, свёкла","Нейтральная, часто дешёвая база; иногда приторный оттенок","Массовый сегмент"]]],["p","Разница наиболее заметна при комнатной температуре в чистом виде. При охлаждении до −18 °C и в коктейлях она почти полностью нивелируется — что и объясняет, почему традиция подавать водку ледяной так живуча."]]],["5. Производство",[["t",[["Этап","Что происходит","Значение"],["Затирание и брожение","Сырьё разваривают, осахаривают, сбраживают до 8–12 %","База формируется здесь; качество сырья важнее дальнейших «улучшений»"],["Ректификация","Многократная перегонка в колонне до 96 % об. и выше","Основной этап очистки. Именно здесь удаляются сивушные масла"],["«Число перегонок»","Маркетинговый параметр: в колонне непрерывного действия понятие «перегонка» условно","Пять, семь или сорок раз — цифра сопоставима только внутри одного производителя"],["Фильтрация","Древесный уголь — рабочий метод. Серебро, кварц, платина, бриллианты — преимущественно маркетинг","Чрезмерная фильтрация делает водку плоской: убирает не только дефекты, но и характер"],["Вода","Разбавление до товарной крепости деминерализованной или родниковой водой","До 60 % объёма бутылки — вода. Её минеральный состав влияет на восприятие мягкости"],["Добавки","В ряде юрисдикций разрешено немного сахара или глицерина для округлости","Объясняет «маслянистость» некоторых массовых марок"]]]]],["6. Марки: органолептика и применение",[["t",[["Марка","Сырьё / крепость","Аромат и вкус","Кому и как"],["Absolut","Озимая пшеница, Швеция, 40 %","Чистая, слегка зерновая, сухая, ровная","Универсальная база бара"],["Beluga Noble","Пшеница, Россия, 40 %","Мягкая, чуть сливочная, лёгкая сладость","Чистой, охлаждённой, к закуске"],["Russian Standard","Пшеница, Россия, 40 %","Сухая, зерновая, слегка перечная","Универсал, миксы, чистой"],["Grey Goose","Пшеница, Франция, 40 %","Мягкая, гладкая, лёгкий миндально-цитрусовый тон","Премиальные Martini и Cosmopolitan"],["Belvedere","Рожь, Польша, 40 %","Пряная, ванильно-хлебная, с ощутимым характером","Чистой и там, где нужен вкус базы"],["Chopin Potato","Картофель, Польша, 40 %","Плотная, маслянистая, кремовая, землистая сладость","Чистой; в Martini даёт тело"],["Ketel One","Пшеница, Нидерланды, 40 %","Свежая, цитрусовая, чистая, слегка медовая","Vodka Martini, Espresso Martini"],["Tito's","Кукуруза, США, 40 %","Мягкая, чуть сладковатая, простая","Массовые миксы"],["Cîroc","Виноград, Франция, 40 %","Фруктово-цветочная, лёгкая","Фруктовые коктейли"],["Zubrówka Bison Grass","Рожь с настоем зубровки, 40 %","Ваниль, свежескошенная трава, кумарин","Szarlotka с яблочным соком"],["Polugar","Историческая категория, 38,5 %","Хлебная, зерновая, с телом. Формально не водка","Дегустация, показать «водку до водки»"]]]]],["7. Классика на водке",[["t",[["Коктейль","Состав","Метод","Посуда и гарнир"],["Moscow Mule","50 мл водка, 15 мл лайм, имбирное пиво","Билд","Медная кружка. Лайм и мята"],["Bloody Mary","50 мл водка, 100 мл томатный сок, лимон, вустерский и табаско, соль, перец, сельдерейная соль","Роллинг между стаканами, не шейк","Хайбол. Стебель сельдерея, лимон"],["Cosmopolitan","40 мл цитрусовая водка, 15 мл Cointreau, 15 мл лайм, 30 мл клюквенный морс","Шейк","Купе. Апельсиновая цедра, можно поджечь"],["Espresso Martini","50 мл водка, 30 мл эспрессо, 15 мл кофейный ликёр, 5 мл сироп","Жёсткий шейк со свежим эспрессо","Купе. Три кофейных зерна"],["White Russian","50 мл водка, 25 мл кофейный ликёр, 30 мл сливки","Билд, сливки сверху","Олд-фэшнд. Без гарнира"],["Vodka Martini","60 мл водка, 10 мл сухой вермут","Стир (шейк — только по просьбе гостя)","Купе. Олива или лимонная цедра"],["Vesper","60 мл джин, 20 мл водка, 10 мл Lillet Blanc","Шейк по оригиналу","Купе. Широкая лимонная цедра"],["Screwdriver","50 мл водка, апельсиновый сок","Билд","Хайбол. Апельсин"],["Sea Breeze","50 мл водка, 90 мл клюквенный, 30 мл грейпфрутовый","Билд","Хайбол. Лайм"],["Lemon Drop","50 мл водка, 25 мл лимон, 20 мл сироп, 10 мл трипл-сек","Шейк","Купе с сахарной каймой. Цедра"],["Vodka Tonic","50 мл водка, тоник","Билд","Хайбол. Лайм или лимон"]]]]],["8. Практика за стойкой",[["h","Подача"],["p","Классическая подача — охлаждённой до −5…−18 °C, в рюмке или стопке, к закуске. Холод глушит спиртуозность и делает текстуру вязкой."],["p","Дегустационная подача — при 10–15 °C в тюльпане. Только так слышны различия сырья. Если гость хочет сравнить марки, ледяная подача бессмысленна."],["p","Бутылку в морозилке держать можно и нужно, если водка идёт чистой. Для коктейлей это не обязательно: лёд всё равно охладит."],["p","Vodka Martini: стир по умолчанию. Шейк даёт мутность и осколки льда — если гость просит «взболтать, не смешивать», это его право, но по умолчанию так не делают."],["h","Что стоит знать"],["p","Дороже не значит чище. Разница между средним и супер-премиум сегментом в слепых дегустациях часто не подтверждается. Платят за бутылку и историю."],["p","«Пять раз перегнанная» — не сопоставимый параметр между брендами. В непрерывной колонне понятие перегонки условно."],["p","Водка не портится и не улучшается со временем. Открытая бутылка стабильна годами."],["p","Мутность или осадок — признак проблемы, а не характера: в водке это дефект, в отличие от нефильтрованного виски."],["p","Ароматизированные водки почти всегда содержат сахар. Это влияет на баланс коктейля: сироп нужно уменьшать."],["p","Espresso Martini делается только на свежесваренном эспрессо. Холодный кофе не даёт пены, и коктейль выглядит и пьётся принципиально хуже."]]],["9. Мини-глоссарий",[["t",[["Термин","Значение"],["Ректификация","Многократная перегонка в колонне для получения спирта высокой чистоты"],["Сивушные масла","Высшие спирты и примеси, дающие резкость; удаляются при очистке"],["Угольная фильтрация","Пропускание через активированный уголь — основной рабочий метод очистки"],["Хлебное вино / полугар","Историческая российская категория зернового дистиллята около 38,5 %"],["Старка","Выдержанный в дубе зерновой дистиллят польско-литовской традиции"],["Зубровка","Водка, настоянная на зубровке душистой; характерный травяной тон"],["Водочный пояс","Регионы Северной и Восточной Европы с традицией потребления крепкого"],["Neutral grain spirit","Нейтральный зерновой спирт — сырьё для водки, джина и ликёров"],["Роллинг","Метод перелива между стаканами; применяется для Bloody Mary, чтобы не разрушить текстуру"]]]]]]],["РОМ","Справочник бармена",[["1. Что такое ром",[["p","Ром — крепкий напиток, получаемый сбраживанием и перегонкой продуктов сахарного тростника: либо мелассы (патоки, побочного продукта производства сахара), либо свежевыжатого тростникового сока."],["p","Ключевая особенность категории: единого международного закона не существует. У виски есть жёсткие национальные стандарты, у рома — набор разрозненных правил, различающихся от острова к острову. Барбадос, Ямайка, Мартиника, Куба, Гайана — у каждого свои требования, а во многих юрисдикциях требований почти нет вовсе."],["p","Практическое следствие: «ром 12 лет» из одной страны и из другой могут означать совершенно разное. Где-то это возраст самого молодого компонента, где-то — среднее, а где-то — номер солеры, вообще не связанный с выдержкой. Ром — категория, в которой этикетке верить нужно осторожнее всего."]]],["2. История",[["h","2.1. Тростник: путь из Азии в Карибы"],["p","Сахарный тростник родом из Новой Гвинеи; через Индию и Персию он попал в Средиземноморье, а оттуда — на атлантические острова Португалии и Испании. Христофор Колумб во втором плавании 1493 года привёз тростник на Эспаньолу, и культура прижилась в идеальном для неё климате."],["p","Ранние формы перегонки тростниковых продуктов фиксируются и в Азии (арак, брум), но ром как индустрия сформировался именно в Карибском бассейне — там, где сахарное производство было массовым и порождало огромные объёмы отходов."],["h","2.2. Барбадос XVII века: «убийца дьявола»"],["p","Меласса — вязкий тёмный остаток после кристаллизации сахара — долгое время считалась мусором. В 1640-х годах на Барбадосе её начали сбраживать и перегонять, и получившийся напиток был настолько груб, что его называли kill-devil, «убийца дьявола», и rumbullion — диалектное слово, означавшее примерно «буйство, драка». От второго, по наиболее распространённой версии, и произошло слово rum."],["p","Барбадос до сих пор претендует на звание родины рома; Mount Gay ведёт документированную историю с 1703 года и считается одной из старейших действующих ромовых марок мира."],["h","2.3. Треугольная торговля"],["p","Историю рома невозможно рассказывать честно, обойдя её основание: сахарные плантации Карибов работали на труде порабощённых африканцев. Сложилась так называемая треугольная торговля — товары из Европы в Африку, порабощённые люди из Африки в Америку, сахар и ром из Америки в Европу и Новую Англию."],["p","Ром был не просто товаром, а валютой этой системы: в Новой Англии выросли десятки перегонных заводов, работавших на карибской мелассе, и ром использовался в расчётах напрямую. Британский Закон о мелассе 1733 года и последующий Сахарный акт 1764-го, ударившие по этой торговле, входят в число экономических причин Американской революции."],["p","Это не тот сюжет, который уместно подавать гостю как забавную байку. Но знать его нужно: он объясняет, почему ром — карибский напиток, почему производство сконцентрировано именно там и почему у категории такая сложная репутация."],["h","2.4. Королевский флот: грог и Чёрная бочка"],["p","С 1655 года, после захвата Ямайки, Королевский флот заменил матросскую норму пива и бренди на ром. Ежедневная выдача составляла полпинты чистого рома, что предсказуемо сказывалось на боеспособности."],["p","В 1740 году адмирал Эдвард Вернон приказал разбавлять ром водой в пропорции один к четырём и добавлять сок цитрусовых и сахар. Вернон носил плащ из ткани грогрэм, за что имел прозвище Old Grog — смесь получила название грог. Цитрус в составе, как выяснилось позже, работал против цинги."],["p","Крепость проверяли порохом: ром смешивали с порохом и поджигали. Если смесь горела ровно — ром «выдержал пробу», proof. Отсюда британская система крепости, где 100 proof соответствует примерно 57 % об."],["p","Ромовая норма продержалась в британском флоте более трёх веков и была отменена 31 июля 1970 года. Этот день моряки называют Black Tot Day — «День чёрной чарки»."],["h","2.5. Пираты, каперы и репутация"],["p","Золотой век пиратства (примерно 1650–1730) совпал с расцветом карибского рома географически и хронологически. Ром был дёшев, доступен в любом порту и не портился в тропиках — в отличие от воды и пива."],["p","Романтический образ пирата с бутылкой рома, впрочем, во многом создан литературой XIX века и кинематографом XX. Реальность была прозаичнее: ром был флотским пайком и портовой валютой, а не атрибутом приключения."],["h","2.6. Куба XIX века: рождение лёгкого рома"],["p","Переломный момент для стиля — Куба середины XIX века. Испанская корона объявила конкурс на улучшение качества местного рома, и в 1862 году Факундо Бакарди в Сантьяго-де-Куба применил комбинацию приёмов: культивированные дрожжи, перегонку в колонне, фильтрацию через древесный уголь и выдержку в дубе."],["p","Результатом стал ron ligero — светлый, мягкий, чистый ром, радикально отличавшийся от тяжёлых английских и ямайских стилей. Именно он сделал возможными коктейли, где ром не забивает остальные компоненты: Daiquiri, Mojito, Cuba Libre."],["h","2.7. Сухой закон и Гавана"],["p","С 1920 по 1933 год Гавана стала ближайшим к США городом, где можно было легально пить. Американцы ехали туда пароходами, а кубинские бармены получили платёжеспособную аудиторию и повод для изобретательства."],["p","В эти годы сложился канон кубинского коктейля: бар El Floridita и Константино Рибалагуа довели до совершенства Daiquiri, включая замороженную версию; Эрнест Хемингуэй сделал этим заведениям рекламу, которая работает до сих пор. Cuba Libre, Mojito, El Presidente — всё это наследие того периода."],["h","2.8. Тики: как Полинезию придумали в Голливуде"],["p","В 1934 году Эрнест Гэнт, взявший имя Дон Бич, открыл в Голливуде бар Don the Beachcomber. Он собрал вымышленную «полинезийскую» эстетику — маски, бамбук, факелы — и построил на ней меню из сложносоставных ромовых коктейлей с несколькими видами рома, соками, сиропами и специями."],["p","Конкурент Виктор Берджерон (Trader Vic) развил направление и, по наиболее принятой версии, создал Mai Tai в 1944 году. Тики-бум длился до 1960-х и оставил после себя целый пласт техники: смешивание нескольких ромов разных стилей в одном напитке, дроблёный лёд, орже, фалернум."],["p","Честная оговорка: тики не имеет отношения к настоящей полинезийской культуре и построен на её стилизации. Современные бары всё чаще уходят от слова «тики» к нейтральному «тропический» именно по этой причине."],["h","2.9. 1959 год и раскол"],["p","Кубинская революция и последовавшая национализация вынудили семью Бакарди покинуть остров; производство переехало в Пуэрто-Рико, Мексику и на Багамы. Государственная кубинская индустрия продолжила работу отдельно — так появился Havana Club, права на который до сих пор оспариваются в судах между кубинским государством и Bacardi."],["p","Американское эмбарго на десятилетия закрыло Кубе крупнейший рынок и разделило «кубинский стиль» на две независимые ветви."],["h","2.10. Современность: агриколь, крафт и вопрос сахара"],["p","В 1996 году ром с Мартиники получил AOC — французское защищённое наименование, первое в категории. Rhum agricole делается из свежего тростникового сока, а не из мелассы, и обладает совершенно другим, травянисто-землистым характером."],["p","Параллельно шёл рост интереса к «честному» рому. Выяснилось, что многие популярные марки добавляют в готовый продукт сахар — иногда десятки граммов на литр — для округлости вкуса. Это законно почти везде, но искажает восприятие: подслащённый ром кажется старше и мягче, чем он есть. Барбадос, Ямайка и Мартиника имеют строгие правила на этот счёт, многие другие производители — нет."],["p","Отдельный маркетинговый сюжет — «солера» на этикетке. В хересе это система непрерывного долива с реальным средним возрастом; в роме число рядом со словом solera часто означает лишь номер системы или максимальный возраст малой доли содержимого."]]],["3. Классификации: почему их несколько",[["p","Ром классифицируют минимум четырьмя способами одновременно, и они не совпадают. Это главная причина путаницы в категории."],["t",[["Признак","Деление","Насколько надёжно"],["По цвету","Белый, золотой, тёмный","Наименее надёжно: цвет даётся карамельным колером так же часто, как выдержкой"],["По сырью","Молассовый и агриколь (из свежего сока)","Надёжно и слышно в бокале: агриколь травянистый, молассовый сладкий"],["По школе","Испанская, английская, французская","Полезнее всего для прогноза вкуса; отражает колониальную историю"],["По выдержке","Белый, añejo, extra añejo, XO","Условно: правила разнятся по странам, единого стандарта нет"]]]]],["4. Категории рома",[["t",[["Категория","Крепость","Характер","Применение"],["Белый / Blanco","37,5–40 %","Лёгкий, чистый, сахарно-цитрусовый. Часто выдержан, но отфильтрован до прозрачности","Daiquiri, Mojito, база лёгких коктейлей"],["Золотой / Oro","37,5–40 %","Мягкая ваниль, карамель, лёгкий дуб","Универсал: хайболы, миксы"],["Тёмный / Dark","40–43 %","Патока, жжёный сахар, изюм. Цвет часто усилен колером","Тропические коктейли, Dark'n'Stormy"],["Выдержанный / Añejo, XO","40–45 %","Дуб, ваниль, сухофрукты, табак. Тропическая выдержка идёт втрое быстрее","Чистым, Rum Old Fashioned"],["Overproof","57–75,5 %","Концентрированный, жгучий, мощный","Флоат в тики, поджиг, малыми долями в бленде"],["Navy Rum","54,5–57 %","Плотный, тёмный, купаж карибских стилей в британской традиции","Grog, Navy Grog, тики"],["Spiced","35–40 %","Ароматизирован ванилью, корицей, гвоздикой, цитрусом. Часто подслащён","Кола, простые миксы. Не для классики"],["Rhum agricole","40–55 %","Свежий тростниковый сок: трава, олива, земля, солёность. Совершенно другой вкус","Ti' Punch, Mai Tai, авторские"],["Cachaça","38–48 %","Бразильский родственник агриколя: свежий сок, фруктовость, иногда местные породы дерева","Caipirinha, Batida"],["Ямайский high ester","40–63 %","«Фанк»: перезрелый банан, лак, ацетон, тропические фрукты. Очень выразительный","Тики, малыми долями для характера"],["Demerara (Гайана)","40–57 %","Дымность, жжёный сахар, деревянные колонны XIX века","Тики, Navy-стиль, чистым"]]]]],["5. Три школы: испанская, английская, французская",[["t",[["Школа","Регион","Технология","Профиль"],["Испанская (ron)","Куба, Пуэрто-Рико, Д
