Хайбол. Букет мяты"],["Cuba Libre","50 мл ром, 15 мл лайм, кола","Билд","Хайбол. Долька лайма"],["Piña Colada","50 мл ром, 30 мл кокосовые сливки, 90 мл ананасовый сок","Шейк или бленд","Харрикейн. Ананас и вишня"],["Mai Tai","30 мл ямайский + 30 мл агриколь, 15 мл оранж-кюрасао, 15 мл орже, 25 мл лайм","Шейк, дроблёный лёд","Олд-фэшнд. Мята и половина лайма"],["Dark 'n' Stormy","60 мл Goslings Black Seal, имбирное пиво, лайм","Билд, ром флоатом сверху","Хайбол. Лайм. Слоистая подача"],["Painkiller","60 мл ром, 120 мл ананас, 30 мл апельсин, 30 мл кокосовые сливки","Шейк","Тумблер. Мускатный орех сверху"],["Hurricane","60 мл тёмный ром, 30 мл маракуйя, 25 мл лимон, 15 мл сироп","Шейк","Харрикейн. Апельсин и вишня"],["Ti' Punch","60 мл агриколь, 5 мл тростниковый сироп, кружок лайма","Билд без льда, гость мешает сам","Низкий стакан. Лайм в напитке"],["Caipirinha","60 мл кашаса, половина лайма дольками, 2 ч. л. сахара","Мадл лайма с сахаром, дроблёный лёд","Олд-фэшнд. Лайм"],["Jungle Bird","45 мл тёмный ром, 22 мл Campari, 45 мл ананас, 15 мл лайм, 15 мл сироп","Шейк","Олд-фэшнд. Ананас"],["El Presidente","45 мл белый ром, 22 мл сухой вермут, 15 мл оранж-кюрасао, 5 мл гренадин","Стир","Купе. Апельсиновая цедра"],["Zombie","Три вида рома, лайм, фалернум, гренадин, абсент, специи","Шейк, дроблёный лёд","Высокий тики-бокал. Мята"],["Rum Old Fashioned","60 мл выдержанный ром, 7 мл сироп, дэши ангостуры","Стир","Олд-фэшнд. Апельсиновая цедра"]]]]],["9. Практика за стойкой",[["h","Что важно помнить"],["p","Цвет ничего не гарантирует. Тёмный ром может быть трёхлетним с колером, светлый — выдержанным и отфильтрованным. Спрашивать нужно про сырьё и школу, а не про цвет."],["p","Возраст на этикетке рома читается иначе, чем у виски. Уточняйте, что означает число: возраст самого молодого компонента, средний или номер солеры."],["p","Добавленный сахар — ключ к пониманию сладких марок. Если ром кажется «десертным» при 40 %, скорее всего дело не в бочке."],["p","Тропическая выдержка идёт в три-четыре раза быстрее. Восьмилетний карибский ром по дубовой насыщенности близок к двадцатилетнему шотландцу — сравнивать цифры напрямую бессмысленно."],["p","Агриколь нельзя подставлять вместо молассового рома в рецепте один к одному: получится другой коктейль. Это осознанная замена, а не эквивалент."],["p","В тики-коктейлях смешивание нескольких ромов — не понты, а метод: лёгкий даёт объём, ямайский — аромат, demerara — глубину, overproof — крепость."],["h","Подача"],["p","Выдержанный ром — тюльпан или гленкейрн, комнатная температура, без льда для первой пробы."],["p","Белый ром чистым почти не подают: он существует ради коктейлей."],["p","Лайм в ромовых коктейлях — только свежевыжатый. Бутилированный сок разрушает Daiquiri сильнее, чем плохой ром."],["p","Daiquiri — тест на бармена. Три ингредиента, ничего не спрятать: неверный баланс или недостаточное охлаждение видно сразу."]]],["10. Мини-глоссарий",[["t",[["Термин","Значение"],["Меласса","Патока: вязкий остаток после кристаллизации сахара из тростника"],["Vesou","Свежевыжатый тростниковый сок — сырьё для агриколя"],["Rhum agricole","Ром из свежего сока; на Мартинике защищён AOC с 1996 года"],["Dunder","Остаток от предыдущей перегонки, добавляемый в брагу для усиления эфиров"],["High ester / Funk","Ямайский стиль с высоким содержанием эфиров: банан, лак, тропические фрукты"],["Overproof","Ром крепостью выше 57 %; исторически связан с пороховой пробой"],["Solera","В хересе — система непрерывного долива; в роме число рядом с этим словом часто маркетинговое"],["Demerara","Ром из Гайаны, часто с исторических деревянных перегонных аппаратов"],["Кашаса","Бразильский дистиллят из свежего тростникового сока, юридически отдельная категория"],["Орже (orgeat)","Миндально-цветочный сироп, обязательный компонент Mai Tai"],["Фалернум","Сироп или ликёр с лаймом, имбирём, гвоздикой и миндалём; база тики"],["Black Tot Day","31 июля 1970 года — отмена ромовой нормы в британском флоте"]]]]]]],["ТЕКИЛА И МЕСКАЛЬ","Справочник бармена",[["1. Что такое текила",[["p","Текила — дистиллят из сердцевины голубой агавы (Agave tequilana Weber var. azul), произведённый в пределах защищённой зоны наименования в Мексике. Агава — не кактус: это суккулент семейства спаржевых, ближе к лилиям, чем к кактусам. Растение созревает от шести до восьми лет, у некоторых сортов до пятнадцати."],["p","Зона наименования охватывает целиком штат Халиско и отдельные муниципалитеты Гуанахуато, Мичоакана, Наярита и Тамаулипаса. Всё остальное — не текила, даже если сделано из той же агавы теми же руками."],["p","Номер NOM на этикетке — самый полезный признак. Это четырёхзначный код винокурни. Разные бренды с одинаковым NOM произведены на одной площадке; часто это единственный способ понять, что за «крафтовой» этикеткой стоит крупный завод."]]],["2. История",[["h","2.1. Пульке: напиток до испанцев"],["p","Задолго до прихода европейцев народы Центральной Мексики сбраживали агавовый сок агуамьель и получали пульке — мутный слабоалкогольный напиток с молочной кислинкой. Он имел сакральный статус: его пили на ритуалах, а богиня Майяуэль олицетворяла агаву."],["p","Перегонки коренные народы не знали, поэтому крепких агавовых напитков до контакта не существовало."],["h","2.2. Испанцы приносят перегонку"],["p","Конкистадоры привезли технологию дистилляции в XVI веке. Когда запасы привезённого бренди закончились, они применили перегонку к местному сырью — так появился «мескаль», общее название агавовых дистиллятов. Вино из агавы стало массовым к концу столетия."],["p","Корона неоднократно запрещала производство, защищая импорт испанского вина и бренди, но запреты работали плохо, а налоги с легального производства оказались выгоднее."],["h","2.3. Куэрво, Сауса и голубая агава"],["p","В 1795 году Хосе Мария Гуадалупе де Куэрво получил от испанской короны первую официальную лицензию на производство агавового вина — это делает Cuervo старейшим действующим брендом категории."],["p","Ключевой шаг сделал Сенобио Сауса: во второй половине XIX века он определил голубую агаву как оптимальный сорт и стал использовать только её. Это решение легло в основу того, что сегодня юридически называется текилой."],["h","2.4. Железная дорога и рынок США"],["p","Железная дорога, связавшая Гвадалахару с побережьем и границей, превратила локальный напиток в экспортный товар. Первые отгрузки в США датируются 1870-ми годами."],["p","Второй скачок дал сухой закон: приграничные города наполнились американцами, а текила стала одним из очевидных вариантов. Третий — Вторая мировая, когда европейские поставки крепкого прервались, и текила заняла освободившееся место на американской полке."],["h","2.5. Наименование по происхождению и CRT"],["p","В 1974 году Мексика официально закрепила Denominación de Origen на текилу и объявила слово государственной собственностью. С 1994 года действует Consejo Regulador del Tequila (CRT) — регулятор, который сертифицирует производство, присваивает номера NOM и контролирует соответствие стандарту."],["p","Это одна из наиболее жёстко контролируемых категорий крепкого алкоголя в мире: инспектор CRT физически присутствует на производствах, а каждая партия отслеживается."],["h","2.6. Маргарита: четыре версии одной легенды"],["p","Происхождение самого известного текильного коктейля документально не установлено. Существует минимум четыре конкурирующие версии, каждая с именами и датами: бармен в Тихуане, назвавший напиток в честь актрисы; хозяйка вечеринки в Акапулько; бармен в Хуаресе; и владелица ресторана в Техасе."],["p","Наиболее вероятное объяснение проще и скучнее: Margarita — это прямая адаптация коктейля Daisy (по-испански «маргаритка») с заменой базы на текилу. Такие коктейли документированы ещё в 1930-х."],["p","За стойкой: честнее сказать «единой версии нет, есть четыре», чем уверенно назвать одну. Это интереснее и точнее."],["h","2.7. Бум 2000-х и агавовые циклы"],["p","С 2000-х текила прошла премиализацию: из напитка для шотов она превратилась в категорию для медленного питья, с añejo, extra añejo и высокими ценами. Отдельный феномен — бренды, запущенные знаменитостями; часть из них сделала для категории больше, чем десятилетия традиционного маркетинга."],["p","Обратная сторона — агавовые циклы. Растение зреет годами, а спрос меняется быстро. Периодически возникает дефицит агавы и резкий рост закупочных цен, за которым следует перепроизводство и обвал. Эти циклы напрямую отражаются на качестве массовых марок: при дефиците чаще используют молодую агаву и промышленные методы извлечения."],["h","2.8. Мескаль выходит из тени"],["p","Мескаль долго считался деревенским, «грубым» родственником текилы — во многом из-за легенды о черве в бутылке, который был маркетинговым ходом середины XX века, а не традицией."],["p","С 2010-х произошёл разворот: мескаль стал восприниматься как ремесленный продукт с терруаром, десятками сортов агавы и ручной технологией. Сегодня хороший мескаль стоит дороже большинства текил, а бармены ценят его именно за непредсказуемость."]]],["3. Категории текилы",[["t",[["Категория","Выдержка","Характер","Применение"],["Blanco / Plata / Silver","Без выдержки или до 2 месяцев","Чистый вкус агавы: перец, зелень, цитрус, минеральность, лёгкая сладость печёной агавы","Маргарита, Палома, всё, где нужен вкус агавы"],["Reposado","От 2 до 12 месяцев в дубе","Агава плюс ваниль и мягкая карамель, округлее и мягче","Универсал: коктейли и чистым"],["Añejo","От 1 до 3 лет в бочках до 600 л","Дуб выходит вперёд: ваниль, специи, сухофрукты. Агава отступает","Чистым, Tequila Old Fashioned"],["Extra Añejo","Более 3 лет","Плотный, дубовый, близок к выдержанному виски по восприятию","Только чистым, дегустационно"],["Cristalino","Añejo, отфильтрованный до прозрачности","Дубовая сладость без цвета. Категория спорная: фильтрация снимает часть характера","Гость, которому нравится идея «прозрачного выдержанного»"],["Joven / Oro","Смесь blanco с выдержанной или подкрашенная","Чаще всего mixto с колером. Массовый сегмент","Шоты, бюджетные миксы"]]]]],["4. 100 % агава против mixto",[["p","Это самое важное различие в категории, и оно определяет качество сильнее, чем возраст и цена."],["t",[["Тип","Состав","Как распознать","Что в бокале"],["100 % de agave","Только сахара голубой агавы","На этикетке обязательно написано «100 % de agave». Розлив только в Мексике","Чистый агавовый вкус, ясная структура, мягкое похмелье"],["Mixto","Минимум 51 % агавы, до 49 % посторонних сахаров (обычно тростниковых)","Надписи «100 %» нет. Может разливаться за пределами Мексики","Резкость, спиртуозность, часто сладковатый привкус"]]],["p","Правило для бара: отсутствие надписи «100 % de agave» означает mixto. Разница ощутима даже в коктейле, а репутация текилы как напитка, от которого плохо наутро, выросла именно на mixto эпохи шотов."]]],["5. Производство: где теряется характер",[["t",[["Этап","Традиционно","Промышленно","Разница во вкусе"],["Уборка","Химадор вручную срезает листья, оставляя пинью — сердцевину весом 40–90 кг","То же, механизации почти нет","Профессия химадора остаётся ручной, знание передаётся в семьях"],["Приготовление","Каменная или кирпичная печь орно, 24–72 часа медленного пропаривания","Автоклав под давлением, 6–12 часов","Печь даёт печёную сладость и сложность; автоклав — плоский, «варёный» вкус"],["Извлечение сока","Тахона — каменный жёрнов, вращаемый по кругу; или ручной пресс","Шреддер-мельница; в худшем случае диффузор с горячей водой и кислотой","Диффузор извлекает максимум сахара и минимум вкуса. Считается главным врагом качества"],["Брожение","Открытые чаны, дикие дрожжи, иногда с волокнами агавы","Закрытые танки, культивированные дрожжи, ускорители","Дикое брожение даёт фруктовость и непредсказуемость"],["Перегонка","Медный куб, двойная перегонка","Колонна или комбинация","Медь и куб сохраняют тело; колонна выравнивает"],["Выдержка","Американский или французский дуб, бочки до 600 л","То же, иногда с добавками для цвета","Малая бочка отдаёт быстрее; при агрессивном дубе агава пропадает"]]]]],["6. Мескаль и другие агавовые",[["p","Мескаль — родовое понятие: любой агавовый дистиллят Мексики в пределах своей зоны наименования. Текила, строго говоря, тоже мескаль, просто выделенный в отдельную защищённую категорию."],["t",[["Напиток","Сырьё и регион","Характер"],["Mezcal","Более 30 сортов агавы; Оахака и ещё несколько штатов. Агаву запекают в земляных ямах на углях и камнях","Дым — визитная карточка, но за ним минеральность, цитрус, зелень, кожа. Espadín — базовый сорт, Tobalá и Tepeztate — дикие и дорогие"],["Raicilla","Халиско, побережье и горы. Разные сорта агавы","Часто без дыма: фруктовый, травянистый, острый"],["Bacanora","Сонора, агава Pacifica. Легализован только в 1992 году","Сухой, землистый, дымный, деревенский характер"],["Sotol","Чиуауа и север. Растение Dasylirion — не агава вовсе","Травянисто-минеральный, зелёный, «пустынный». Юридически отдельная категория"],["Pulque","Сброженный агуамьель, не перегоняется. Крепость 4–6 %","Мутный, вязкий, кисломолочный. Почти не экспортируется из-за нестабильности"]]],["h","Категории мескаля по технологии"],["p","Mezcal — допускает промышленные методы, автоклавы и колонны."],["p","Mezcal Artesanal — печь в яме или наземная, измельчение тахоной или вручную, перегонка в меди или глине."],["p","Mezcal Ancestral — самая строгая: земляная яма, ручное измельчение, перегонка только в глиняных горшках. Наименее масштабируемая и самая редкая."],["p","Про червя: гусеница в бутылке — маркетинг 1940–50-х годов, а не традиция и не признак качества. Серьёзные производители мескаля червя не кладут. Знать это полезно: вопрос задают часто."]]],["7. Марки: органолептика и применение",[["t",[["Марка","Тип / крепость","Аромат и вкус","Кому и как"],["Olmeca Altos Plata","Blanco, 100 % агава, 38 %","Тахона в производстве: чистая агава, цитрус, перец. Создан барменами под коктейли","Рабочая Маргарита и Палома"],["Espolòn Blanco","Blanco, 100 % агава, 40 %","Яркая агава, зелёный перец, лёгкая сладость","Коктейли, хорошее соотношение цены и качества"],["Fortaleza Blanco","Blanco, 100 % агава, 40 %","Печь орно и тахона: насыщенная печёная агава, олива, масляное тело","Чистым, дегустация, эталон традиционного стиля"],["Ocho Plata","Blanco, 100 % агава, 40 %","Single estate, урожай конкретного поля и года. Терруарная концепция","Показать гостю идею терруара в текиле"],["Patrón Silver","Blanco, 100 % агава, 40 %","Мягкий, цитрусово-цветочный, гладкий. Сильный бренд","Гость, знающий марку; премиальная Маргарита"],["Don Julio Reposado","Reposado, 100 % агава, 38 %","Ваниль, карамель, агава на заднем плане, очень мягкий","Универсал, чистым и в миксах"],["Cazadores Reposado","Reposado, 100 % агава, 40 %","Пряный, дубовый, с ощутимой агавовой основой","Коктейли с характером"],["Don Julio 1942","Añejo, 100 % агава, 38 %","Ваниль, карамель, шоколад, дуб. Статусная позиция","Чистым, дорогая подача"],["Herradura Añejo","Añejo, 100 % агава, 40 %","Классический дубовый профиль, сухофрукты, специи","Чистым, Tequila Old Fashioned"],["Del Maguey Vida","Мескаль espadín, 42 %","Умеренный дым, цитрус, зелень, минеральность. Создан под коктейли","Мескалевые коктейли, знакомство с категорией"],["Montelobos Espadín","Мескаль artesanal, 43,2 %","Дым, травы, перец, выраженная кислотность","Naked & Famous, Oaxaca Old Fashioned"],["Ilegal Joven","Мескаль, 40 %","Сбалансированный дым, фрукты, мягкость","Гость, впервые пробующий мескаль"]]]]],["8. Классика на агаве",[["t",[["Коктейль","Состав","Метод","Посуда и гарнир"],["Margarita","50 мл blanco, 25 мл лайм, 20 мл трипл-сек","Шейк","Купе или маргарита. Соляная кайма по половине кромки"],["Tommy's Margarita","60 мл blanco, 30 мл лайм, 15 мл агавовый сироп","Шейк","Олд-фэшнд. Без соли. Чище и агавнее классики"],["Paloma","50 мл blanco, 15 мл лайм, грейпфрутовый газированный напиток, щепотка соли","Билд","Хайбол. Грейпфрут. В Мексике популярнее Маргариты"],["Ranch Water","50 мл blanco, 20 мл лайм, минеральная вода","Билд","Хайбол. Лайм. Максимально сухой и лёгкий"],["El Diablo","45 мл reposado, 15 мл crème de cassis, 15 мл лайм, имбирное пиво","Билд","Хайбол. Лайм"],["Batanga","50 мл blanco, лайм, кола, соляная кайма","Билд, размешать ножом","Хайбол. Классика бара La Capilla"],["Oaxaca Old Fashioned","45 мл reposado, 15 мл мескаль, 5 мл агавовый сироп, дэши биттера","Стир","Олд-фэшнд. Апельсиновая цедра, поджечь по желанию"],["Naked & Famous","По 22 мл: мескаль, Aperol, жёлтый шартрез, лайм","Шейк","Купе. Без гарнира"],["Mezcal Negroni","30 мл мескаль, 30 мл Campari, 30 мл красный вермут","Стир","Олд-фэшнд. Апельсиновая цедра"],["Tequila Sunrise","50 мл blanco, 120 мл апельсиновый сок, 10 мл гренадин","Билд, гренадин по стенке","Хайбол. Апельсин и вишня"],["Sangrita (запивка)","Томат или апельсин, лайм, чили, соль","Подаётся отдельной рюмкой","Традиционная мексиканская подача к blanco вместо соли и лайма"]]]]],["9. Практика за стойкой",[["h","Мифы, которые придётся разбирать"],["p","Соль и лайм — ритуал для дешёвой mixto, где нужно заглушить вкус. Хорошую 100 % агава подают чистой, в бокале-вельядоре или узком тюльпане, и запивают сангритой."],["p","Текилу не пьют залпом. Категория премиализировалась, и añejo стоит как приличный виски — шотами его никто не пьёт."],["p","Червь в бутылке — не признак подлинности и вообще не имеет отношения к текиле."],["p","Мескаль не обязан быть дымным. Дым — следствие запекания на углях, а не обязательное свойство; есть недымные мескали и raicilla."],["p","Текила не «бодрит» и не действует иначе, чем другой алкоголь. Разница в самочувствии между mixto и 100 % агава реальна, но объясняется составом сахаров, а не мистикой."],["h","Подача и техника"],["p","Соляная кайма — только на половине кромки, чтобы гость мог выбрать. Соль наносится снаружи, не внутрь бокала."],["p","Лайм только свежий. Маргарита на концентрате — самый частый способ испортить популярный коктейль."],["p","Агавовый сироп смешивается с водой один к одному перед использованием, иначе он слишком плотный и плохо расходится."],["p","Мескаль в коктейле работает малой долей: 10–15 мл добавляют дым и глубину, не перебивая базу."],["p","Для дегустации — узкий бокал (вельядора или тюльпан), комнатная температура, маленькими глотками. Ледяная текила теряет весь агавовый профиль."]]],["10. Мини-глоссарий",[["t",[["Термин","Значение"],["Пинья","Сердцевина агавы после срезания листьев, внешне похожа на ананас"],["Химадор","Работник, вручную срезающий агаву специальным инструментом коа"],["Орно (horno)","Каменная или кирпичная печь для медленного запекания пиний"],["Тахона","Каменный жёрнов для измельчения печёной агавы"],["Диффузор","Промышленная установка извлечения сахаров горячей водой; максимум выхода, минимум вкуса"],["NOM","Четырёхзначный номер винокурни на этикетке — ключ к тому, кто реально произвёл напиток"],["CRT","Регулятор текильной отрасли, сертифицирующий производство"],["Mixto","Текила из 51 % агавы и до 49 % посторонних сахаров"],["Agua miel","Сладкий сок живой агавы, сырьё для пульке"],["Espadín","Основной культивируемый сорт агавы для мескаля"],["Tobalá, Tepeztate","Дикие сорта агавы; растут десятилетиями, отсюда цена"],["Sangrita","Острая томатно-цитрусовая запивка, подаётся отдельно к текиле"],["Вельядора","Традиционный низкий широкий стакан для мескаля"]]]]]]],["ВИСКИ","Справочник бармена",[["1. Что такое виски",[["p","Виски — крепкий напиток, получаемый дистилляцией сброженного зернового сусла с последующей выдержкой в дубовых бочках. Три обязательных элемента: зерно, дистилляция, дуб. Уберите дуб — получится зерновой спирт (в Штатах его называют white dog, «белая собака»); уберите зерно — это уже не виски."],["p","В отличие от джина, где закон почти ничего не требует, виски — одна из самых зарегулированных категорий. Каждая страна защищает свой стиль отдельным законодательством, и различия принципиальны."],["p","Whisky или whiskey? Через «e» пишут Ирландия и США, без «e» — Шотландия, Канада, Япония и большинство новых мировых производителей. Исключения есть (американский Maker's Mark пишет whisky), но правило рабочее. За стойкой это удобный маркер: по написанию на этикетке часто угадывается происхождение."]]],["2. История",[["h","2.1. Истоки: aqua vitae и монастыри"],["p","Дистилляция пришла в Европу через арабский мир — техника перегонки описана арабскими алхимиками, а в Европу попала через мавританскую Испанию и Салернскую медицинскую школу примерно к XII веку. Первоначально её применяли не для питья, а для получения лекарств, духов и эфирных масел."],["p","Носителями знания стали монастыри: там были грамотные люди, оборудование и излишки зерна. Латинское aqua vitae — «вода жизни» — было медицинским термином, и первый виски в современном понимании был именно лекарством: средством от колик, оспы, паралича и «холодной природы желудка»."],["p","Ирландия и Шотландия до сих пор спорят о первенстве. Ирландская версия опирается на монахов, привёзших перегонку раньше; шотландская — на первую письменную фиксацию. Достоверных документов, закрывающих спор, нет, и правильный ответ бармена — рассказать обе версии."],["h","2.2. 1494: первая запись"],["p","Самое раннее документальное упоминание виски — запись в шотландских казначейских свитках (Exchequer Rolls) за 1494 год: восемь боллов солода отпущено брату Джону Кору для изготовления aqua vitae."],["p","Деталь, которую стоит понимать: восемь боллов — это примерно полторы тонны солода, из которых можно получить порядка полутора тысяч бутылок. То есть в 1494 году производство уже было налаженным и масштабным, а не экспериментальным. Виски существовал задолго до этой записи — просто её сохранил архив."],["h","2.3. Этимология: от uisge beatha к whisky"],["p","Гэльский перевод латинского aqua vitae — uisge beatha (шотландский вариант) или uisce beatha (ирландский), произносится примерно «ишке беха». Английские солдаты и торговцы упростили непроизносимое слово: uisge → usky → whisky."],["p","То есть «виски» буквально означает «вода» — вторая половина словосочетания просто отпала. Хорошая история для гостя, и при этом абсолютно достоверная."],["h","2.4. Налоги, контрабанда и Акт 1823 года"],["p","Роспуск монастырей Генрихом VIII в 1530-х годах выбросил монахов-дистилляторов в мир — знание разошлось по фермам и деревням. Виски стал крестьянским продуктом: способом сохранить излишки ячменя и пережить зиму."],["p","В 1644 году шотландский парламент ввёл первый акциз на спиртное. Дальше — полтора века войны государства с горцами. Пошлины росли, легальное производство становилось невыгодным, и Хайленд ушёл в подполье: перегонка велась ночью при свете луны (отсюда moonshine), спирт прятали в горах, а акцизных чиновников (gaugers) встречали крайне недружелюбно. По оценкам начала XIX века, до половины всего потребляемого в Шотландии виски был нелегальным."],["p","Перелом — Excise Act 1823 года: он резко снизил лицензионный сбор и сделал легальное производство экономически осмысленным. Первым, кто взял лицензию по новому закону, стал Джордж Смит из долины Ливет в 1824 году — его винокурня The Glenlivet сегодня одна из крупнейших. Смиту, по преданию, соседи-контрабандисты угрожали настолько всерьёз, что он несколько лет носил при себе пару пистолетов."],["p","Практическое следствие: подавляющее большинство «исторических» шотландских винокурен официально основаны в 1824–1830 годах. Это не совпадение — до Акта они существовали нелегально и просто не могли иметь даты основания."],["h","2.5. Колонна Коффи и рождение блендов"],["p","В 1831 году ирландец Энеас Коффи запатентовал колонну непрерывного действия. Она давала лёгкий, чистый и дешёвый зерновой спирт в промышленных объёмах — в отличие от медного куба, работающего партиями."],["p","Ирландские производители новинку демонстративно отвергли: они считали, что настоящий виски делается только в кубе, а продукт колонны — не виски вовсе. Шотландцы поступили ровно наоборот и выиграли рынок."],["p","Около 1853 года Эндрю Ашер выпустил то, что принято считать первым коммерческим блендом: смесь зернового виски из колонны с солодовыми. Результат был мягче, стабильнее по вкусу от партии к партии и дешевле. Именно бленд, а не сингл молт, сделал шотландский виски мировым напитком — и до сих пор составляет около девяти десятых всех продаж скотча."],["h","2.6. Филлоксера: как виски занял место коньяка"],["p","С 1860-х годов виноградники Франции уничтожала филлоксера — завезённая из Америки тля. К 1880–1890-м годам производство коньяка и бренди практически остановилось, а бренди с содовой был на тот момент напитком британского высшего класса."],["p","Образовавшуюся дыру заполнил шотландский бленд. Это был подарок судьбы, которым индустрия воспользовалась мгновенно: за пару десятилетий виски прошёл путь от напитка горцев до символа британского статуса. Дома, построенные в этот период, — Johnnie Walker, Dewar's, Chivas — до сих пор определяют полку."],["h","2.7. Америка: рожь, кукуруза и Восстание виски"],["p","Шотландские и ирландские переселенцы привезли перегонку в Северную Америку. На востоке (Пенсильвания, Мэриленд) основным зерном была рожь — так родился американский ржаной виски, острый и пряный. Дальше на запад, в Кентукки, климат и почва благоприятствовали кукурузе, и виски стал сладким и округлым."],["p","Виски был не только напитком, но и валютой: перевезти зерно через горы дорого, а перегнанный концентрат — выгодно. Когда в 1791 году федеральное правительство ввело акциз на спиртное, фермеры западной Пенсильвании восприняли это как удар по своим деньгам. Началось Восстание виски (1791–1794), подавленное армией под личным командованием Джорджа Вашингтона — первое применение федеральной силы внутри страны."],["p","Легенда, которую стоит знать и не выдавать за факт: баптистского священника Элайджу Крейга называют изобретателем обугленной бочки — якобы у него сгорел сарай, и он пустил обгоревшие бочки в дело. Документальных подтверждений нет; обжиг бочек применялся и раньше, в том числе для дезинфекции тары. Подавайте как байку."],["h","2.8. Bottled-in-Bond: первый закон о подлинности"],["p","К концу XIX века американский рынок был завален подделками: нейтральный спирт подкрашивали жжёным сахаром, добавляли табачный настой, глицерин, креозот и продавали как выдержанный виски."],["p","Ответом стал Bottled-in-Bond Act 1897 года — один из первых в мире законов о защите потребителя в пищевой сфере. Надпись Bottled in Bond гарантирует: виски произведён на одной винокурне, в один сезон, выдержан не менее четырёх лет на федеральном складе под надзором и разлит ровно в 50 % об. (100 proof). Эта надпись до сих пор работает как знак качества."],["h","2.9. Сухой закон и его последствия"],["p","Сухой закон (1920–1933) закрыл американскую индустрию почти полностью. Уцелели немногие компании, получившие лицензию на «медицинский виски» — его продавали по рецепту в аптеках; сеть Walgreens в эти годы выросла с двадцати с небольшим точек до сотен."],["p","Три долгосрочных последствия:"],["p","Канадский виски получил колоссальный рынок контрабанды и укрепился надолго; Seagram и Hiram Walker выросли именно тогда."],["p","Американский ржаной стиль был фактически уничтожен и вернулся только в 2000-е — до этого Rye был категорией для энтузиастов."],["p","Барменская культура эмигрировала в Европу и на Кубу, а вкус американцев за тринадцать лет сместился в сторону лёгких напитков."],["h","2.10. Ирландия: от лидерства к двум винокурням"],["p","В конце XIX века ирландский виски был мировым лидером — в Дублине работали гигантские винокурни, и Irish считался эталоном качества. К 1970-м годам на весь остров осталось две действующие площадки."],["p","Причин было несколько, и все совпали по времени: отказ от колонны Коффи и проигрыш ценовой войны шотландским блендам; война за независимость и последовавшая торговая война с Британией, закрывшая рынок Империи; американский сухой закон, отрезавший второй крупнейший рынок; и, наконец, репутационный удар от контрабандистов, продававших под ирландскими этикетками что попало."],["p","Возрождение началось с объединения выживших в Irish Distillers (1966) и постройки нового комплекса в Мидлтоне. С 1990-х Jameson рос двузначными темпами, а к 2020-м на острове снова работают десятки винокурен. Ирландский виски сегодня — самая быстрорастущая категория в мире по темпам."],["h","2.11. Япония: Такэцуру и Тории"],["p","В 1918 году молодой химик Масатака Такэцуру приехал в Шотландию, изучал химию в Университете Глазго и стажировался на действующих винокурнях, ведя подробные записи. Он вернулся в Японию с технологией и с женой-шотландкой Ритой Коуэн."],["p","Предприниматель Синдзиро Тории нанял его для постройки первой японской винокурни — Ямадзаки, запущенной в 1923 году под Киото. Через десять лет пути разошлись: Тории хотел мягкий профиль под японский вкус, Такэцуру — верности шотландскому оригиналу. В 1934 году Такэцуру уехал на север, на Хоккайдо, где климат напоминал Шотландию, и основал Ёити — будущую Nikka."],["p","Полвека японский виски был внутренним продуктом. Международное признание пришло в 2000-е, когда японские образцы начали выигрывать слепые дегустации у шотландских — Nikka в 2001-м и Suntory в 2003-м. Спрос вырос быстрее, чем позволяли запасы выдержки, и к середине 2010-х возрастные бутылки исчезли с полок или подорожали в разы."],["p","Важно для работы: до 2021 года японское законодательство почти не регулировало термин, и часть «японского виски» была импортированным шотландским или канадским спиртом, разлитым в Японии. Отраслевой стандарт саморегулирования появился только недавно, поэтому у недорогих японских бутылок стоит смотреть, где именно произведён дистиллят."],["h","2.12. «Whisky loch»: кризис 1980-х"],["p","В 1970-е индустрия наращивала производство, ожидая бесконечного роста. Рост не случился: вкусы сместились к водке и белым напиткам, а на складах образовалось «озеро виски» — whisky loch, огромные излишки, которые некому было продать."],["p","Последовала волна закрытий. В 1983 году остановились Port Ellen и Brora, в 1993-м — Rosebank. Тогда это были рядовые экономические решения; сегодня бутылки этих винокурен стоят как автомобили, а сами площадки в 2020-е были восстановлены и перезапущены владельцами."],["h","2.13. Бум сингл молтов и мировой виски"],["p","Разворот начался с маркетингового хода: Glenfiddich с 1960-х последовательно продвигал идею солодового виски одной винокурни как самостоятельного продукта, а не сырья для бленда. К 1990-м сингл молт стал категорией для ценителей, и премиализация пошла лавиной."],["p","Дальше — глобализация. Индия (Amrut, Paul John), Тайвань (Kavalan), Австралия, Швеция, Франция, Тасмания начали делать виски, который выигрывает у шотландского в слепых дегустациях. Жаркий климат ускоряет созревание в разы: тайваньский четырёхлетний может быть насыщеннее шотландского двенадцатилетнего."],["p","Побочный эффект бума — дефицит выдержанного спирта и распространение бутылок без указания возраста (NAS, No Age Statement). Это не автоматически хуже: возраст — параметр, а не оценка. Но покупатель лишился простого ориентира, и цена перестала коррелировать с выдержкой."]]],["3. Категории и законодательство",[["t",[["Категория","Ключевые требования","Что это даёт во вкусе"],["Scotch Whisky","Производство и выдержка в Шотландии, минимум 3 года в дубовых бочках не более 700 л, минимум 40 % об. Из добавок разрешены только вода и карамельный колер E150a","Строгие рамки, широкий диапазон стилей внутри них"],["Single Malt Scotch","100 % солодовый ячмень, одна винокурня, перегонка в медных кубах партиями","Максимальная выраженность характера конкретной винокурни"],["Single Grain Scotch","Одна винокурня, любое зерно, обычно колонна непрерывного действия","Лёгкий, сладковатый, ванильно-кукурузный профиль"],["Blended Malt","Смесь солодовых виски нескольких винокурен, без зернового","Сложность бленда при насыщенности солода"],["Blended Scotch","Солодовый плюс зерновой виски разных винокурен. Около 90 % рынка скотча","Мягкость, предсказуемость, доступность"],["Irish Whiskey","Остров Ирландия, минимум 3 года. Отдельная категория Single Pot Still: смесь солодового и несоложёного ячменя в кубе","Часто тройная перегонка: лёгкость, маслянистость, зерновая округлость"],["Bourbon","США, минимум 51 % кукурузы, только новая обожжённая дубовая бочка, в бочку не крепче 62,5 %, в бутылку не слабее 40 %. Минимального срока нет","Ваниль, карамель, кокос, сладость от новой древесины"],["Straight Bourbon","Бурбон, выдержанный не менее 2 лет; до 4 лет обязательно указание возраста","Гарантия, что дуб успел отработать"],["Tennessee Whiskey","Требования бурбона плюс фильтрация через кленовый уголь до бочки (Lincoln County Process)","Сглаженность, лёгкая сажевая сладость"],["Rye (США)","Минимум 51 % ржи, в остальном как бурбон","Перечная острота, сухость, укропно-пряный тон"],["Canadian Whisky","Минимум 3 года в Канаде в бочках до 700 л. Допускается до 9,09 % посторонних добавок","Лёгкость, мягкость; ржаной характер у отдельных марок"],["Japanese Whisky","Отраслевой стандарт с 2021 года: сырьё, перегонка и выдержка в Японии, минимум 3 года","Точность, баланс, деликатность; отдельный характер даёт дуб мидзунара"]]]]],["4. Шотландия: регионы",[["p","Регион — не гарантия вкуса, а исторически сложившаяся подсказка. Исключения есть в каждом (например, торфяной Ardmore в Хайленде), но как первое приближение схема работает."],["t",[["Регион","Профиль","Типичные представители"],["Speyside","Самый плотный кластер винокурен в мире. Фруктовость (яблоко, груша, изюм), мёд, часто хересная бочка. Обычно без торфа","Glenfiddich, The Glenlivet, Macallan, Balvenie, Aberlour"],["Highland","Самый разнородный регион: от лёгких цитрусовых до плотных и слегка дымных","Glenmorangie, Dalmore, Oban, Old Pulteney"],["Lowland","Лёгкие, травянистые, часто тройная перегонка. Хорошая точка входа","Auchentoshan, Glenkinchie"],["Islay","Остров, торф, море. Дым, йод, водоросли, медицинские ноты. Категория, которую либо любят, либо нет","Ardbeg, Laphroaig, Lagavulin, Bowmore, Bruichladdich"],["Campbeltown","Когда-то столица виски, сейчас три винокурни. Маслянистость, солёность, лёгкая «грязноватая» сложность","Springbank, Glen Scotia, Kilkerran"],["Islands","Не отдельный регион юридически. Морской характер, умеренный торф","Talisker (Скай), Highland Park (Оркни), Jura, Arran"]]]]],["5. Мировые стили",[["t",[["Стиль","Характер","Гость просит, когда хочет"],["Scotch blended","Мягкий, сбалансированный, лёгкая дымность в фоне","Универсальный виски, хайбол, коктейль"],["Scotch single malt","От цветочного до тяжело-торфяного; выражен характер винокурни","Пить осознанно, чистым или с каплей воды"],["Irish","Лёгкий, мягкий, зерново-фруктовый, часто тройная перегонка","Что-то некрепкое по восприятию, кофе, простые миксы"],["Bourbon","Сладкий: ваниль, карамель, кукуруза, дуб","Old Fashioned, сауэры, кола, «сладенькое»"],["Rye","Сухой, острый, перечный","Manhattan, Sazerac, Old Fashioned с характером"],["Tennessee","Бурбонная сладость плюс сглаженность от угольной фильтрации","Джек с колой, знакомый вкус"],["Canadian","Лёгкий, гладкий, нейтральный","Хайболы, большие объёмы"],["Japanese","Точный, чистый, деликатный, с деревянной пряностью","Highball, дегустация, подарок"],["World whisky","Ускоренное созревание в жарком климате: плотность при малом возрасте","Удивиться, попробовать новое"]]]]],["6. Производство: от зерна до бочки",[["t",[["Этап","Что происходит","Влияние на вкус"],["Соложение","Ячмень проращивают, затем сушат, останавливая рост. Крахмал становится доступен ферментам","Солодовая сладость, бисквитность"],["Сушка торфом","Если сушат торфяным дымом, фенолы оседают на зерне. Измеряется в ppm","Дым, йод, костёр, аптечка. Ardbeg ~55 ppm, Lagavulin ~35, Octomore — свыше 100"],["Затирание","Дроблёный солод заливают горячей водой, получают сусло (wort)","Прозрачность сусла влияет на ореховость или фруктовость"],["Брожение","Дрожжи перерабатывают сахар в спирт. От 48 до 100+ часов","Короткое — солодовое и ореховое; длинное — фруктовое и цветочное"],["Перегонка в кубе","Медный куб, партиями. Двойная (Шотландия) или тройная (Ирландия, Lowland)","Медь удаляет серу. Форма и высота куба задают тяжесть дистиллята"],["Отбор «сердца»","Голова и хвост отсекаются, в бочку идёт средняя фракция","Широкий отбор — плотнее и грязнее; узкий — чище и легче"],["Колонна","Непрерывная перегонка зернового спирта высокой чистоты","Лёгкая, нейтральная база для блендов"],["Выдержка","Годы в дубе. Испарение — «доля ангелов»: около 2 % в год в Шотландии, до 4–8 % в Кентукки","Основной источник цвета и большей части аромата"],["Купажирование","Смешивание бочек для стабильного профиля марки","Возраст на этикетке — возраст самого молодого компонента"],["Розлив","Разбавление водой, при необходимости холодная фильтрация и колер","Фильтрация убирает муть при охлаждении, но снимает часть маслянистости"]]]]],["7. Бочка: где рождается 60–70 % вкуса",[["p","Профессиональная оценка: от шестидесяти до семидесяти процентов итогового вкуса виски даёт бочка. Дистиллят задаёт скелет, дуб — почти всё остальное, включая весь цвет."],["t",[["Тип бочки","Что даёт"],["Ex-bourbon (американский белый дуб)","Ваниль, кокос, карамель, мёд. Самый распространённый тип в Шотландии: американский закон запрещает повторное использование, поэтому бочки дёшевы"],["Ex-sherry (европейский дуб, олоросо, PX)","Изюм, чернослив, тёмный шоколад, специи, ореховая горчинка. Дороже в разы, отсюда цена хересных релизов"],["Новая обожжённая (virgin oak)","Обязательна для бурбона. Мощная ваниль, карамель, дым от обжига, быстрая отдача"],["Мидзунара (японский дуб)","Сандал, кокос, благовония, специфическая «храмовая» пряность. Пористый, течёт, требует десятилетий"],["Портвейн, мадера, вино","Ягодность, красные фрукты, сладковатая танинность. Чаще как finish — короткая дофинишная выдержка"],["First fill / Refill","Первое заполнение отдаёт максимум характера, второе и третье — мягче и медленнее. Refill даёт дистилляту говорить своим голосом"]]],["p","Что стоит знать про цвет: тёмный виски не значит старый или лучший. Цвет даёт бочка, а в Шотландии законно добавлять карамельный к 43,2 %","Сложный: сухофрукты, шоколад, дуб, сливочность","Чистым, статусный Old Fashioned"],["Jim Beam White","Бурбон, 40 %","Простой, сладкий, зерновой","Хайболы, кола, бюджетный сегмент"],["Four Roses Small Batch","Бурбон, 45 %","Фруктово-цветочный, вишня, специи","Сауэры, Boulevardier"],["Jack Daniel's No. 7","Tennessee, 40 %","Угольная фильтрация: банан, ваниль, сглаженный сладкий профиль","Кола, шоты, узнаваемость"],["Rittenhouse Rye","Rye, Bottled-in-Bond, 50 %","Сухой, перечный, укропно-пряный, крепкий","Manhattan, Sazerac — эталонный барный ржаной"],["Bulleit Rye","Rye, 45 %","95 % ржи: острый, мятно-пряный, чистый","Коктейли с ярко выраженной ржаной нотой"]]],["h","Япония и мир"],["t",[["Марка","Страна / крепость","Аромат и вкус","Кому и как"],["Suntory Toki","Япония, 43 %","Лёгкий, зелёное яблоко, базилик, мёд. Создан под хайбол","Японский хайбол — идеальная подача"],["Hibiki Harmony","Япония, 43 %","Бленд высокого уровня: мёд, апельсин, мидзунара-пряность, шелковистость","Чистым, дегустация, подарок"],["Yamazaki 12","Япония, 43 %","Сухофрукты, мидзунара, сандал, персик. Эталон японского солода","Чистым, для ценителя"],["Nikka From The Barrel","Япония, 51,4 %","Очень концентрированный, пряно-фруктовый, при высокой крепости хорошо собранный","Чистым с каплей воды, крепкие коктейли"],["Kavalan Classic","Тайвань, 40 %","Субтропический климат: тропические фрукты, манго, кокос, плотность при малом возрасте","Показать, что виски делают не только в Шотландии"],["Amrut Fusion","Индия, 50 %","Индийский и торфяной шотландский ячмень: фрукты, дым, специи","Гость, ищущий необычное"],["Crown Royal","Канада, 40 %","Гладкий, лёгкий, ванильно-карамельный","Хайболы, простые миксы"]]]]],["9. Классика на виски",[["t",[["Коктейль","Состав","Метод","Посуда и гарнир"],["Old Fashioned","60 мл бурбон или ржаной, 7 мл сахарный сироп, 2–3 дэша ангостуры","Стир на льду, подача на большом кубе","Олд-фэшнд. Апельсиновая цедра, отжать масло"],["Manhattan","60 мл ржаной, 30 мл красный вермут, дэш ангостуры","Стир","Купе. Коктейльная вишня"],["Whiskey Sour","50 мл бурбон, 25 мл лимон, 20 мл сироп, белок по желанию","Dry shake, затем со льдом","Купе или олд-фэшнд. Ангостура по пене"],["Boulevardier","45 мл бурбон, 30 мл Campari, 30 мл красный вермут","Стир","Олд-фэшнд. Апельсиновая цедра"],["Sazerac","60 мл ржаной, 5 мл сироп, 3 дэша Peychaud's, ринс абсентом","Стир, подача без льда","Олд-фэшнд без льда. Лимонная цедра"],["Mint Julep","60 мл бурбон, 10 листьев мяты, 15 мл сироп","Свот мяты, дроблёный лёд, свэйп","Медный джулеп-маг. Букет мяты"],["Rob Roy","60 мл скотч, 25 мл красный вермут, дэш ангостуры","Стир","Купе. Вишня или цедра"],["Penicillin","50 мл блендед скотч, 22 мл лимон, 22 мл медово-имбирный сироп, 8 мл торфяного молта сверху","Шейк, флоат торфяного","Олд-фэшнд. Засахаренный имбирь"],["Rusty Nail","45 мл скотч, 25 мл Drambuie","Билд на льду","Олд-фэшнд. Лимонная цедра"],["Blood and Sand","По 20 мл: скотч, вишнёвый бренди, красный вермут, апельсиновый сок","Шейк","Купе. Апельсиновая цедра"],["Irish Coffee","40 мл ирландский, 80 мл кофе, 10 мл сироп, взбитые сливки сверху","Билд в подогретом бокале","Айриш-маг. Пить сквозь сливки"],["Japanese Highball","45 мл японский виски, 135 мл содовой","Билд, лёд доверху, минимум перемешиваний","Хайбол. Лимонная цедра"],["Godfather","45 мл скотч, 25 мл амаретто","Билд на льду","Олд-фэшнд. Без гарнира"],["New York Sour","Whiskey Sour плюс 15 мл красного сухого вина флоатом","Шейк, вино сверху по ложке","Олд-фэшнд. Слоистая подача"],["Vieux Carré","По 25 мл: ржаной, коньяк, красный вермут; 5 мл Bénédictine, биттеры","Стир","Олд-фэшнд. Лимонная цедра"]]]]],["10. Практика за стойкой",[["h","10.1. Подача: посуда, лёд, вода"],["p","Гленкейрн или тюльпан для дегустации: сужающееся горло собирает аромат. Олд-фэшнд (тумблер) — для подачи со льдом и коктейлей. Широкий «коньячный» бокал для виски не подходит: спирт выветривается и бьёт в нос."],["p","Несколько капель воды — не порча, а рабочий приём. Вода снижает крепость, разрывает связи между молекулами и высвобождает ароматику. Особенно заметно на 46 % и выше. Воду добавляют по капле, а не наливают."],["p","Лёд глушит аромат, но делает напиток питким. Если гость просит со льдом — один крупный куб, не мелочь: меньше площадь таяния."],["p","Дорогие возрастные молты со льдом подавать можно, если гость просит. Спорить с гостем о том, как ему пить, — плохой сервис. Достаточно один раз предложить попробовать сначала чистым."],["p","Температура подачи — комнатная. Охлаждённый виски теряет большую часть букета."],["h","10.2. Что означают надписи на этикетке"],["t",[["Надпись","Значение"],["12 Years Old","Возраст самого молодого виски в бутылке, а не среднего. В бленде может быть и сорокалетний компонент"],["NAS (No Age Statement)","Возраст не указан. Не признак низкого качества, но и не гарантия"],["Cask Strength","Разлит без разбавления водой, обычно 50–65 %. Пьётся с водой по вкусу"],["Single Cask","Из одной конкретной бочки, часто с её номером. Партия невоспроизводима"],["Small Batch","Смесь малого числа бочек. Юридически термин не определён — маркетинг с разной степенью честности"],["Bottled in Bond","США: одна винокурня, один сезон, минимум 4 года, ровно 50 % об. Реальная гарантия"],["Non Chill-Filtered","Без холодной фильтрации. Может мутнеть от льда или воды — это норма, а не брак; тело плотнее"],["Natural Colour","Без карамельного колера E150a"],["Finish / Double Wood","Дополнительная выдержка в бочке другого типа в финале"],["Sherry Cask / Oloroso / PX","Выдержка или финиш в хересных бочках. Обычно означает сухофруктовый профиль"],["Peated / ppm","Уровень фенолов от торфяной сушки. До 20 — лёгкий дым, 30–50 — выраженный, свыше 50 — тяжёлый"]]],["h","10.3. Как вести дегустацию для гостя"],["p","Порядок: от лёгкого к тяжёлому, от неторфяного к торфяному. Обратный порядок убивает восприятие — после Laphroaig любой спейсайд покажется водой."],["p","Цвет — только как наблюдение, а не как оценка: колер и тип бочки делают его ненадёжным сигналом."],["p","Нос: подносить бокал постепенно, рот приоткрыт — так спирт меньше жжёт слизистую. Первый заход — общее впечатление, второй — детали."],["p","Вкус: первый глоток «настраивает» рецепторы и почти не считается, оценивать со второго."],["p","Финиш — длина послевкусия — часто главный маркер уровня. Дешёвый виски обрывается почти сразу."],["h","Словарь описаний"],["t",[["Семейство","Дескрипторы"],["Зерновое","Солод, бисквит, каша, хлебная корка, злаки"],["Фруктовое","Яблоко, груша, цитрус, персик, тропические фрукты, сухофрукты, изюм, чернослив"],["Древесно-ванильное","Ваниль, карамель, ириска, кокос, дуб, кедр"],["Пряное","Чёрный перец, корица, гвоздика, имбирь, мускат"],["Дымное","Торф, костёр, зола, копчёность, йод, аптечка, водоросли"],["Сладкое","Мёд, кленовый сироп, шоколад, сливочная помадка"],["Дефекты","Сера, картон, клей, резина, металл, мыло"]]],["h","10.4. Частые вопросы гостей"],["p","«Чем дороже, тем лучше?» — Нет. Цена отражает возраст, редкость и маркетинг. Двенадцатилетний Lagavulin может понравиться гостю больше, чем втрое более дорогой релиз."],["p","«Виски стареет в бутылке?» — Нет. После розлива развитие останавливается: дуб больше не работает. Двадцать лет на полке ничего не добавят. Открытая бутылка постепенно окисляется — заметно после того, как остаётся меньше трети объёма."],["p","«Почему бурбон слаще скотча?» — Кукуруза в засыпи плюс обязательная новая обожжённая бочка, которая отдаёт максимум ванили и карамели. Шотландия чаще использует бочки повторно, отдача мягче."],["p","«Что за муть в бокале?» — Виски без холодной фильтрации мутнеет при контакте со льдом или водой: выпадают жирные кислоты и эфиры. Это признак того, что напиток не обеднён фильтрацией."],["p","«Single malt — значит из одной бочки?» — Нет. Single означает одну винокурню; в бутылке смешаны десятки бочек. Одна бочка — это Single Cask."]]],["11. Мини-глоссарий",[["t",[["Термин","Значение"],["Mash bill","Рецепт зерновой засыпи (например, 70 % кукурузы, 20 % ржи, 10 % солода)"],["Wash","Сброженное сусло крепостью около 8 % перед перегонкой"],["New make / white dog","Свежий дистиллят до бочки"],["Angel's share","Доля ангелов — испарение из бочки за год выдержки"],["Devil's cut","Часть виски, впитавшаяся в древесину бочки"],["Dram","Порция виски; в шотландском обиходе — просто «стакан»"],["Peat / ppm","Торф и концентрация фенолов от торфяной сушки солода"],["Lincoln County Process","Фильтрация через кленовый уголь перед бочкой — признак Tennessee whiskey"],["Solera","Система непрерывного долива бочек, при которой партия никогда не опустошается полностью"],["Мидзунара","Японский дуб; даёт сандал, кокос и благовония, требует очень долгой выдержки"],["Whisky loch","«Озеро виски» — кризис перепроизводства 1980-х"],["Uisge beatha","Гэльское «вода жизни», исходное слово, от которого произошло whisky"]]]]]]],["КОНЬЯК И БРЕНДИ","Справочник бармена",[["1. Бренди, коньяк и путаница в терминах",[["p","Бренди — родовое понятие: дистиллят из перебродившего фруктового сырья, чаще всего винограда. Коньяк — частный случай бренди, произведённый в строго определённом регионе Франции по строго определённым правилам."],["p","Соотношение то же, что между виски и скотчем: всякий коньяк — бренди, но подавляющее большинство бренди коньяком не является. Слово защищено законом, и напиток из другого региона называться так не может, даже если сделан по идентичной технологии."],["t",[["Термин","Что означает"],["Бренди","Любой дистиллят из фруктового сырья: виноград, яблоки, груши, вишня, слива"],["Коньяк","Виноградный бренди из региона Коньяк, двойная перегонка в шарантском аламбике, минимум 2 года в дубе"],["Арманьяк","Виноградный бренди Гаскони, обычно однократная перегонка в колонне арманьякез. Старше коньяка по документам"],["Кальвадос","Яблочный (иногда с грушей) бренди Нормандии"],["Граппа","Итальянский дистиллят из виноградной выжимки, а не из вина"],["Писко","Виноградный дистиллят Перу и Чили, обычно без выдержки в дубе"],["Марк (marc)","Французский аналог граппы — дистиллят из выжимки"],["Шнапс, о-де-ви","Фруктовые дистилляты без выдержки: груша, вишня, слива, малина"]]]]],["2. История",[["h","2.1. Голландцы и «жжёное вино»"],["p","В XVI веке голландские торговцы скупали вина юго-запада Франции, но при перевозке морем те портились и занимали много места. Решением стала перегонка: спирт занимал меньше объёма, не портился и предполагался к разбавлению водой по прибытии."],["p","Голландское brandewijn — «жжёное вино» — дало английское brandy и русское «бренди». Изначально это был технический продукт транспортировки, а не напиток для удовольствия."],["h","2.2. Забытые бочки: как появилась выдержка"],["p","Дальше сработала случайность, ставшая технологией: часть партий не находила покупателя и оставалась в дубовых бочках на месяцы и годы. Обнаружилось, что напиток от этого не портится, а становится мягче, темнее и ароматнее."],["p","К XVII веку в Шаранте перешли на двойную перегонку, дающую более концентрированный и чистый спирт, и выдержка из случайности превратилась в обязательный этап."],["h","2.3. Шаранта и торговые дома"],["p","Регион оказался удачным по совокупности причин: меловые почвы, дающие высококислотное и малоалкогольное вино, идеально подходящее для перегонки; река Шаранта как транспортная артерия; близость порта Ла-Рошель."],["p","Торговые дома, определяющие категорию сегодня, основаны в XVIII–XIX веках, и многие из них — иностранного происхождения: ирландец Ричард Хеннесси, англичанин Жан Мартелл с острова Джерси. Экспортная природа коньяка заложена изначально: он почти никогда не был напитком для внутреннего потребления."],["h","2.4. Филлоксера: катастрофа и перестройка"],["p","С 1870-х годов филлоксера уничтожила виноградники Шаранты почти полностью. Производство рухнуло, регион разорился, а освободившееся место на мировом рынке заняли шотландский виски и ром — они его больше не отдали."],["p","Восстановление шло через прививку европейской лозы на американский подвой и сопровождалось сменой сортов: на смену прежнему Фоль Бланш пришёл Уньи Блан, устойчивый и дающий как раз ту высокую кислотность и низкую крепость, что нужны для перегонки. Сегодня он занимает подавляющее большинство площадей."],["p","Практический вывод: современный коньяк — продукт послефиллоксерной перестройки. «Довоенные» и XIX века бутылки сделаны из другого винограда и представляют собой другой напиток."],["h","2.5. Защита наименования и BNIC"],["p","Границы региона были закреплены законодательно в 1909 году, деление на крю — в 1938-м. Отраслевое бюро BNIC, созданное в 1946 году, контролирует производство, ведёт учёт выдержки и подтверждает возрастные категории."],["p","Учёт возраста ведётся по системе compte: спирт урожая текущего года получает compte 00 и переходит в compte 0 к первому апреля следующего года, дальше счёт идёт по годам. Официальный учёт BNIC останавливается на compte 10, что и объясняет, почему возрастные заявления выше XO опираются на внутренние записи домов."],["h","2.6. XX век: коньяк как символ статуса"],["p","К середине XX века коньяк закрепился как атрибут статуса и завершения ужина: снифтер, сигара, кожаное кресло. Этот образ принёс продажи, но и загнал категорию в узкую нишу «напитка для пожилых мужчин»."],["p","Одновременно он породил живучие ошибки подачи — прежде всего огромный снифтер и нагревание бокала над свечой. Оба приёма ухудшают напиток, но выглядят внушительно, и потому держались десятилетиями."],["h","2.7. Новая аудитория: хип-хоп, Азия и коктейли"],["p","С 1990-х коньяк получил неожиданную аудиторию: американская хип-хоп культура сделала его частью собственной эстетики, и продажи в США выросли многократно без всяких усилий со стороны производителей. Часть домов затем встроилась в это уже осознанно."],["p","Второй рынок — Китай и Юго-Восточная Азия, где коньяк стал главным подарочным крепким напитком. Третий вектор — возвращение в коктейли: исторически Sazerac и множество классики XIX века делались именно на коньяке, и бармены вернули эту базу в обиход."]]],["3. Коньяк: крю, производство, категории",[["h","3.1. Шесть крю"],["t",[["Крю","Почва и характер","Значение"],["Grande Champagne","Максимально меловая почва. Тонкие, цветочные спирты, очень медленное созревание","Высшая категория. Требует долгой выдержки, раскрывается лучше всех"],["Petite Champagne","Чуть менее меловая. Похожий стиль, созревает быстрее","Вторая по престижу"],["Borderies","Самое малое крю. Глинисто-кремнистые почвы","Узнаваемая ореховая и фиалковая нота, округлость. Ценится в купажах"],["Fins Bois","Крупнейшее крю по площади. Более плотные почвы","Быстрое созревание, фруктовость. Основа многих VS"],["Bons Bois","Периферия, песчаные почвы","Более простой и грубоватый профиль"],["Bois Ordinaires","Побережье и острова, песок","Морской оттенок, минимальная роль в премиальных купажах"]]],["p","Fine Champagne на этикетке означает купаж только из Grande и Petite Champagne, причём не менее половины — из Grande. Это не про игристое вино: «шампань» здесь означает «поле» на местном наречии."],["h","3.2. Производство"],["t",[["Этап","Как устроено"],["Сорт винограда","Более 95 % — Уньи Блан (Треббьяно). Высокая кислотность, низкий сахар — идеально для перегонки"],["Базовое вино","Крепость 7–9 %, без добавления серы. По вкусу неприятно кислое — пить его не предполагается"],["Перегонка","Двойная, в медном шарантском аламбике на открытом огне. Строго до 31 марта года, следующего за урожаем"],["Отбор","Вторая перегонка даёт «сердце» (bonne chauffe) крепостью около 70 %"],["Выдержка","Лимузенский дуб — крупнопористый, отдаёт танины и структуру быстро; тронсейский — плотный, отдаёт медленнее и мягче"],["Купажирование","Мастер погреба смешивает спирты разных лет и крю. Ключевая профессия отрасли"],["Доводка","Разрешены вода, карамельный колер, сахарный сироп и настой дубовой стружки в пределах нормы"]]],["h","3.3. Возрастные категории"],["t",[["Обозначение","Минимальный возраст младшего спирта","Что в бокале"],["VS / ✯✯✯","2 года","Молодой, фруктовый, спиртуозный, простой. Коктейльная база"],["VSOP / Réserve","4 года","Баланс фрукта и дуба, ваниль, лёгкая пряность. Универсал"],["Napoléon","6 лет","Между VSOP и XO. Официальная, но нестрого используемая ступень"],["XO","10 лет (с 2018 года; ранее 6)","Сухофрукты, орех, кожа, табак, длинный финиш"],["XXO","14 лет","Введена в 2018 году. Глубокая рансьо-сложность"],["Hors d'âge","Формально равен XO, на практике старше","Верхний сегмент домов, вне возрастной шкалы"]]]]],["4. Арманьяк: старший и другой",[["p","Арманьяк документально старше коньяка: упоминания о его лечебных свойствах датируются XIV веком, за два столетия до расцвета Шаранты. При этом он остаётся в десятки раз меньше по объёму производства и куда менее известен."],["t",[["Признак","Коньяк","Арманьяк"],["Перегонка","Двойная, в медном аламбике","Обычно однократная, в колонне арманьякез"],["Крепость дистиллята","Около 70 %","Около 52–60 %"],["Следствие","Чище, тоньше, элегантнее","Больше ароматических соединений, плотнее и деревенственнее"],["Сорта","Почти только Уньи Блан","Уньи Блан, Бако, Фоль Бланш, Коломбар"],["Дуб","Лимузен, Тронсе","Гасконский чёрный дуб — более танинный"],["Миллезимы","Редкость","Обычная практика: год урожая на этикетке"],["Зоны","Шесть крю","Bas-Armagnac (лучшая), Ténarèze, Haut-Armagnac"]]],["p","Аргумент для гостя: арманьяк с указанием года урожая часто стоит дешевле сопоставимого по возрасту коньяка, потому что бренд не платит за глобальный маркетинг. Для подарка «на год рождения» это лучший вариант в категории."]]],["5. Остальная семья бренди",[["t",[["Напиток","Происхождение и сырьё","Характер и подача"],["Кальвадос","Нормандия, яблоки и до 30 % груш. Pays d'Auge — высшая зона, двойная перегонка","Печёное яблоко, сидровая кислинка, дуб. Подают как дижестив и в trou normand — паузе посреди ужина"],["Граппа","Италия, виноградная выжимка после виноделия","От резкой и деревенской до тонкой односортовой. Молодая — прозрачная, выдержанная — золотая"],["Писко","Перу и Чили, виноград. Перуанский — без выдержки в дубе и без разбавления","Цветочный, виноградный, яркий. База Pisco Sour. Перу и Чили спорят о происхождении десятилетиями"],["Бренди де Херес","Испания, выдержка в системе солера в хересных бочках","Сладковатый, ореховый, хересный. Три ступени: Solera, Solera Reserva, Solera Gran Reserva"],["Метакса","Греция, купаж бренди с вином и травами","Формально не бренди в чистом виде: сладкая, пряная, самобытная"],["Ракия, сливовица","Балканы, фруктовое сырьё: слива, абрикос, виноград","Крепкая, фруктово-косточковая, часто домашняя традиция"],["О-де-ви","Эльзас, Германия, Швейцария. Груша, вишня, малина, слива","Без выдержки, прозрачные, интенсивно фруктовые. Подают охлаждёнными"],["Армянский бренди","Армения, местные сорта винограда, дуб","Плотный, сладковатый, ванильно-фруктовый. По закону ЕС не может называться коньяком"]]]]],["6. Марки: органолептика и применение",[["t",[["Марка","Категория / крепость","Аромат и вкус","Кому и как"],["Hennessy VS","Коньяк VS, 40 %","Фруктовый, дубовый, чуть жгучий. Самый продаваемый коньяк мира","Коктейли, кола, массовая подача"],["Rémy Martin VSOP","Fine Champagne VSOP, 40 %","Абрикос, ваниль, лакрица, округлость","Универсал: чистым и в коктейлях"],["Martell VSOP","Коньяк VSOP, 40 %","Более сухой и элегантный стиль, фруктово-цветочный","Чистым, Sidecar"],["Courvoisier VSOP","Коньяк VSOP, 40 %","Мягкий, ванильно-персиковый, сглаженный","Гость, которому коньяк кажется резким"],["Hennessy XO","Коньяк XO, 40 %","Плотный: сухофрукты, кожа, специи, шоколад, очень длинный финиш","Только чистым, дегустационно"],["Delamain Pale & Dry","Grande Champagne XO, 40 %","Без колера и сахара: сухой, тонкий, ореховый, минеральный","Ценитель, который не любит сладкие коньяки"],["Château de Laubade","Bas-Armagnac, миллезимы, 40 %","Чернослив, орех, рансьо, плотное тело","Подарок «на год рождения», дижестив"],["Roger Groult 8 ans","Кальвадос Pays d'Auge, 41 %","Печёное яблоко, карамель, специи, сидровая свежесть","Дижестив, Calvados Old Fashioned"],["Nonino Grappa","Граппа, Италия, 41 %","Односортовая, чистая, фруктово-цветочная, без грубости","Показать, что граппа бывает тонкой"],["Pisco Portón / Barsol","Писко, Перу, 40–43 %","Виноградная цветочность, свежесть, без дубовых нот","Pisco Sour, Chilcano"],["Lepanto / Cardenal Mendoza","Бренди де Херес, 36–40 %","Хересная сладость, изюм, орех, ваниль","Дижестив, сладкие коктейли"],["Metaxa 7*","Греция, 40 %","Сладкая, пряная, медово-фруктовая","Гость, ищущий мягкое и сладкое"]]]]],["7. Классика на коньяке и бренди",[["t",[["Коктейль","Состав","Метод","Посуда и гарнир"],["Sidecar","50 мл коньяк, 20 мл Cointreau, 20 мл лимон","Шейк","Купе. Сахарная кайма по половине кромки"],["Brandy Alexander","30 мл коньяк, 30 мл какао-ликёр, 30 мл сливки","Шейк","Купе. Мускатный орех"],["Vieux Carré","По 25 мл: ржаной, коньяк, красный вермут; 5 мл Bénédictine, биттеры","Стир","Олд-фэшнд. Лимонная цедра"],["Sazerac (историческая версия)","60 мл коньяк, 5 мл сироп, Peychaud's, ринс абсентом","Стир, без льда","Олд-фэшнд. Лимонная цедра"],["Pisco Sour","60 мл писко, 25 мл лайм, 20 мл сироп, белок, ангостура сверху","Dry shake, затем со льдом","Купе. Три капли ангостуры по пене"],["French Connection","35 мл коньяк, 35 мл амаретто","Билд на льду","Олд-фэшнд. Без гарнира"],["Between the Sheets","30 мл коньяк, 30 мл белый ром, 20 мл Cointreau, 20 мл лимон","Шейк","Купе. Лимонная цедра"],["Horse's Neck","50 мл коньяк, имбирный эль, дэши ангостуры","Билд","Хайбол. Спираль лимонной цедры через весь бокал"],["Stinger","50 мл коньяк, 20 мл белый мятный ликёр","Стир или шейк","Купе. Мята"],["Japanese Cocktail","60 мл коньяк, 15 мл орже, дэши ангостуры","Стир","Купе. Лимонная цедра. Из книги Джерри Томаса 1862 года"],["Chilcano","60 мл писко, имбирный эль, лайм, ангостура","Билд","Хайбол. Лайм"],["Calvados Old Fashioned","60 мл кальвадос, 7 мл кленовый сироп, дэши биттера","Стир","Олд-фэшнд. Яблочный чипс"]]]]],["8. Практика за стойкой",[["h","Подача: что делать и чего не делать"],["p","Правильный бокал — тюльпан на ножке с сужением кверху. Он собирает аромат и не даёт спирту бить в нос."],["p","Огромный снифтер — устаревшая традиция. Широкая чаша испаряет спирт быстрее ароматики, и в нос идёт этанол. Дома коньяка сами от него отказались."],["p","Нагревать бокал над свечой не нужно. Это разрушает тонкие ароматы и усиливает спиртуозность. Достаточно тепла ладони, и то не обязательно."],["p","Температура подачи — комнатная, 18–20 °C. VS и VSOP допустимо подавать со льдом или в хайболе: молодой коньяк от этого только выигрывает."],["p","Коньяк с тоником или имбирным элем — нормальная современная подача, а не варварство. Во Франции такие лонги продвигают сами производители."],["h","Что стоит знать"],["p","Цвет коньяка ненадёжен: разрешён карамельный колер. Тёмный не значит старый."],["p","Большинство коньяков содержат добавленный сахарный сироп в пределах нормы — отсюда ощущение сладости при отсутствии сахара в списке ингредиентов."],["p","Возраст на этикетке — возраст самого молодого спирта в купаже, как у виски."],["p","Рансьо (rancio) — специфический ореховый, слегка «сырный» тон очень старых спиртов. Не дефект, а признак глубокой выдержки."],["p","Коньяк не развивается в бутылке. Открытая бутылка живёт долго, но после того как остаётся меньше трети, окисление становится заметным."],["p","Армянский, грузинский и молдавский бренди в России часто называют коньяком по внутренней традиции. В экспорте и в разговоре с иностранным гостем это некорректно."]]],["9. Мини-глоссарий",[["t",[["Термин","Значение"],["Аламбик шарантский","Медный перегонный куб на открытом огне для двойной перегонки коньяка"],["Bonne chauffe","Вторая перегонка и её «сердце» — фракция, идущая в бочку"],["Крю","Зона внутри региона Коньяк, определяемая почвой"],["Fine Champagne","Купаж только из Grande и Petite Champagne, не менее половины из Grande"],["Compte","Система учёта возраста спирта, ведётся BNIC"],["Рансьо","Ореховый, слегка окисленный тон очень старых спиртов"],["Paradis","Погреб дома, где хранятся самые старые спирты"],["Лимузен / Тронсе","Два типа французского дуба: быстрая и медленная отдача танинов"],["Уньи Блан","Основной сорт винограда для коньяка; в Италии известен как Треббьяно"],["Trou normand","Нормандская традиция: рюмка кальвадоса в середине долгого обеда"],["Солера","Система непрерывного долива бочек, применяется в бренди де Херес"]]]]]]],["ЛИКЁРЫ, БИТТЕРЫ И АБСЕНТ","Справочник бармена",[["1. Что такое ликёр",[["p","Ликёр — спиртной напиток с добавлением ароматизирующего сырья и сахара. В Евросоюзе минимальное содержание сахара составляет 100 г/л (для отдельных категорий ниже), крепость — от 15 % об. Именно сахар отличает ликёр от настойки или биттера в юридическом смысле."],["p","Категория огромна и неоднородна. Практичнее делить её по роли за стойкой, а не по составу."],["t",[["Группа","Роль","Примеры"],["Горькие аперитивы","Возбуждают аппетит, база спритцев и стиров","Campari, Aperol, Select, Cynar"],["Амари (дижестивы)","После еды, сложная горечь","Fernet-Branca, Averna, Montenegro"],["Травяные","Мощный ароматический модификатор","Chartreuse, Bénédictine, Jägermeister"],["Цитрусовые","Кислотно-сладкий баланс в сауэрах","Cointreau, Grand Marnier, кюрасао"],["Фруктовые и цветочные","Акцент, ароматическая надстройка","St-Germain, Chambord, cassis, мараскино"],["Сливочные и ореховые","Десертные коктейли, текстура","Baileys, Disaronno, Frangelico"],["Кофейные","Кофейные и десертные коктейли","Kahlúa, Tia Maria, Mr Black"],["Коктейльные биттеры","Не ликёры: концентрированные настойки, дозируются каплями","Angostura, Peychaud's, orange bitters"]]]]],["2. Абсент",[["h","2.1. Происхождение и подъём"],["p","Абсент — крепкий (обычно 55–75 %) дистиллят, ароматизированный полынью горькой, анисом и фенхелем. Эта «святая троица» и определяет категорию."],["p","Рецепт восходит к концу XVIII века в швейцарском Куве; его связывают с доктором Пьером Ординером и семьёй Анрио. В 1797 году права приобрёл Анри-Луи Перно, открывший производство — сначала в Швейцарии, затем во французском Понтарлье."],["p","Массовым напитком абсент сделала армия: французские войска в Алжире в 1840-х получали его как средство от малярии и для обеззараживания воды. Вернувшись, солдаты принесли привычку домой."],["h","2.2. Зелёный час"],["p","К концу XIX века абсент стал напитком всех сословий Франции. Сложился ритуал l'heure verte — «зелёный час», время между пятью и семью вечера, когда кафе наполнялись, а на столах стояли характерные бокалы и графины с ледяной водой."],["p","Абсент прочно вошёл в культурную мифологию: его пили и изображали Ван Гог, Дега, Тулуз-Лотрек, Верлен, Рембо, Уайльд, Пикассо. «Зелёная фея» стала символом художественной богемы — и, как следствие, объектом моральной паники."],["h","2.3. Кризис 1905 года и запреты"],["p","Формальным поводом к запрету стало дело Жана Ланфре — швейцарского крестьянина, убившего в 1905 году свою семью. В прессе преступление приписали абсенту, хотя в тот день он выпил также значительное количество вина и коньяка, а абсента — две рюмки."],["p","Кампания опиралась на реальную проблему: дешёвый абсент часто подделывали, подкрашивая солями меди и хлоридом сурьмы, что действительно вызывало отравления. Свою роль сыграло и винодельческое лобби, терявшее рынок после филлоксеры."],["p","Запреты последовали быстро: Швейцария в 1910-м, США в 1912-м, Франция в 1915-м. Категория исчезла почти на столетие."],["h","2.4. Туйон: разбор мифа"],["p","Абсенту приписывали галлюциногенное действие, объясняя его туйоном — соединением, содержащимся в полыни. Современные исследования, включая анализ сохранившихся довоенных бутылок, показали, что содержание туйона в историческом абсенте было низким и не могло вызывать психоактивных эффектов."],["p","Прямо и честно: абсент не вызывает галлюцинаций. Эффект, который описывали современники, объясняется прежде всего крепостью 60–70 % — то есть тем, что люди выпивали по несколько порций очень крепкого напитка подряд. Гостю, ожидающему «особого эффекта», лучше сказать это прямо."],["h","2.5. Возвращение"],["p","Легализация началась в 1990-е: сначала Великобритания, где запрета формально никогда не было, затем ЕС установил допустимые нормы туйона, а в 2007 году абсент вернулся в США. Швейцария сняла запрет в 2005-м, Франция окончательно — в 2011-м."],["p","Одновременно с возвращением рынок наводнили дешёвые окрашенные настойки с маркетингом «максимум туйона». Настоящий абсент — дистиллят, а не смесь спирта с красителем и экстрактами: он даёт эффект louche и не бывает кислотно-зелёным."],["h","2.6. Ритуал подачи"],["t",[["Шаг","Что делать"],["1. Налить","30 мл абсента в бокал с расширенным основанием (pontarlier)"],["2. Ложка и сахар","Перфорированную ложку положить на кромку, при желании кубик сахара сверху. Сахар нужен, если абсент горький; хороший абсент можно пить без него"],["3. Вода","Ледяная вода медленно, по капле, через сахар. Пропорция от 3:1 до 5:1 воды к абсенту"],["4. Louche","Напиток мутнеет и становится опалово-белым: анетол не растворяется в воде и выпадает эмульсией. Это визуальный признак настоящего дистиллированного абсента"],["5. Пить","Медленно, как аперитив. Крепость после разбавления — около 15–20 %"]]],["p","Про поджигание: «чешский ритуал» с горящим сахаром придуман в 1990-е для туристов. Он карамелизует сахар, выжигает ароматику и создаёт реальный риск пожара. К традиции отношения не имеет; французский способ — только холодная вода."],["h","2.7. Марки и родственники"],["t",[["Напиток","Профиль"],["Absinthe Verte","Зелёный от натуральной мацерации трав; с годами темнеет до янтарного (feuille morte)"],["Absinthe Blanche / La Bleue","Швейцарский прозрачный стиль, без финального окрашивания"],["Pernod / Ricard","Пастис — анисовые аперитивы без полыни, созданные как легальная замена абсента после запрета. 40–45 %"],["Узо","Греция: анис, более сладкий, пьётся с водой и льдом, тоже даёт louche"],["Ракы","Турция: анисовый, «львиное молоко» из-за помутнения"],["Самбука","Италия: анис и бузина, сладкая. Con la mosca — с тремя кофейными зёрнами"],["Анисетта, Анис дель Моно","Испания и Франция: сладкие анисовые ликёры"]]]]],["3. Горькие аперитивы",[["t",[["Напиток","Крепость","Профиль","Применение"],["Campari","25 %","Резкая хинно-грейпфрутовая горечь, апельсиновая цедра, ревень. Красный цвет с 2006 года синтетический, ранее — кошениль","Negroni, Americano, Spritz, Boulevardier"],["Aperol","11 %","Мягче и слаще Campari: апельсин, ревень, горечавка. Оранжевый","Spritz — самый продаваемый аперитив Европы"],["Select","17,5 %","Венецианский: между Campari и Aperol, более пряный","Венецианский Spritz"],["Cynar","16,5 %","На артишоке: землистая горечь, карамель, овощной тон","Cynar Spritz, Negroni-вариации"],["Suze","20 %","Горечавка: резкая, землисто-цитрусовая, жёлтая","White Negroni, аперитив с тоником"],["Salers, Avèze","16–20 %","Французские горечавковые аперитивы","Аперитив со льдом и содовой"],["Contratto Bitter, Luxardo Bitter","22–25 %","Альтернативы Campari без синтетического красителя","Замена в Negroni"]]]]],["4. Амари: итальянские дижестивы",[["p","Amaro по-итальянски просто «горький». Категория объединяет травяные ликёры разной сладости и горечи, традиционно употребляемые после еды для пищеварения. У каждого региона Италии есть свой амаро, и рецепты, как правило, засекречены."],["t",[["Марка","Крепость","Профиль","Как подавать"],["Fernet-Branca","39 %","Самый жёсткий: мята, мирра, шафран, ревень, лекарственная горечь. Культовый напиток барменов","Чистым, шот, Hanky Panky, с колой в Аргентине"],["Averna","29 %","Сицилийский: сладковато-карамельный, цитрус, мягкая горечь","Со льдом и цедрой, Black Manhattan"],["Amaro Montenegro","23 %","Апельсиновый, цветочный, мягкий и доступный","Лучший «первый амаро», со льдом"],["Ramazzotti","30 %","Сладко-пряный, анисовый, кола-подобный","Со льдом, с тоником"],["Amaro Nonino Quintessentia","35 %","На базе граппы: элегантный, абрикос, карамель, лёгкая горечь","Paper Plane, чистым"],["Braulio","21 %","Альпийский: хвоя, мята, горечавка, ментоловая свежесть","После жирной еды, охлаждённым"],["Cynar","16,5 %","Артишоковый, овощная горечь","Спритц, дижестив"],["Amaro Lucano, Sfumato, Cardamaro","17–30 %","Региональные вариации: от дымных до винных","Дижестив, коктейльные модификаторы"]]]]],["5. Травяные ликёры",[["h","5.1. Шартрез"],["p","Производится монахами-картезианцами во Франции по рецепту, восходящему к рукописи 1605 года. Состав включает около 130 растений и известен, по преданию, лишь нескольким монахам одновременно. Это один из немногих ликёров, чей рецепт действительно остаётся секретом, а не маркетинговым приёмом."],["t",[["Вид","Крепость","Профиль"],["Chartreuse Verte (зелёный)","55 %","Мощный, травяной, ментолово-пряный, натурально-зелёный от растений. Единственный ликёр такого цвета без красителей"],["Chartreuse Jaune (жёлтый)","40 %","Мягче и слаще: мёд, шафран, специи"],["V.E.P.","54 / 42 %","Долгая выдержка в дубе, более округлый и сложный"]]],["p","С 2023 года орден ограничил производство по внутренним соображениям, что вызвало дефицит на мировом рынке. За стойкой это стоит учитывать: позиция может быть недоступна или дорога."],["h","5.2. Бенедиктин"],["p","Французский ликёр на 27 травах и специях, 40 %. Легенда о рецепте венецианского монаха XVI века, восстановленном в XIX веке, — маркетинговая конструкция создателя Александра Ле Грана; исторических подтверждений нет."],["p","Профиль медово-пряный, с ноткой шафрана и цитруса. Ключевой компонент Vieux Carré и Singapore Sling. Существует готовая смесь B&B — бенедиктин с бренди."],["h","5.3. Егермейстер"],["p","Немецкий травяной ликёр, 35 %, на 56 компонентах: травы, коренья, цитрусовая цедра, специи. Создан в 1934 году Куртом Мастом в Вольфенбюттеле."],["p","Название переводится как «егермейстер» — должность старшего распорядителя охоты. Отец создателя был охотником, а с 1934 года в Германии действовал закон об охоте, в связи с чем термин был на слуху. Олень с крестом между рогов на этикетке отсылает к легенде о святом Губерте, покровителе охотников."],["p","Профиль: анис, лакрица, цитрус, гвоздика, ощутимая сладость с горьким хвостом. Подаётся охлаждённым до −18 °C — холод скрывает сладость и делает напиток питким. В Германии традиционно воспринимается как дижестив, за пределами — как шот, что во многом заслуга маркетинга 1990-х."],["p","Коктейльный потенциал: Егермейстер работает как амаро — с колой, имбирным элем, в вариациях Negroni и в сауэрах с лимоном. Категория «шот из морозилки» сильно занижает его возможности."],["h","5.4. Прочие"],["t",[["Напиток","Страна / крепость","Профиль"],["Unicum","Венгрия, 40 %","Более 40 трав, резкая горечь, ближе к Fernet. Национальный дижестив"],["Бехеровка","Чехия, 38 %","Корица, гвоздика, анис. Мягкая, пряная. Beton — с тоником"],["Drambuie","Шотландия, 40 %","Скотч, мёд, травы, специи. Rusty Nail"],["Strega","Италия, 40 %","Шафран, мята, жёлтый цвет, характерная пряность"],["Galliano","Италия, 42,3 %","Ваниль, анис, травы. Harvey Wallbanger"],["Génépi","Альпы, 40 %","Альпийская полынь, травяной, суховатый"],["Absolut Kurant и настойки","варьируется","Ароматизированные водки — не ликёры, но часто в той же роли"]]]]],["6. Цитрусовые и фруктовые ликёры",[["t",[["Напиток","Крепость","Профиль","Применение"],["Cointreau","40 %","Трипл-сек высокого уровня: чистый апельсин, сухой, не приторный","Margarita, Sidecar, Cosmopolitan, White Lady"],["Grand Marnier","40 %","Апельсин на коньячной базе: плотнее, слаще, с дубом","Sidecar, Grand Margarita, чистым"],["Triple Sec (базовый)","15–40 %","Простой апельсиновый, часто слишком сладкий","Массовые коктейли; при низкой крепости меняет баланс"],["Кюрасао (оранж, блю)","20–40 %","Горьковатый апельсин лараха; синий — тот же вкус с красителем","Mai Tai, тики, визуальные коктейли"],["Maraschino (Luxardo)","32 %","Из мараски с косточками: миндально-вишнёвый, сухой, не сладкая «вишня»","Aviation, Last Word, Hemingway Daiquiri"],["St-Germain","20 %","Бузина: цветочный, грушево-личиевый, мягкий","Спритц, лёгкие коктейли, современная классика"],["Chambord","16,5 %","Малина, чёрная смородина, ваниль, мёд","French Martini, десертные"],["Crème de cassis","15–20 %","Чёрная смородина, очень сладкий","Kir, Kir Royal, El Diablo"],["Crème de mûre","15–20 %","Ежевика","Bramble"],["Crème de violette","20 %","Фиалка: парфюмированный, сильный, дозируется малыми долями","Aviation"],["Limoncello","25–30 %","Лимонная цедра, сладкий, южноитальянский дижестив","Охлаждённым, спритц"],["Aperitivo-ликёры на цедре","варьируется","Итальянские и корсиканские цитрусовые вариации","Спритц, лонги"]]]]],["7. Сливочные, ореховые и кофейные",[["t",[["Напиток","Крепость","Профиль","Применение и хранение"],["Baileys Irish Cream","17 %","Сливки, ирландский виски, шоколад, ваниль","После вскрытия — холодильник, срок около 6 месяцев"],["Disaronno (амаретто)","28 %","Миндально-марципановый (на самом деле из абрикосовых косточек), сладкий","Godfather, Amaretto Sour, French Connection"],["Frangelico","20 %","Лесной орех, ваниль, какао","Кофейные и десертные коктейли"],["Kahlúa","16–20 %","Кофе, ваниль, очень сладкий","White Russian, Espresso Martini"],["Tia Maria","20 %","Кофе с ромовой базой, чуть суше Kahlúa","Кофейные коктейли"],["Mr Black","23 %","Современный кофейный: меньше сахара, выраженный кофе","Espresso Martini для тех, кому классика сладка"],["Crème de cacao","20–25 %","Какао; белый и тёмный варианты","Brandy Alexander, Grasshopper"],["Crème de menthe","20–25 %","Мята; белая и зелёная","Stinger, Grasshopper"],["Sambuca","38–42 %","Анис и бузина, очень сладкая","Con la mosca — с тремя зёрнами кофе"],["Southern Comfort","35 %","Персик, цитрус, специи. Не виски, хотя часто так воспринимается","Простые миксы, шоты"]]]]],["8. Коктейльные биттеры",[["p","Это не ликёры: концентрированные горькие настойки крепостью 35–45 %, которые дозируются каплями и дэшами. Их роль в коктейле — как соли и специй в кухне: они не создают вкус, а связывают и подчёркивают его."],["t",[["Биттер","Профиль","Где применяется"],["Angostura","Гвоздика, корица, горечавка, выпечка. Универсальный","Old Fashioned, Manhattan, Pisco Sour, почти везде"],["Peychaud's","Анис, вишня, цветочность, легче ангостуры","Sazerac, Vieux Carré"],["Orange bitters","Апельсиновая цедра, кардамон, сухость","Martini, Old Fashioned, тонкая настройка"],["Шоколадный, кофейный, ореховый","Специализированные акценты","Дижестивные и десертные коктейли"],["Сельдерейный","Овощной, солоноватый","Bloody Mary, савори-коктейли"]]],["p","Историческая деталь: именно биттеры делают коктейль коктейлем. Первое печатное определение слова (1806 год) описывает его как смесь спирта, сахара, воды и биттеров — то есть Old Fashioned. Всё остальное появилось позже."]]],["9. Коктейли",[["t",[["Коктейль","Состав","Метод","Посуда и гарнир"],["Aperol Spritz","60 мл Aperol, 90 мл просекко, содовая","Билд, лёд доверху","Копа. Апельсин"],["Americano","30 мл Campari, 30 мл красный вермут, содовая","Билд","Хайбол. Апельсин"],["Negroni","30 мл джин, 30 мл Campari, 30 мл красный вермут","Стир","Олд-фэшнд. Апельсиновая цедра"],["Last Word","По 22 мл: джин, зелёный шартрез, мараскино, лайм","Шейк","Купе. Вишня"],["Naked & Famous","По 22 мл: мескаль, Aperol, жёлтый шартрез, лайм","Шейк","Купе"],["Paper Plane","По 22 мл: бурбон, Aperol, Amaro Nonino, лимон","Шейк","Купе"],["Hanky Panky","45 мл джин, 45 мл красный вермут, 7 мл Fernet-Branca","Стир","Купе. Апельсиновая цедра"],["Black Manhattan","60 мл ржаной, 25 мл Averna, биттеры","Стир","Купе. Вишня"],["Corpse Reviver №2","По 22 мл: джин, Cointreau, Cocchi Americano, лимон; ринс абсентом","Шейк","Купе. Вишня"],["Sazerac","60 мл ржаной, 5 мл сироп, Peychaud's, ринс абсентом","Стир, без льда","Олд-фэшнд. Лимонная цедра"],["Death in the Afternoon","30 мл абсент, игристое доверху","Билд","Флейта. Рецепт Хемингуэя"],["Grasshopper","По 30 мл: зелёный мятный, какао белый, сливки","Шейк","Купе. Мята"],["Amaretto Sour","50 мл амаретто, 20 мл бурбон, 25 мл лимон, белок","Dry shake","Олд-фэшнд. Вишня"],["French Martini","45 мл водка, 15 мл Chambord, 45 мл ананасовый сок","Жёсткий шейк","Купе. Пенная шапка"],["Kir Royal","10 мл crème de cassis, игристое","Билд","Флейта"],["Rusty Nail","45 мл скотч, 25 мл Drambuie","Билд","Олд-фэшнд. Цедра"]]]]],["10. Практика за стойкой",[["p","Ликёры почти всегда сладкие. Добавляя ликёр, сироп в рецепте нужно уменьшать или убирать — иначе коктейль разваливается по балансу."],["p","Крепость трипл-сека имеет значение. Cointreau на 40 % и дешёвый трипл-сек на 15 % — не взаимозаменяемы: второй разбавляет коктейль и делает его приторным."],["p","Сливочные ликёры сворачиваются от кислоты. Не смешивать с лимоном и лаймом напрямую; они хранятся в холодильнике и имеют реальный срок годности."],["p","Абсент чаще всего используется ринсом — ополаскиванием бокала. 5 мл достаточно, чтобы задать аромат всему коктейлю."],["p","Фиалковый и другие сильные цветочные ликёры передозировать очень легко: 5 мл — это уже много, коктейль начинает пахнуть мылом."],["p","Биттеры дозируются дэшами. Один дэш — примерно 0,8–1 мл. Разница между двумя и четырьмя дэшами ощутима."],["p","Амари — лучший ответ на запрос «что-нибудь после ужина» и на запрос «что-нибудь необычное, но не крепкое». Montenegro или Averna со льдом и апельсиновой цедрой работают почти всегда."],["p","Егермейстер, Fernet и Unicum в морозилке пьются легче, но при комнатной температуре у них слышна вся сложность. Стоит один раз предложить гостю попробовать не ледяным."]]],["11. Мини-глоссарий",[["t",[["Термин","Значение"],["Ликёр","Спиртной напиток с ароматизацией и сахаром (в ЕС обычно от 100 г/л)"],["Крем (crème de)","Ликёр с очень высоким содержанием сахара; к сливкам отношения не имеет"],["Амаро","Итальянский горький травяной ликёр, традиционно дижестив"],["Аперитив / дижестив","Напиток до еды для аппетита и после еды для пищеварения"],["Louche","Помутнение анисового напитка при добавлении воды: анетол выпадает эмульсией"],["Туйон","Соединение полыни; его психоактивность в аб
