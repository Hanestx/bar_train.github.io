сенте — миф"],["Пастис","Анисовый аперитив без полыни, созданный как легальная замена абсента"],["Ринс (rinse)","Ополаскивание бокала небольшим количеством напитка с последующим сливом"],["Дэш","Доза биттера из дозирующей бутылки, примерно 0,8–1 мл"],["Трипл-сек","Категория сухих апельсиновых ликёров; Cointreau — её эталон"],["Con la mosca","«С мухой»: самбука с тремя кофейными зёрнами"],["B&B","Готовая смесь бенедиктина и бренди"]]]]]]],["ВЕРМУТЫ, ХЕРЕС И КРЕПЛЁНЫЕ ВИНА","Справочник бармена",[["1. Общий принцип: что такое крепление",[["p","Креплёное вино — вино, в которое добавлен виноградный спирт. Изначально это был способ сохранить вино при длительной перевозке морем: спирт останавливает деятельность бактерий и стабилизирует напиток."],["p","Ключевой момент, определяющий вкус: важно, когда именно добавлен спирт."],["t",[["Момент крепления","Что происходит","Результат","Примеры"],["До окончания брожения","Спирт убивает дрожжи, и часть сахара остаётся несброженной","Сладкое вино","Портвейн, мускат, часть мадеры"],["После окончания брожения","Сахара уже нет, спирт лишь повышает крепость","Сухое вино","Фино, мансанилья, олоросо"],["После брожения плюс подслащение","Сухая база плюс сладкое вино или сусло","Сладкое, но иначе устроенное","Крим-херес, сладкая марсала"]]],["p","Ароматизированное вино — отдельная категория: вино с добавлением спирта и растительных экстрактов. Главный её представитель — вермут."]]],["2. Вермут",[["h","2.1. История"],["p","Практика настаивать вино на полыни древняя: подобные напитки описаны в античности и применялись как лекарство — полынь считалась средством от паразитов и расстройств пищеварения."],["p","Коммерческая история начинается в Турине: в 1786 году Антонио Бенедетто Карпано выпустил вермут в современном понимании — сладкий, пряный, на основе местного белого вина. Заведение работало круглосуточно, и напиток быстро стал городской привычкой."],["p","Во Франции в 1813 году Жозеф Нуайи разработал сухой стиль — светлее, суше и травянистее итальянского. Так сложилось базовое деление, которое бармены до сих пор называют «итальянский» (сладкий красный) и «французский» (сухой белый), хотя сегодня обе страны делают оба типа."],["p","Название происходит от немецкого Wermut — полынь. Расцвет вермута пришёлся на конец XIX и начало XX века: он был основным аперитивом Европы и базой половины коктейльной классики. Затем последовал долгий спад, и только в 2010-е категория вернулась — как в коктейли, так и в самостоятельную подачу со льдом и цедрой."],["h","2.2. Что это по определению"],["p","Вермут — ароматизированное вино крепостью 14,5–22 % об., в котором не менее 75 % объёма составляет вино, обязательно присутствует полынь рода Artemisia и добавлен спирт. Остальная ботаника — на усмотрение производителя: обычно это несколько десятков трав, кореньев, специй и цедры."],["p","Типичный состав включает полынь, горечавку, хинную кору, кардамон, гвоздику, корицу, цедру, ромашку, дягиль, майоран. Горечь — обязательная часть профиля: вермут задуман как аперитив, а горечь стимулирует аппетит."],["h","2.3. Типы вермута"],["t",[["Тип","Крепость и сахар","Характер","Применение"],["Dry (Extra Dry)","17–18 %, до 50 г/л","Светлый, травянисто-цитрусовый, сухой, минеральный","Dry Martini, чистым со льдом и оливкой"],["Bianco / Blanc","15–16 %, 100–150 г/л","Белый сладкий: ваниль, цветы, мёд, мягкая горечь","С тоником, чистым, лёгкие коктейли"],["Rosso / Rouge","15–16 %, 130–150 г/л","Красный сладкий: карамель, специи, ваниль, отчётливая горечь. Цвет от колера, не от красного вина","Negroni, Manhattan, Americano"],["Rosé / Rosato","15–16 %","Ягодность, лёгкость, умеренная горечь","Аперитив со льдом, спритц"],["Chinato / Amaro-стиль","16–18 %","Усиленная хинная горечь, плотный, лекарственный","Дижестив, чистым, к шоколаду"],["Полынные региональные","варьируется","Испанский (Reus, Jerez), каталонский, аргентинский — местные традиции с более выраженной горечью","Аперитив со льдом, апельсином и оливкой"]]],["h","2.4. Марки"],["t",[["Марка","Тип","Профиль","Куда"],["Martini Rosso","Rosso","Ваниль, карамель, мягкая горечь. Массовый стандарт","Базовая позиция бара"],["Martini Extra Dry","Dry","Сухой, лёгкий, нейтральноватый","Массовые Martini"],["Cinzano 1757 Rosso","Rosso","Более пряный и горький, чем массовый сегмент","Negroni с характером"],["Carpano Antica Formula","Rosso","Плотный, ванильно-шафрановый, сладкий, очень насыщенный","Manhattan, Negroni для гостя, который любит богатое"],["Punt e Mes","Rosso / chinato","Резкая горечь поверх сладости. «Точка и половина» — половина вермута, половина биттера","Negroni с усиленной горечью"],["Cocchi Storico Vermouth di Torino","Rosso","Классический туринский профиль: какао, цитрус, горечавка","Универсальный качественный красный"],["Noilly Prat Original Dry","Dry","Выдержка на открытом воздухе: солёность, орех, травы","Dry Martini, соусы, кулинария"],["Dolin Dry / Blanc","Dry / Blanc","Лёгкий, альпийско-травяной, деликатный","Тонкие Martini, где не нужно перебивать джин"],["Yzaguirre / Lustau Vermut","Испанский Rosso","Более горький и апельсиновый, хересная база у Lustau","Vermut de grifo — аперитив со льдом и апельсином"]]],["h","2.5. Хранение — главная проблема бара"],["p","Это вино, а не крепкий алкоголь. Открытая бутылка вермута окисляется: через месяц при комнатной температуре он теряет свежесть и приобретает варёный, потускневший тон. Большинство плохих Martini и Negroni в мире испорчены не джином, а старым вермутом, простоявшим на полке полгода."],["p","Открытый вермут хранится в холодильнике, плотно закрытым."],["p","Реальный срок — 3–4 недели для сухого, до 6–8 недель для сладкого с большим содержанием сахара."],["p","Покупать маленькие бутылки выгоднее, чем литровые, если оборот низкий."],["p","Проверять просто: понюхать. Свежий вермут пахнет травами и цитрусом, старый — компотом и картоном."],["p","Дату открытия писать маркером на бутылке — самая полезная привычка на смене."]]],["3. Херес",[["h","3.1. История и регион"],["p","Херес (по-испански Jerez, по-английски Sherry) производится в так называемом хересном треугольнике на юге Испании: Херес-де-ла-Фронтера, Санлукар-де-Баррамеда и Эль-Пуэрто-де-Санта-Мария."],["p","Виноделие здесь древнее — финикийское и римское, — но мировую известность херес получил через британскую торговлю. Английские купцы веками закупали его целыми флотами; отсюда британские фамилии на этикетках испанских бодег: Osborne, Terry, Sandeman, Harveys."],["p","Ключевой сорт — паломино, дающий нейтральное сухое вино. Для сладких стилей используют педро хименес и мускат, виноград которых подвяливают на солнце."],["h","3.2. Флор и две судьбы вина"],["p","После брожения молодое вино разделяют. То, что предназначено для биологической выдержки, крепят примерно до 15 % — при этой крепости на поверхности вина развивается флор, живая плёнка дрожжей толщиной в несколько миллиметров."],["p","Флор потребляет кислород и глицерин, защищая вино от окисления и придавая ему характерный солоновато-дрожжевой, миндальный, «хлебный» тон. Так получаются фино и мансанилья."],["p","Вино, предназначенное для окислительной выдержки, крепят до 17 % и выше — при такой крепости флор погибнуть, и вино контактирует с кислородом годами, темнея и приобретая ореховые, карамельные, ладанные тона. Так получается олоросо."],["h","3.3. Солера и криадера"],["p","Херес почти никогда не бывает урожая одного года. Он выдерживается в системе солера: ряды бочек, где нижний ряд (собственно солера) содержит самое старое вино, а верхние ряды (криадеры) — всё более молодое."],["p","Разливают только часть вина из нижнего ряда, доливая его из ряда выше, тот — из следующего, и так далее. Система работает непрерывно десятилетиями, а иногда и столетиями, и вино в бутылке представляет собой смесь бесчисленного количества урожаев."],["p","Обозначения VOS и VORS указывают на средний возраст системы: примерно 20 и 30 лет соответственно."],["h","3.4. Типы хереса"],["t",[["Тип","Выдержка / крепость","Характер","Подача"],["Fino","Биологическая под флором, 15–17 %","Совершенно сухой, солоноватый, миндальный, дрожжевой, бледный","Охлаждённым 7–9 °C, к оливкам, миндалю, хамону"],["Manzanilla","То же, но только в Санлукаре у моря","Ещё легче и солонее фино — влияние морского климата на флор","Охлаждённым, к морепродуктам"],["Amontillado","Сначала под флором, затем окислительно, 16–18 %","Янтарный: фундук, табак, сухость, сложность","12–14 °C, к супам, грибам, твёрдым сырам"],["Palo Cortado","Редкий тип: флор погиб непредсказуемо","Нос амонтильядо, тело олоросо. Самый ценимый знатоками","12–14 °C, дегустационно"],["Oloroso","Только окислительная, 17–22 %","Тёмный, ореховый, кожаный, плотный, сухой при кажущейся сладости","13–15 °C, к мясу, дичи, выдержанным сырам"],["Palo / Cream","Олоросо, подслащённое PX","Сладкий, изюмный, карамельный. Британский экспортный стиль","Охлаждённым, к десертам"],["Pedro Ximénez (PX)","Из подвяленного винограда","Чёрный, вязкий, чрезвычайно сладкий: изюм, инжир, кофе, лакрица","Прохладным, к мороженому, шоколаду"],["Moscatel","Из муската","Сладкий, цветочно-цитрусовый, легче PX","К десертам, фруктам"]]],["h","3.5. Подача и коктейли"],["p","Фино и мансанилья — фактически белое вино: открытая бутылка живёт неделю в холодильнике, не больше. Их пьют охлаждёнными и молодыми."],["p","Амонтильядо, олоросо и PX окислены изначально, поэтому открытая бутылка держится месяцами."],["p","Бокал — копита или обычный винный, не рюмка. Херес — вино, и ему нужен объём для аромата."],["p","Гастрономически это один из самых сильных напитков для сочетаний: солёность фино работает с жирным и солёным лучше почти любого белого вина."],["p","В коктейлях херес даёт низкоалкогольную базу с большой сложностью. Растущее направление: Sherry Cobbler, Adonis, Bamboo, Tuxedo."]]],["4. Портвейн",[["p","Портвейн производится в долине Дору на севере Португалии — первом в мире официально демаркированном винодельческом регионе (1756 год). Крепление проводят виноградным спиртом на середине брожения, поэтому портвейн всегда сладкий: часть сахара остаётся несброженной."],["p","Как и в случае хереса, категорию сформировала британская торговля: во время войн с Францией англичане искали замену бордо, а спирт добавляли для сохранности при морской перевозке. Отсюда английские названия домов: Taylor's, Graham's, Dow's, Warre's."],["t",[["Тип","Выдержка","Характер","Подача и хранение"],["Ruby","2–3 года в больших ёмкостях","Ярко-фруктовый, простой, красная ягода","Прохладным. Открытая бутылка — до 2 недель"],["Tawny","10, 20, 30, 40 лет в бочках","Окислительный: орех, карамель, сухофрукты, кирпичный цвет","Слегка охлаждённым 12–14 °C. Открытая живёт месяцами"],["LBV (Late Bottled Vintage)","Один урожай, 4–6 лет в бочке","Плотнее ruby, доступнее винтажа","Прохладным. Обычно не требует декантации"],["Vintage","Один выдающийся урожай, 2 года в бочке, дальше в бутылке","Максимальная концентрация, десятилетия жизни, мощный осадок","Обязательна декантация. Выпить в течение 1–2 дней"],["Colheita","Tawny одного урожая, долгая бочка","Ореховый с указанием года","Как tawny"],["White / Rosé","Из белых сортов / короткая мацерация","Лёгкий, цитрусовый или ягодный","Со льдом и тоником — Porto Tonico"]]]]],["5. Мадера",[["p","Мадера — вино с португальского острова Мадейра, известное тем, что его целенаправленно нагревают и окисляют. Технология родилась из наблюдения: бочки, совершившие путешествие через тропики в трюме корабля, возвращались улучшенными, а не испорченными."],["p","Сегодня нагрев воспроизводят искусственно: эстуфаж — быстрый нагрев в резервуарах до 45–50 °C для массовых вин, кантейру — медленное естественное тепло чердаков в течение лет и десятилетий для качественных."],["t",[["Сорт","Стиль","Профиль"],["Sercial","Сухая","Резкая кислотность, миндаль, цитрус, солёность"],["Verdelho","Полусухая","Дым, орех, лёгкая сладость"],["Bual (Boal)","Полусладкая","Изюм, карамель, кофе"],["Malmsey (Malvasia)","Сладкая","Плотная: инжир, ирис, шоколад, при этом высокая кислотность"],["Tinta Negra","Любая","Основной рабочий сорт острова; стиль указывается словами"]]],["p","Уникальное свойство: мадера уже прошла нагрев и окисление, поэтому открытая бутылка практически неубиваема — она сохраняет качество месяцами и даже годами. Для бара это идеальная позиция: наливать по бокалам можно без риска."]]],["6. Марсала и прочие",[["t",[["Напиток","Происхождение","Характер и применение"],["Марсала","Сицилия","От сухой к сладкой, ореховая, карамельная. Категории по возрасту: Fine, Superiore, Vergine. Широко используется в кулинарии"],["Коммандария","Кипр","Одно из древнейших вин мира. Сладкое, изюмное, из подвяленного винограда"],["Мускат де Бом-де-Вениз","Южная Рона","Vin doux naturel: цветочный, абрикосовый, свежий"],["Баньюльс, Мори","Руссильон","Крепленое красное: какао, вишня, инжир. Работает с шоколадом"],["Токай асу","Венгрия","Не креплёное, а ботритизированное: мёд, абрикос, высокая кислотность. Уровень сладости в путтоньошах"],["Вин санто","Тоскана","Из подвяленного винограда, долгая выдержка. К кантуччи"],["Сотерн","Бордо","Ботритизированное сладкое, не креплёное. Мёд, абрикос, шафран"]]]]],["7. Винные аперитивы и биттеры",[["p","Отдельное семейство: вина, ароматизированные хинином и травами, без полыни или с иной рецептурой, чем у вермута. В коктейлях они часто взаимозаменяемы с вермутом, но дают другой характер."],["t",[["Напиток","Профиль","Применение"],["Lillet Blanc","Бордоская база, цитрус, мёд, лёгкая хинная горечь, 17 %","Vesper, аперитив со льдом и апельсином"],["Cocchi Americano","Более горький и хинный, чем Lillet","Замена исторического Kina Lillet в Vesper, Corpse Reviver №2"],["Dubonnet","Сладкий, хинный, с пряностью","Аперитив, Dubonnet Cocktail"],["Byrrh","Красный, на основе вина с хиной и мистелем","Аперитив, замена красного вермута для смены акцента"],["Cap Corse / Mattei","Корсиканский, цитрусово-хинный","Аперитив, спритц"],["Sherry Vermut","Испанский вермут на хересной базе","Аперитив со льдом и оливкой"]]]]],["8. Коктейли на креплёных и ароматизированных винах",[["t",[["Коктейль","Состав","Метод","Посуда и гарнир"],["Americano","30 мл Campari, 30 мл красный вермут, содовая","Билд","Хайбол. Апельсин"],["Negroni","30 мл джин, 30 мл Campari, 30 мл красный вермут","Стир","Олд-фэшнд. Апельсиновая цедра"],["Manhattan","60 мл ржаной, 30 мл красный вермут, дэш ангостуры","Стир","Купе. Вишня"],["Adonis","45 мл фино или амонтильядо, 45 мл красный вермут, дэши биттера","Стир","Купе. Апельсиновая цедра"],["Bamboo","45 мл фино, 45 мл сухой вермут, биттеры","Стир","Купе. Лимонная цедра"],["Sherry Cobbler","90 мл амонтильядо, 15 мл сироп, дольки апельсина","Шейк, дроблёный лёд","Хайбол. Много фруктов и мята"],["Vermouth de grifo","100 мл красный вермут, лёд, содовая по желанию","Билд","Олд-фэшнд. Апельсин и оливка. Испанская классика"],["Vesper","60 мл джин, 20 мл водка, 10 мл Lillet Blanc","Шейк","Купе. Лимонная цедра"],["Corpse Reviver №2","По 22 мл: джин, Cointreau, Cocchi Americano, лимон; ринс абсентом","Шейк","Купе. Вишня"],["Porto Tonico","60 мл белый портвейн, тоник","Билд","Копа. Мята и лимон"],["Coronation","45 мл фино, 45 мл сухой вермут, 5 мл мараскино, биттеры","Стир","Купе. Лимонная цедра"],["Spritz","60 мл Aperol, 90 мл просекко, содовая","Билд, лёд доверху","Копа. Апельсин"]]]]],["9. Практика за стойкой",[["p","Все позиции этого раздела — вино. Они окисляются, и срок жизни открытой бутылки нужно знать наизусть: фино — неделя, вермут — месяц в холодильнике, ruby-портвейн — две недели, tawny и олоросо — месяцы, мадера — практически бесконечно."],["p","Держать вермут на полке при комнатной температуре — самая частая и самая заметная ошибка бара."],["p","Если Negroni или Manhattan получаются «плоскими» — начинать проверку с вермута, а не с базы."],["p","Херес и вермут дают низкоалкогольные коктейли с высокой сложностью. Это востребованное направление: гостю, который хочет пить весь вечер и не пьянеть, предлагать именно их."],["p","Портвейн и олоросо к сырной тарелке работают лучше большинства красных вин — солёное и ореховое сочетаются напрямую."],["p","PX и мадера Malmsey — готовый десерт: полить ими мороженое дешевле и эффектнее, чем строить сложное блюдо."],["p","Ледяной вермут в Martini лучше тёплого: держать бутылку в холодильнике полезно и с точки зрения температуры коктейля."]]],["10. Мини-глоссарий",[["t",[["Термин","Значение"],["Крепление","Добавление виноградного спирта в вино; момент добавления определяет сладость"],["Флор","Плёнка дрожжей на поверхности хереса, защищающая его от окисления"],["Солера и криадера","Ярусная система бочек с непрерывным доливом молодого вина к старому"],["VOS / VORS","Херес со средним возрастом системы около 20 и 30 лет"],["Копита","Узкий бокал-тюльпан для хереса"],["Эстуфаж / кантейру","Быстрый искусственный и медленный естественный нагрев мадеры"],["Вин дус натюрель","Французское креплёное сладкое вино (Мускат де Бом-де-Вениз, Баньюльс)"],["Ботритис","«Благородная плесень», концентрирующая сахар в ягодах"],["Мистель","Виноградное сусло, закреплённое спиртом до начала брожения"],["Вермут де грифо","Разливной вермут из крана — испанская барная традиция"],["Дозаж","Добавление сладкого компонента для финальной настройки вкуса"]]]]]]],["ВИНО","Справочник бармена",[["1. Что такое вино",[["p","Вино — напиток, полученный полным или частичным спиртовым брожением свежего винограда или виноградного сусла. Всё остальное — фруктовые, ягодные, рисовые напитки — вином в юридическом смысле не является, хотя в быту так называется."],["p","Ключевая идея, отличающая вино от крепкого алкоголя: вино отражает место. Один и тот же сорт, посаженный в двух долинах, даёт разное вино — это и называется терруаром: совокупность почвы, климата, рельефа и человеческой традиции."]]],["2. История",[["h","2.1. Кавказ, Египет, античность"],["p","Древнейшие археологические свидетельства виноделия найдены на территории современных Грузии и Армении и датируются примерно шестым тысячелетием до нашей эры — глиняные сосуды с остатками винной кислоты. Грузинская традиция выдержки в квеври, закопанных в землю, существует непрерывно с тех пор и внесена в список нематериального наследия ЮНЕСКО."],["p","Из Закавказья виноделие распространилось в Месопотамию, Египет, а затем в Грецию, где вино стало частью религии и повседневности. Греки разбавляли вино водой и считали неразбавленное питьё варварством."],["h","2.2. Рим и монастыри"],["p","Рим превратил виноделие в системную отрасль: римляне разнесли лозу по всей Европе, заложив виноградники в Галлии, Испании, на Рейне и Мозеле. Многие современные знаменитые регионы — прямые наследники римских посадок."],["p","После падения империи носителем традиции стала церковь: вино требовалось для литургии, а монастыри имели землю, рабочие руки и письменность. Цистерцианцы в Бургундии веками фиксировали, какие участки дают лучшее вино, — так родилась идея крю, отдельного виноградника со своим характером."],["h","2.3. Бордо и англичане"],["p","В 1152 году Алиенора Аквитанская вышла замуж за будущего Генриха II Английского, и Аквитания вместе с Бордо на три века перешла под английскую корону. Это сформировало Бордо как экспортный регион, ориентированный на британский рынок."],["p","Англичане называли лёгкое красное бордо claret, и торговля им стала настолько значимой, что бордоские негоцианты выстроили целую систему посредничества, работающую до сих пор: производитель продаёт не потребителю, а торговому дому."],["h","2.4. Шампанское: миф о Доме Периньоне"],["p","Расхожая история о том, что монах Пьер Периньон изобрёл шампанское и воскликнул, что пробует звёзды, — легенда, созданная позднее и активно поддержанная маркетингом."],["p","Реальный вклад Периньона противоположен: он боролся с вторичным брожением, считая пузырьки дефектом, и работал над качеством тихих вин, купажированием и осветлением. Пузырьки в шампанском изначально были проблемой холодного климата — брожение останавливалось зимой и возобновлялось весной уже в бутылке, которая нередко взрывалась."],["p","Технологию управляемого вторичного брожения довели до ума позже, в том числе английские стеклодувы, научившиеся делать бутылки, выдерживающие давление, и вдова Клико, разработавшая ремюаж — систему удаления осадка."],["h","2.5. Классификация 1855 года"],["p","К Всемирной выставке в Париже Наполеон III поручил составить рейтинг вин Бордо. Брокеры составили его быстрым и прагматичным способом: по рыночным ценам, сложившимся за предыдущие десятилетия."],["p","Получилось пять уровней гран крю классе для Медока и Сотерна. Список практически не менялся с тех пор — единственное значимое изменение произошло в 1973 году, когда Château Mouton Rothschild был повышен до первой категории после десятилетий лоббирования."],["p","Что из этого следует: классификация 1855 года отражает цены середины XIX века, а не сегодняшнее качество. Она остаётся мощным маркетинговым инструментом, но не является объективным рейтингом."],["h","2.6. Филлоксера и пересборка виноделия"],["p","С 1860-х годов завезённая из Америки тля филлоксера уничтожила виноградники Европы почти полностью — во Франции погибло около двух третей площадей. Экономическая катастрофа сопоставима с эпидемией."],["p","Решением стала прививка европейской лозы Vitis vinifera на устойчивый американский подвой. Практически весь мировой виноградник сегодня растёт на американских корнях. Уцелели лишь отдельные участки с песчаными почвами, где тля не выживает, — их вина продаются с пометкой о корнесобственной лозе."],["p","Побочные следствия: исчезновение многих локальных сортов, унификация ассортимента и — как отмечено в разделе про крепкий алкоголь — временный крах коньяка, которым воспользовались виски и ром."],["h","2.7. AOC и рождение системы наименований"],["p","После филлоксеры и последовавшей волны подделок Франция в 1935 году создала систему контролируемых наименований по происхождению — AOC. Она регламентировала границы, сорта, урожайность и методы."],["p","Модель оказалась настолько удачной, что её скопировали Италия (DOC/DOCG), Испания (DO/DOCa), Португалия и позже весь Евросоюз. Это же объясняет главное различие в этикетках: в Старом Свете на бутылке пишут место, в Новом — сорт винограда."],["h","2.8. Парижский суд 1976 года"],["p","В 1976 году британский торговец Стивен Спурье организовал в Париже слепую дегустацию, где французские жюри сравнивали лучшие вина Бордо и Бургундии с калифорнийскими."],["p","Победили калифорнийские — и в белой, и в красной категории. Событие, получившее название «Парижский суд», разрушило представление о безусловном превосходстве Франции и легитимизировало Новый Свет как серьёзного игрока. Отрасль изменилась необратимо."],["h","2.9. Новый Свет и глобализация вкуса"],["p","С 1980–90-х Калифорния, Австралия, Чили, Аргентина, Новая Зеландия и ЮАР вышли на мировой рынок с понятной этикеткой, стабильным качеством и доступной ценой. Вино перестало быть исключительно европейским продуктом."],["p","Побочный эффект — обвинения в унификации: под влиянием влиятельных критиков и международного спроса многие регионы начали делать похожие плотные, дубовые, высокоалкогольные вина. Реакцией 2010-х стал разворот к лёгкости, свежести, минимальному вмешательству, натуральному и оранжевому вину, а также возрождение автохтонных сортов."]]],["3. Классификации",[["t",[["Признак","Категории"],["По цвету","Белое, красное, розовое, оранжевое (белое на мезге, как красное)"],["По содержанию сахара","Сухое (до 4 г/л), полусухое (до 12), полусладкое (до 45), сладкое (свыше 45)"],["По наличию газа","Тихое, игристое (свыше 3 атм), жемчужное (1–2,5 атм)"],["По крепости и технологии","Столовое, крепленое (портвейн, херес), ароматизированное (вермут)"],["По выдержке","Молодое, резерв, гран резерва — конкретные требования различаются по странам"],["По уровню наименования (ЕС)","Столовое → региональное (IGP/IGT) → защищённое наименование (AOC/DOC/DO)"]]],["h","Старый Свет и Новый Свет"],["t",[["","Старый Свет","Новый Свет"],["Кто","Франция, Италия, Испания, Германия, Португалия, Австрия, Греция, Грузия","США, Чили, Аргентина, Австралия, Новая Зеландия, ЮАР"],["Этикетка","Указано место (Шабли, Кьянти, Риоха)","Указан сорт (Шардоне, Мальбек)"],["Стиль","Сдержаннее, кислотнее, «земляной», под еду","Фруктовее, плотнее, чаще выше алкоголь"],["Правила","Жёсткие: сорта, урожайность, методы","Гибкие: эксперименты разрешены"]]]]],["4. Ключевые сорта винограда",[["h","Белые"],["t",[["Сорт","Профиль","Классические регионы"],["Шардоне","Хамелеон: от стального и минерального без дуба до маслянисто-ванильного с бочкой","Бургундия (Шабли, Кот-де-Бон), Калифорния, Австралия"],["Совиньон Блан","Резкая кислотность, крыжовник, зелёная трава, цитрус, иногда «кошачий» тон","Луара (Сансер, Пуйи-Фюме), Новая Зеландия (Мальборо)"],["Рислинг","Высочайшая кислотность, петроль с возрастом, от абсолютно сухого до десертного","Германия (Мозель, Рейнгау), Эльзас, Австрия"],["Пино Гри / Гриджо","В Италии — лёгкий и нейтральный; в Эльзасе — плотный, пряный, полусладкий","Венето, Эльзас, Орегон"],["Гевюрцтраминер","Ароматный: роза, личи, имбирь, пряность. Низкая кислотность","Эльзас, Альто-Адидже"],["Вионье","Абрикос, персик, цветы, маслянистое тело","Северная Рона (Кондрие)"],["Шенен Блан","Гибкий: от сухого до сладкого, айва, мёд, высокая кислотность","Луара (Вувре), ЮАР"],["Альбариньо","Морская свежесть, цитрус, солоноватость","Риас Байшас, Испания"],["Грюнер Вельтлинер","Белый перец, зелёное яблоко, свежесть","Австрия"]]],["h","Красные"],["t",[["Сорт","Профиль","Классические регионы"],["Каберне Совиньон","Плотные танины, чёрная смородина, кедр, графит. Долго живёт","Бордо (левый берег), Напа, Чили, Коонаварра"],["Мерло","Мягче и округлее каберне: слива, вишня, шоколад","Бордо (правый берег, Помроль), Италия, Чили"],["Пино Нуар","Лёгкое тело, высокая кислотность, вишня, земля, грибы. Капризен","Бургундия, Орегон, Новая Зеландия"],["Сира / Шираз","Чёрный перец, ежевика, копчёность. В Австралии плотнее и слаще","Северная Рона, Австралия (Баросса)"],["Гренаш / Гарнача","Клубника, специи, высокий алкоголь, мягкие танины","Южная Рона (Шатонёф-дю-Пап), Испания (Приорат)"],["Темпранильо","Вишня, кожа, ваниль от американского дуба, табак","Риоха, Рибера-дель-Дуэро"],["Санджовезе","Высокая кислотность и танины, вишня, томатный лист, травы","Тоскана (Кьянти, Брунелло)"],["Неббиоло","Бледный цвет, мощные танины, роза, дёготь, вишня. Требует лет","Пьемонт (Бароло, Барбареско)"],["Мальбек","Плотный, чернильный, слива, фиалка, мягкие танины","Аргентина (Мендоса), Каор"],["Зинфандель / Примитиво","Джемовость, высокий алкоголь, специи","Калифорния, Апулия"],["Карменер","Зелёный перец, слива, пряность. Долго путали с мерло","Чили"],["Пинотаж","Дымность, слива, характерный «жжёный» тон","ЮАР"]]]]],["5. Регионы: Старый Свет",[["t",[["Регион","Что делают","Что важно знать"],["Бордо","Красные купажи каберне и мерло, сухие и сладкие белые","Левый берег — каберне и структура; правый — мерло и мягкость. Сотерн — ботритизированное сладкое"],["Бургундия","Пино нуар и шардоне, почти всегда моносортовые","Иерархия: региональное → коммунальное → премье крю → гран крю. Участок важнее производителя"],["Рона","Север — сира; юг — купажи на гренаше","Кот-Роти и Эрмитаж на севере; Шатонёф-дю-Пап на юге"],["Луара","Совиньон блан, шенен блан, каберне фран","Сансер, Вувре, Мюскаде. Самые свежие и «прохладные» вина Франции"],["Эльзас","Ароматные белые: рислинг, гевюрцтраминер, пино гри","Единственный французский регион, пишущий сорт на этикетке"],["Шампань","Игристое по традиционному методу","Шардоне, пино нуар, пино менье. Отдельный раздел ниже"],["Пьемонт","Неббиоло (Бароло, Барбареско), барбера, москато","Танинные, долгоживущие вина. Асти — сладкое игристое"],["Тоскана","Санджовезе: Кьянти, Брунелло ди Монтальчино","«Супертосканцы» — вина вне классификации на международных сортах"],["Венето","Просекко, Соаве, Вальполичелла, Амароне","Амароне делается из подвяленного винограда: плотный, высокоалкогольный"],["Риоха","Темпранильо с выдержкой в американском дубе","Иерархия по выдержке: Joven, Crianza, Reserva, Gran Reserva"],["Рибера-дель-Дуэро","Темпранильо в более плотном стиле","Резкий континентальный климат, концентрированные вина"],["Германия","Рислинг, шпетбургундер (пино нуар)","Шкала спелости: Kabinett → Spätlese → Auslese → BA → TBA. Trocken означает сухое"],["Португалия","Автохтонные сорта, Дору, Виньо Верде","Виньо Верде — лёгкое, слегка игристое, низкоалкогольное"],["Грузия","Саперави, ркацители; традиция квеври","Оранжевые вина на мезге в глиняных сосудах — древнейшая непрерывная традиция"]]]]],["6. Регионы: Новый Свет",[["t",[["Страна","Ключевые сорта и регионы","Стиль"],["США","Напа и Сонома: каберне, шардоне. Орегон: пино нуар","Напа — плотные дубовые каберне; Орегон — прохладный, бургундский подход"],["Чили","Каберне, карменер, совиньон блан. Майпо, Касабланка","Стабильное качество, хорошее соотношение цены и качества. Лоза не поражена филлоксерой"],["Аргентина","Мальбек, торронтес. Мендоса","Высокогорные виноградники, плотные и мягкие красные"],["Австралия","Шираз, шардоне. Баросса, Ярра, Клэр","От джемовых плотных ширазов до строгих прохладных рислингов"],["Новая Зеландия","Совиньон блан (Мальборо), пино нуар (Центральный Отаго)","Мальборо задал мировой эталон яркого травянисто-цитрусового совиньона"],["ЮАР","Шенен блан, пинотаж, каберне. Стелленбош","Мостик между Старым и Новым Светом по стилю"]]]]],["7. Игристые вина",[["t",[["Название","Метод","Характер"],["Шампанское","Traditionnelle: вторичное брожение в бутылке, выдержка на осадке от 15 месяцев (винтаж — от 36)","Тонкий стойкий перляж, бриошь, дрожжевые и ореховые тона от автолиза"],["Креман","Тот же традиционный метод, но вне Шампани","Схожая структура, заметно ниже цена. Лучший «бюджетный традиционный метод»"],["Кава","Традиционный метод, Испания, местные сорта","Более землистая и цитрусовая, чем шампанское"],["Франчакорта","Традиционный метод, Ломбардия","Итальянский ответ шампанскому, часто высокого уровня"],["Просекко","Charmat: вторичное брожение в танке","Фруктовое, цветочное, лёгкое. Дрожжевых нот нет — метод их не даёт"],["Асти","Одно неполное брожение под давлением, сорт москато","Сладкое, низкоалкогольное, мускатное"],["Ламбруско","Игристое красное, Эмилия-Романья","От сухого до сладкого, кислотное, к жирной еде"],["Пет-нат","Ancestrale: розлив до окончания первого брожения","Мутноватое, непредсказуемое, слабое давление. Модная категория"]]],["h","Шкала сахара в игристом"],["t",[["Обозначение","Сахар, г/л","Ощущение"],["Brut Nature / Zéro Dosage","0–3","Совершенно сухое, резкое, минеральное"],["Extra Brut","0–6","Очень сухое"],["Brut","до 12","Сухое. Основной стиль шампанского"],["Extra Dry / Extra Sec","12–17","Слегка сладковатое. Название вводит в заблуждение — оно слаще Brut"],["Sec / Dry","17–32","Заметно сладковатое"],["Demi-Sec","32–50","Сладкое, к десертам"],["Doux","свыше 50","Очень сладкое, редкость"]]]]],["8. Производство: коротко",[["t",[["Этап","Белое","Красное"],["Сбор и дробление","Быстрое отделение сока от кожицы","Кожица остаётся: она даёт цвет и танины"],["Мацерация","Обычно отсутствует (кроме оранжевых вин)","От нескольких дней до месяца — ключевой этап"],["Брожение","14–18 °C, дольше, для сохранения аромата","25–30 °C, интенсивнее, для экстракции"],["Малолактика","Опционально: смягчает кислотность, даёт сливочность","Почти всегда: смягчает вино"],["Выдержка","Сталь для свежести, дуб для плотности","Дуб — большинство серьёзных вин; барик 225 л отдаёт активнее"],["Розлив","Фильтрация, при необходимости стабилизация","То же; часть вин разливается нефильтрованными"]]]]],["9. Дегустация и дефекты",[["h","Порядок оценки"],["p","Внешний вид: прозрачность, интенсивность, оттенок. У красных с возрастом кромка становится кирпичной, у белых цвет углубляется к золоту."],["p","Нос: первый заход без вращения — летучие ноты; затем вращение и второй заход — раскрытые ароматы."],["p","Вкус: атака, тело, кислотность, танины, спиртуозность, баланс, длина послевкусия."],["p","Вывод: готовность к употреблению, соответствие ожиданиям, к чему подать."],["h","Структурные параметры"],["t",[["Параметр","Как оценивать"],["Кислотность","По слюноотделению. Высокая кислотность — вино освежает и хорошо идёт с едой"],["Танины","По вяжущему ощущению на дёснах и языке. Только у красных и оранжевых"],["Тело","По плотности во рту: от воды до сливок"],["Алкоголь","По согревающему ощущению в горле; выше 14 % заметно"],["Сахар","По сладости на кончике языка. Часто путают с фруктовостью — сухое фруктовое вино сладким не является"],["Длина","Сколько секунд держится послевкусие. Ключевой маркер уровня"]]],["h","Дефекты"],["t",[["Дефект","Как проявляется","Что делать"],["Пробковая болезнь (TCA)","Мокрый картон, сырой подвал, плесневелая тряпка. Фрукт «выключен»","Бутылка заменяется. Это не вина ресторана и не повод спорить с гостем"],["Окисление","Потеря свежести, ореховый и яблочно-подгнивший тон, потемневший цвет","Заменить. Частая проблема вина по бокалам при плохом хранении"],["Бретаномицес","Конюшня, пластырь, копчёность. В малых дозах некоторыми ценится","Вопрос вкуса и уровня. Явный перебор — дефект"],["Летучая кислотность","Уксус, лак для ногтей","Дефект, заменить"],["Редукция","Спички, тухлое яйцо, резина","Часто уходит после декантации и аэрации"],["Кристаллы винного камня","Прозрачные кристаллы на пробке или на дне","Не дефект. Безвредно и никак не влияет на вкус"]]]]],["10. Сервис",[["h","Температура подачи"],["t",[["Категория","Температура","Почему"],["Игристые","6–8 °C","Холод удерживает газ и делает перляж тоньше"],["Лёгкие белые, розовые","8–10 °C","Подчёркивает свежесть и кислотность"],["Плотные белые с дубом","10–12 °C","Слишком холодное закрывает аромат"],["Лёгкие красные (пино нуар, гамэ)","12–14 °C","Лёгкое охлаждение освежает и убирает спиртуозность"],["Плотные красные","16–18 °C","«Комнатная температура» — норма XIX века, когда комнаты были прохладнее. Выше 20 °C вино кажется спиртуозным"],["Десертные и крепленые","8–14 °C","Зависит от типа; сладкие подают прохладнее"]]],["h","Порядок и техника"],["p","Порядок подачи: игристое → белое → красное, лёгкое → плотное, молодое → старое, сухое → сладкое. Нарушение порядка портит восприятие следующих вин."],["p","Открытие: срезать фольгу ниже кольца горлышка, штопор ввести по центру, не проходя пробку насквозь. Игристое — держать пробку, вращать бутылку, выпускать газ с тихим шипением, а не хлопком: хлопок означает потерю газа."],["p","Проба: наливается автору заказа примерно на треть бокала. Проба — проверка на дефект, а не оценка «нравится или нет»."],["p","Наполнение: тихое вино — до самой широкой части бокала, примерно на треть. Игристое — в два приёма, чтобы пена осела."],["p","Декантация: молодым танинным винам — для аэрации; старым — для отделения осадка, аккуратно и без взбалтывания. Очень старые вина от долгой аэрации могут разрушиться за считаные минуты."],["p","Открытая бутылка живёт 2–3 дня в холодильнике с пробкой, игристое — сутки с герметичной пробкой. Вакуумная пробка продлевает срок, система с инертным газом — заметно дольше."]]],["11. Вино и еда",[["t",[["Принцип","Как работает","Пример"],["Кислотность режет жир","Кислое вино очищает нёбо от жирной еды","Шабли к устрицам, кьянти к пасте с мясным соусом"],["Танины любят белок","Белок и жир смягчают танины","Каберне к стейку"],["Сладкое к сладкому","Вино должно быть слаще десерта, иначе покажется кислым","Сотерн к фруктовому десерту"],["Соль снижает горечь","Солёная еда смягчает танины и подчёркивает фрукт","Игристое к чипсам и жареному — рабочая пара"],["Острое и алкоголь","Высокий алкоголь усиливает жжение","К острому — низкоалкогольное полусладкое, например рислинг"],["Вес к весу","Лёгкое блюдо — лёгкое вино, плотное — плотное","Рыба на пару и пино гриджо; рагу и шираз"],["Региональный принцип","Что растёт вместе, то и сочетается","Санджовезе к тосканской кухне, альбариньо к морепродуктам Галисии"]]],["p","Сложные для вина продукты: артишок, спаржа, сырые яйца, очень острое, шоколад и мятная зелень. С ними стоит либо подбирать очень осознанно, либо честно предложить что-то другое."]]],["12. Мини-глоссарий",[["t",[["Термин","Значение"],["Терруар","Совокупность почвы, климата, рельефа и традиции, формирующая характер вина"],["Крю (cru)","Виноградник или его класс; в Бургундии — конкретный участок"],["Мезга","Смесь сока, кожицы и косточек в процессе мацерации"],["Малолактическое брожение","Превращение яблочной кислоты в молочную: вино становится мягче и сливочнее"],["Барик","Дубовая бочка 225 л; малый объём — быстрая отдача дуба"],["Автолиз","Распад дрожжей при выдержке на осадке; даёт бриошь и ореховые тона в шампанском"],["Ремюаж и дегоржаж","Сведение осадка к горлышку и его удаление при производстве игристого"],["Дозаж","Ликёр, добавляемый после дегоржажа; определяет уровень сахара"],["Ботритис","«Благородная плесень», концентрирующая сахар: Сотерн, Токай, немецкие BA и TBA"],["Оранжевое вино","Белый виноград, сброженный на мезге; танинное, янтарное"],["Пет-нат","Игристое предкового метода: розлив до окончания первого брожения"],["Винтаж / миллезим","Год урожая. Non-vintage — купаж нескольких лет"],["Квеври","Глиняный сосуд, закапываемый в землю; грузинская традиция"]]]]]]],["ПИВО","Справочник бармена",[["1. Что такое пиво",[["p","Пиво — напиток брожения из четырёх базовых компонентов: солод (обычно ячменный), вода, хмель и дрожжи. Спиртовое брожение происходит без перегонки, поэтому крепость обычно составляет 4–8 %, хотя отдельные стили доходят до 12 % и выше."],["t",[["Компонент","Что даёт"],["Солод","Сахар для брожения, тело, цвет и вкус: от бисквита и карамели до кофе и шоколада в зависимости от степени обжарки"],["Хмель","Горечь, балансирующая сладость солода, аромат (цитрус, хвоя, тропические фрукты, травы) и природная консервация"],["Вода","Минеральный состав определяет стиль: жёсткая вода Бёртона выявляет хмель, мягкая вода Пльзня — деликатность"],["Дрожжи","Спирт, углекислота и значительная часть аромата. У бельгийских и пшеничных стилей дрожжи — главный источник вкуса"]]]]],["2. История",[["h","2.1. Шумер и Египет"],["p","Пиво — один из древнейших приготовленных человеком напитков. Шумерский «Гимн Нинкаси» (примерно 1800 год до нашей эры) — одновременно религиозный текст и фактически рецепт: он описывает приготовление хлеба-основы и его сбраживание."],["p","В Египте пиво было частью оплаты труда: строителям пирамид выдавали хлеб и пиво как ежедневный паёк. Оно было мутным, густым, слабоалкогольным и по сути пищей, а не напитком для опьянения — а заодно источником безопасной жидкости в мире, где вода часто была заражена."],["h","2.2. Монастыри и хмель"],["p","В средневековой Европе пивоварение сосредоточилось в монастырях: они имели зерно, воду, помещения и мотив — пиво разрешалось пить в пост, поскольку считалось жидкостью, а не пищей. Бельгийские траппистские пивоварни — прямое продолжение этой линии."],["p","До хмеля для горечи и консервации использовали грюйт — смесь трав (болотный мирт, тысячелистник, багульник), нередко находившуюся под контролем церкви или феодала. Переход на хмель, распространившийся с XI по XV век, был не только технологическим, но и экономическим: хмель хранился лучше, а монополия на грюйт рушилась."],["h","2.3. Закон о чистоте 1516 года"],["p","Баварский Reinheitsgebot 1516 года разрешал использовать при варке пива только ячмень, хмель и воду. Дрожжи в перечень не входили — об их существовании ещё не знали, брожение считалось самопроизвольным."],["p","Мотивы закона были не только качественными: он запрещал использовать пшеницу и рожь, оставляя их для хлебопечения, и попутно устанавливал ценовое регулирование. Закон закрепил немецкий стиль пивоварения на столетия и до сих пор используется как маркетинговый аргумент."],["h","2.4. Революция лагера"],["p","В Баварии сложилась практика хранить пиво в холодных альпийских пещерах со льдом. В таких условиях доминировали дрожжи, работающие при низкой температуре и оседающие на дно, — так возник лагер (от немецкого lagern, «хранить»)."],["p","Лагер получался чище, стабильнее и дольше хранился. Когда появились промышленное охлаждение и железные дороги, он вытеснил эли почти по всему миру: сегодня подавляющее большинство мирового пива — лагер."],["h","2.5. Пильзнер 1842 года"],["p","В 1842 году в чешском городе Пльзень пивовар Йозеф Гролль сварил пиво, соединившее три новшества: очень мягкую местную воду, светлый солод, высушенный непрямым нагревом по английской технологии, и баварские низовые дрожжи."],["p","Результат был золотистым и прозрачным — в эпоху, когда пиво было мутным и тёмным. Совпадение с распространением недорогого стекла сделало эффект решающим: впервые пиво стало красивым. Пильзнер стал самым копируемым стилем в истории, и почти всё массовое светлое пиво мира — его дальний потомок."],["h","2.6. IPA и легенда об Индии"],["p","Расхожая история гласит, что India Pale Ale изобрели специально для перевозки в Индию, добавив побольше хмеля и спирта, чтобы пиво пережило путь вокруг Африки."],["p","Более точная версия: сильно охмелённые светлые эли уже существовали в Англии, а экспорт в Индию был одним из направлений сбыта, а не причиной создания стиля. Дополнительное охмеление действительно помогало сохранности, но «изобретение ради Индии» — упрощение, закрепившееся в XX веке."],["p","Современный IPA — вообще другой напиток: американская хмелевая революция 1980–90-х сместила акцент с горечи на аромат, а стиль NEIPA 2010-х сделал пиво мутным, мягким и тропически-фруктовым, почти без горечи."],["h","2.7. Пастер, холод и промышленность"],["p","В 1860–70-х Луи Пастер описал роль микроорганизмов в брожении, что позволило контролировать процесс, а не полагаться на удачу. Эмиль Хансен в Карлсберге выделил чистую культуру дрожжей в 1883 году — с этого момента пивоварение стало воспроизводимым."],["p","Промышленное охлаждение, пастеризация, стекло и железные дороги превратили локальный продукт в глобальный товар. Одновременно началась консолидация: число пивоварен в мире сокращалось почти столетие подряд."],["h","2.8. Сухой закон и мировые войны"],["p","Американский сухой закон уничтожил тысячи пивоварен; выжили немногие, переключившиеся на солодовый экстракт и безалкогольные напитки. После отмены рынок остался за несколькими крупными компаниями, а стиль сместился к лёгкому лагеру с добавлением кукурузы и риса."],["p","В Европе войны привели к нормированию сырья и падению плотности пива. Британский стиль mild и лёгкие лагеры континента во многом — наследие экономии военного времени."],["h","2.9. Крафтовая революция"],["p","Разворот начался в США в 1970–80-х. Ключевые точки: возрождение Anchor Brewing Фрицем Мейтагом, легализация домашнего пивоварения в 1978 году и появление Sierra Nevada, чей Pale Ale на американском хмеле Cascade задал новый вкусовой ориентир — цитрусово-хвойный, ранее пиву не свойственный."],["p","За четыре десятилетия число пивоварен в США выросло с нескольких десятков до многих тысяч. Волна разошлась по миру, вернув в обиход забытые стили — портер, гозе, сауэр, барливайн — и породив новые. Россия прошла собственную крафтовую волну в 2010-е, и сегодня локальные пивоварни есть почти в каждом крупном городе."]]],["3. Эль и лагер: главное деление",[["t",[["","Эль (верховое брожение)","Лагер (низовое брожение)"],["Дрожжи","Saccharomyces cerevisiae, работают в верхней части","Saccharomyces pastorianus, оседают на дно"],["Температура брожения","15–24 °C","7–13 °C"],["Срок","Быстрее: дни","Дольше: недели, плюс холодная выдержка"],["Вкусовой профиль","Фруктовые эфиры, пряность, сложность от дрожжей","Чистый, ясный, солод и хмель без дрожжевых нот"],["Примеры","Pale Ale, IPA, стаут, портер, бельгийские, пшеничные","Пильзнер, хеллес, мэрцен, бок, шварцбир"]]],["p","Третья группа — пиво спонтанного брожения (ламбик, гёз), где сусло засевается дикими дрожжами и бактериями из воздуха. Отдельно стоят гибриды: кёльш и альтбир бродят как эли, но выдерживаются холодом как лагеры."]]],["4. Параметры на этикетке",[["t",[["Параметр","Что означает","Ориентиры"],["ABV","Содержание спирта в объёмных процентах","Сессионное — до 4,5 %; стандарт — 4,5–6 %; крепкое — свыше 7 %"],["IBU","Единицы горечи. Измеряют содержание изо-альфа-кислот хмеля","Лагер 8–20, Pale Ale 30–45, IPA 50–70, Double IPA свыше 80. Выше 100 человек различий уже не чувствует"],["SRM / EBC","Цвет: от соломенного до чёрного","SRM 2–4 светлое, 10–18 янтарное, свыше 30 тёмное. EBC примерно вдвое больше SRM"],["OG / FG","Начальная и конечная плотность сусла","Разница между ними определяет крепость и остаточную сладость"],["Плотность","В России часто указывают начальную плотность в процентах","Примерный ориентир: 11–12 % плотности дают около 4,5–5 % спирта"]]],["p","Важная поправка про IBU: высокая цифра не означает, что пиво покажется горьким. Горечь воспринимается относительно солодовой сладости: Double IPA на 80 IBU с плотным сладким телом ощущается мягче, чем сухой пильзнер на 35."]]],["5. Стили: лагеры",[["t",[["Стиль","ABV / IBU","Профиль","Подача"],["Czech Pilsner","4,2–5,4 % / 30–45","Богатый солод, травянисто-пряный жатецкий хмель, плотная кремовая пена","6–8 °C, кружка или пильзнерский бокал"],["German Pils","4,4–5,2 % / 22–40","Суше и резче чешского, минеральный финиш","5–7 °C, узкий бокал"],["Helles","4,7–5,4 % / 16–22","Мягкий, хлебно-солодовый, хмель едва заметен. Питкий","6–8 °C, кружка"],["Dunkel","4,5–5,6 % / 18–28","Тёмный солод: хлебная корка, лёгкая карамель, без жжёности","8–10 °C"],["Schwarzbier","4,4–5,4 % / 20–30","Чёрный, но лёгкий: кофейная нота при сухом теле","8–10 °C"],["Märzen / Oktoberfest","5,6–6,3 % / 18–24","Тостовый солод, округлость, сухой финиш","8–10 °C, масс-кружка"],["Bock","6,3–7,6 % / 20–27","Плотный солодовый, карамель, сухофрукты","9–12 °C"],["Doppelbock","7–10 % / 16–26","Очень плотный: изюм, патока, шоколад. Монашеский «жидкий хлеб» поста","10–12 °C, снифтер"],["Vienna Lager","4,7–5,5 % / 18–30","Янтарный, тостовый, сбалансированный","8–10 °C"],["American Light Lager","3,5–4,5 % / 8–12","Максимально лёгкий, с кукурузой или рисом","3–5 °C"]]]]],["6. Стили: эли",[["t",[["Стиль","ABV / IBU","Профиль","Подача"],["English Bitter","3,2–4,6 % / 25–40","Сессионный: карамельный солод, землистый хмель, низкая газация","10–12 °C, пинта"],["American Pale Ale","4,5–6,2 % / 30–50","Цитрус, хвоя, грейпфрут от американского хмеля, солодовая опора","7–9 °C"],["IPA (American)","5,5–7,5 % / 50–70","Мощный хмелевой аромат и горечь, сухой финиш","7–9 °C, тюльпан"],["NEIPA / Hazy","6–8 % / 25–50","Мутный, мягкий, тропические фрукты, почти без горечи, кремовое тело","7–9 °C, свежим — стиль быстро теряет аромат"],["Double / Imperial IPA","7,5–10 % / 65–100","Концентрированный хмель, ощутимый алкоголь","9–11 °C"],["Amber / Red Ale","4,5–6 % / 25–40","Карамель, тост, умеренный хмель","8–10 °C"],["Brown Ale","4,2–6 % / 20–30","Орех, карамель, лёгкий шоколад","9–12 °C"],["Porter","4,5–6,5 % / 20–35","Шоколад, кофе, лёгкая жжёность, среднее тело","9–12 °C"],["Dry Stout","4–5 % / 30–45","Жжёный ячмень, кофейная сухость, кремовая азотная пена","8–10 °C, пинта"],["Milk / Sweet Stout","4–6 % / 20–35","Лактоза даёт сладость: молочный шоколад, кофе с молоком","9–12 °C"],["Imperial Stout","8–12 % / 50–90","Очень плотный: тёмный шоколад, патока, сухофрукты, часто бочковая выдержка","12–14 °C, снифтер"],["Barleywine","8–12 % / 35–70","Карамель, ирис, сухофрукты, спиртовая теплота. Хорошо стареет","12–14 °C, снифтер"]]]]],["7. Стили: пшеничные, бельгийские и кислые",[["t",[["Стиль","ABV / IBU","Профиль","Подача"],["Hefeweizen","4,3–5,6 % / 8–15","Дрожжевой характер: банан и гвоздика. Мутное, пышная пена","6–8 °C, высокий пшеничный бокал"],["Witbier","4,5–5,5 % / 8–20","Пшеница с кориандром и апельсиновой цедрой, мягкое, освежающее","5–7 °C, часто с долькой апельсина"],["Kölsch","4,4–5,2 % / 18–30","Гибрид: чистый как лагер, с лёгкой фруктовостью эля","6–8 °C, узкая штанге 200 мл"],["Saison","5–7 % / 20–35","Сельский бельгийский: перечность, сухость, высокая газация, цитрус","8–10 °C"],["Belgian Dubbel","6–7,6 % / 15–25","Тёмный солод, изюм, карамель, пряные дрожжи","10–12 °C, кубок"],["Belgian Tripel","7,5–9,5 % / 20–40","Светлый, но крепкий: пряность, груша, сухой финиш, обманчиво питкий","8–10 °C, тюльпан"],["Quadrupel","9–12 % / 20–35","Плотный, сливовый, карамельно-пряный, долгоживущий","12–14 °C, кубок"],["Lambic / Gueuze","5–8 % / 0–10","Спонтанное брожение: кислый, «конюшенный», сухой, шампанизированная газация","7–9 °C, флейта"],["Kriek / Framboise","5–7 %","Ламбик на вишне или малине: от очень кислого до сладкого","7–9 °C"],["Berliner Weisse","2,8–3,8 % / 3–8","Лёгкий, резко кислый, низкоалкогольный. Часто с сиропом","5–7 °C"],["Gose","4–5 % / 5–12","Кисло-солёный с кориандром. Соль — часть стиля","5–7 °C"],["Fruited Sour","4–6 %","Современная кислая база с большим количеством фруктового пюре","5–7 °C"]]]]],["8. Производство",[["t",[["Этап","Что происходит"],["Соложение","Ячмень проращивают и сушат. Температура сушки определяет цвет и вкус: от светлого пильзнерского до чёрного жжёного"],["Дробление и затирание","Солод дробят и смешивают с горячей водой; ферменты превращают крахмал в сахар. Температурные паузы задают тело и сбраживаемость"],["Фильтрация сусла","Отделение жидкого сусла от дробины (зерновых оболочек)"],["Кипячение с хмелем","Кипятят 60–90 минут. Ранний хмель даёт горечь, поздний — аромат; хмель на охлаждении и «сухое охмеление» — только аромат"],["Охлаждение и брожение","Дрожжи задают при нужной температуре. От дней до недель"],["Дображивание","Холодная выдержка: осветление, созревание вкуса. У лагера дольше"],["Карбонизация","Естественная (дображивание в таре) или принудительная (углекислота)"],["Фильтрация и пастеризация","Опционально. Нефильтрованное живее, но хранится меньше"]]]]],["9. Разлив и подача",[["h","9.1. Техника налива"],["p","Бокал должен быть «пивным чистым»: без следов жира и моющего средства. Проверка простая — сполоснуть водой: если она стекает ровной плёнкой, бокал чист; если собирается каплями, на стенках жир, и пена умрёт."],["p","Бокал ополаскивают холодной водой перед наливом: это охлаждает стекло и снижает пенообразование. Замороженный бокал — плохая идея: иней даёт лишнюю пену и глушит аромат."],["p","Держать бокал под углом примерно 45°, наливать на стенку, затем выпрямить и добить пену по центру."],["p","Кран не должен касаться пива и бокала. Это вопрос и гигиены, и пены."],["p","Пена — не обман, а часть подачи: она удерживает аромат и защищает пиво от окисления. Норма — 2–4 см в зависимости от стиля; для пшеничного и стаута больше."],["p","Чешская традиция знает несколько типов налива: hladinka со стандартной пеной, šnyt с уменьшенной порцией и большой пеной, mlíko почти целиком из пены — сладкая и кремовая."],["h","9.2. Линии и оборудование"],["p","Линии промываются регулярно: минимум раз в две недели, при интенсивной работе чаще. Грязные линии — самая частая причина «кислого» пива из крана."],["p","Температура линий и кега должна совпадать. Если кег холодный, а линия тёплая, пиво будет пениться неконтролируемо."],["p","Давление газа настраивается под длину и высоту линии. Слишком высокое — сплошная пена, слишком низкое — плоское пиво."],["p","Стаут на азотной смеси (обычно 70/30) даёт мелкую кремовую пену и требует отдельного крана и отдельного газа."],["h","9.3. Посуда и температура"],["t",[["Стиль","Бокал","Температура"],["Светлый лагер, пильзнер","Пильзнерский, кружка","4–7 °C"],["Пшеничное","Высокий пшеничный, 0,5 л","6–8 °C"],["Pale Ale, IPA","Тюльпан или ноник-пинта","7–9 °C"],["Стаут, портер","Пинта, для крепких — снифтер","8–12 °C"],["Бельгийские крепкие","Кубок, тюльпан","10–14 °C"],["Barleywine, Imperial Stout","Снифтер, малый объём","12–14 °C"],["Ламбик, гёз","Флейта или бокал для игристого","7–9 °C"]]],["p","Общее правило: чем сложнее и крепче пиво, тем теплее подача. Ледяное пиво не имеет вкуса — низкая температура глушит и аромат, и дефекты. Именно поэтому массовые лагеры принято подавать очень холодными."]]],["10. Дефекты",[["t",[["Дефект","Как проявляется","Причина"],["Светобой (скунс)","Запах, похожий на жжёную резину или ску const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const jq =s=>esc(s).replace(/'/g,"\\'");
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const rnd=a=>a[(Math.random()*a.length)|0];
// в тренажёре без граммовок: украшения, доливы (вода, содовая, тоник, кола, игристое), заварка чая
const NOQ={'Содовая':'долив','Вода газ':'долив','Вода газ. ПЭТ':'долив','Вода':'долив','Тоник ПЭТ':'долив',
  'Кола ПЭТ':'долив','Игристое хаус':'долив','Вода из кофемашины':'вода',

const qlab=(d,i)=>i.dec?'украшение':(NOQ[i.n]&&!NOQ_KEEP.has(d.name+'|'+i.n))?NOQ[i.n]:'';
const isDec=(d,n)=>{const i=d.ing.find(x=>x.n===n);return !!(i&&qlab(d,i));};
const num=q=>{const m=String(q).replace(',','.').match(/[\d.]+/);return m?parseFloat(m[0]):NaN;};

const st=(name,mode)=>{ const p=P[name]||(P[name]={}); return p[mode]||(p[mode]={seen:0,ok:0,streak:0}); };
const pool=()=>DRINKS.filter(d=>S.cats.has(d.cat));

function pick(){
  const p=pool();
  const w=p.map(d=>{const s=st(d.name,S.mode);
    return {d,w:(s.seen===0?6:1)+Math.max(0,3-s.streak)*2+(s.seen-s.ok)*1.5};});
  let t=w.reduce((a,b)=>a+b.w,0), r=Math.random()*t;
  for(const x of w){ r-=x.w; if(r<=0) return x.d; }
  return p[p.length-1];
}
// похожие напитки — для вариантов ответа и для подмен
function similar(d,n){
  const mine=new Set(d.ing.map(i=>i.n));
  return DRINKS.filter(x=>x.name!==d.name)
    .map(x=>({x,s:x.ing.filter(i=>mine.has(i.n)).length*3+(x.cat===d.cat?2:0)+(x.glass===d.glass?1:0)+(x.tech===d.tech?1:0)+Math.random()}))
    .sort((a,b)=>b.s-a.s).slice(0,n+4).map(o=>o.x).slice(0,n);
}

// варианты украшения берём из той же категории, иначе кофейная подача попадёт в коктейль
function garnPool(d){
  const same=[...new Set(DRINKS.filter(x=>x.cat===d.cat&&x.garnish&&x.garnish!==d.garnish).map(x=>x.garnish))];
  const rest=GARNISH.filter(g=>g!==d.garnish&&!same.includes(g));
  return [...shuffle(same),...shuffle(rest)];
}
function newRound(){
  const d=pick();
  R={d,mode:S.mode,result:null,guest:rnd(GUESTS),phrase:rnd(PHRASES)};
  if(S.mode==='shift'){
    const correct=d.ing.map(i=>i.n);
    const same=DRINKS.filter(x=>x.cat===d.cat&&x.name!==d.name).flatMap(x=>x.ing.map(i=>i.n));
    const dis=[...new Set([...shuffle(same),...shuffle(ALLING)])].filter(n=>!correct.includes(n))
      .slice(0,Math.min(8,Math.max(5,correct.length+2)));
    Object.assign(R,{glass:null,tech:null,picked:[],garnish:null,chips:shuffle([...correct,...dis]),
      glassOpts:shuffle([d.glass,...shuffle(GLASSES.filter(g=>g!==d.glass)).slice(0,3)]),
      techOpts:shuffle([d.tech,...shuffle(TECHS.filter(t=>t!==d.tech)).slice(0,3)]),
      garnOpts:d.garnish?shuffle([d.garnish,...garnPool(d).slice(0,3)]):null});
  }
  if(S.mode==='rev'){ R.answer=null; R.opts=shuffle([d.name,...similar(d,5).map(x=>x.name)]); }
  if(S.mode==='num'){ R.vals=d.ing.map(()=>''); }
  if(S.mode==='err'){ R.answer=null; R.fake=makeFake(d); }
  render();
}

function makeFake(d){
  const lines=[{k:'Бокал',v:d.glass},{k:'Техника',v:d.tech},
    ...d.ing.map(i=>({k:i.n,v:qlab(d,i)||String(i.q),ing:true,dec:!!qlab(d,i)}))];
  const qtyIx=d.ing.map((i,ix)=>qlab(d,i)?-1:2+ix).filter(x=>x>0);
  const kinds=qtyIx.length?['glass','tech','ing','qty','qty']:['glass','tech','ing'];
  const kind=rnd(kinds);
  let bad, was;
  if(kind==='glass'){ bad=0; was=d.glass; lines[0].v=rnd(GLASSES.filter(g=>g!==d.glass)); }
  else if(kind==='tech'){ bad=1; was=d.tech; lines[1].v=rnd(TECHS.filter(t=>t!==d.tech)); }
  else if(kind==='ing'){
    bad=2+(Math.random()*d.ing.length|0); was=lines[bad].k;
    const mine=new Set(d.ing.map(i=>i.n));
    const near=similar(d,6).flatMap(x=>x.ing.map(i=>i.n)).filter(n=>!mine.has(n));
    lines[bad].k=rnd(near.length?near:ALLING.filter(n=>!mine.has(n)));
  } else {
    bad=rnd(qtyIx); was=lines[bad].v;
    const n0=num(was);
    let v; if(isNaN(n0)) v='30';
    else { const opts=[n0*2,n0/2,n0+10,n0-10,n0+5].filter(x=>x>0&&Math.abs(x-n0)>0.4); v=String(rnd(opts)); }
    lines[bad].v=v;
  }
  return {lines,bad,was,kind};
}

function grade(){
  const d=R.d, res={lines:[],wrong:0};
  const add=(ok,label,val,fix)=>{res.lines.push({ok,label,val,fix}); if(!ok)res.wrong++;};

  if(R.mode==='shift'){
    add(R.glass===d.glass,'Бокал',R.glass||'—',d.glass);
    add(R.tech===d.tech,'Техника',R.tech||'—',d.tech);
    const need=d.ing.map(i=>i.n);
    for(const i of d.ing){
      const got=R.picked.find(p=>p.n===i.n);
      if(!got){ add(false,'',i.n+' — не налито',i.n+' '+i.q); continue; }
      if(!S.qty||qlab(d,i)){ add(true,'',i.n+(qlab(d,i)?' · '+qlab(d,i):' '+i.q),''); continue; }
      const a=num(got.q),b=num(i.q);
      add(!isNaN(a)&&Math.abs(a-b)<0.001,'',i.n+' '+(got.q||'—'),i.n+' '+i.q);
    }
    for(const p of R.picked) if(!need.includes(p.n)) add(false,'',p.n+' — лишнее','убрать');
    if(R.garnOpts) add(R.garnish===d.garnish,'Украшение',R.garnish||'—',d.garnish);
  }
  if(R.mode==='rev') add(R.answer===d.name,'Ответ',R.answer||'—',d.name);
  if(R.mode==='num') d.ing.forEach((i,ix)=>{
    if(qlab(d,i)) return;
    const a=num(R.vals[ix]),b=num(i.q);
    add(!isNaN(a)&&Math.abs(a-b)<0.001,'',i.n+' '+(R.vals[ix]||'—'),i.n+' '+i.q);
  });
  if(R.mode==='err'){
    const f=R.fake, l=f.lines[f.bad];
    const shown=l.ing?l.k+' '+l.v:l.v;
    const right=f.kind==='ing'?f.was+' '+l.v:(l.ing?l.k+' '+f.was:f.was);
    const mine=R.answer===null?'не ответил':(f.lines[R.answer].ing?f.lines[R.answer].k+' '+f.lines[R.answer].v:f.lines[R.answer].v);
    if(R.answer===f.bad) add(true,'Подмена',shown+' → надо '+right,'');
    else add(false,'Ты выбрал',mine,'подменили '+shown+', надо '+right);
  }

  R.result=res;
  const s=st(d.name,R.mode); s.seen++;
  if(res.wrong===0){ s.ok++; s.streak++; shift.streak++; } else { s.streak=0; shift.streak=0; }
  shift.served++;
  save(); render(); window.scrollTo({top:0,behavior:'smooth'});
}

  {t:'Освежающее',   f:{taste:['Освежающий']}},
  {t:'С игристым',   f:{taste:['Игристый']}},
  {t:'Горькое',      f:{taste:['Горький']}},
  {t:'Ягодное',      f:{taste:['Ягодный']}},
  {t:'Тропическое',  f:{taste:['Тропический']}},
  {t:'Кофе и десерт',f:{taste:['Кофейный','Десертный']}},
];
const CATORDER=['Классика','Авторские','Лимонады','Чай фирменный','Милкшейки','Кофе'];
let W={side:'bar',q:'',base:new Set(),taste:new Set(),str:new Set(),cat:new Set(),
       fcat:new Set(),ftag:new Set(),veg:new Set(),cheap:new Set(),
       open:null,recent:[],frecent:[],showF:false};

const norm=s=>String(s).toLowerCase().split('ё').join('е');
// если забыл переключить раскладку: «Ntrbkf» → «текила», «Мупкщтш» → «negroni»
const RU='йцукенгшщзхъфывапролджэячсмитьбю', EN="qwertyuiop[]asdfghjkl;'zxcvbnm,.";
const swap=s=>{let r='';for(const ch of String(s).toLowerCase()){
  let i=EN.indexOf(ch); if(i>=0){r+=RU[i];continue;}
  i=RU.indexOf(ch); r+= i>=0?EN[i]:ch;} return r;};
function hay(d){
  if(d._h) return d._h;
  return d._h=[norm(d.name),...(d.alias||[]).map(norm),norm(d.cat),
    ...d.ing.map(i=>norm(i.n)),...(d.pf?d.pf.parts.map(p=>norm(p.n)):[]),...d.base.map(norm),...d.taste.map(norm),
    norm(d.glass),norm(d.tech)].join(' | ');
}
// «лосось» должен находить «лосося», «грибы» — «грибной»: режем окончание и ищем по началу слова
const VOW='аеиоуыэюяьъй';
function stem(w){ let s=w; let n=0;
  while(s.length>3 && n<2 && VOW.includes(s[s.length-1])){ s=s.slice(0,-1); n++; }
  return s; }
function words(H){ return H.split(/[^0-9a-zа-я.]+/).filter(Boolean); }
function hits(H,q){
  const ws=words(H);
  return q.split(/\s+/).filter(Boolean).every(w=>{
    const s=stem(w);
    if(s.length<3) return H.includes(w);
    return ws.some(x=>x.startsWith(s));   // по началу слова: «хмель» не ловит «похмелье»
  });
}
function matches(d){
  if(W.base.size &&!d.base.some(b=>W.base.has(b)))   return false;
  if(W.taste.size&&!d.taste.some(t=>W.taste.has(t))) return false;
  if(W.str.size  &&!W.str.has(d.str))                return false;
  if(W.cat.size  &&!W.cat.has(d.cat))                return false;
  const q=norm(W.q).trim();
  if(!q) return true;
  const H=hay(d);
  return hits(H,q) || hits(H,norm(swap(q)));
}
const activeCount=()=>W.side==='food'
  ? W.fcat.size+W.ftag.size+W.veg.size+W.cheap.size
  : W.base.size+W.taste.size+W.str.size+W.cat.size;
const byName=n=>DRINKS.find(d=>d.name===n);

function presetOn(p){
  return Object.entries(p.f).every(([k,vs])=>vs.every(v=>W[k].has(v)));
}
function togPreset(i){
  const p=curPresets()[i], on=presetOn(p);
  for(const [k,vs] of Object.entries(p.f)) for(const v of vs) on?W[k].delete(v):W[k].add(v);
  paintWork();
}
function togF(k,v){ W[k].has(v)?W[k].delete(v):W[k].add(v); paintWork(); }
function clearF(){ W.base.clear();W.taste.clear();W.str.clear();W.cat.clear();
  W.fcat.clear();W.ftag.clear();W.veg.clear();W.cheap.clear();W.q='';
  const s=document.getElementById('sq'); if(s) s.value=''; paintWork(); }
function setQ(v){ W.q=v; paintWork(); }
function togFilters(){ W.showF=!W.showF; render(); }

function fhay(d){
  return d._h||(d._h=[norm(d.name),norm(d.cat),norm(d.comp),...d.tags.map(norm)].join(' | '));
}
function fmatches(d){
  if(W.fcat.size&&!W.fcat.has(d.cat))                return false;
  if(W.ftag.size&&!d.tags.some(t=>W.ftag.has(t)))    return false;
  if(W.veg.size &&!d.tags.includes('Без мяса и рыбы'))return false;
  if(W.cheap.size&&d.price>500)                      return false;
  const q=norm(W.q).trim();
  if(!q) return true;
  const H=fhay(d);
  return hits(H,q)||hits(H,norm(swap(q)));
}

/* ================= СПРАВОЧНИК ================= */
// книга: [title, sub, chapters]; глава: [heading, blocks]; блок: ['p'|'h'|'n', текст] | ['t', строки]
let B={q:'',book:null,ch:0,recent:[],hl:''};

const bookIcon=t=>({'КЛАССИЧЕСКИЕ КОКТЕЙЛИ':'Классика','ШПАРГАЛКА БАРМЕНА':'Шпаргалка'}[t]||'');
const chTitle=(bi,ci)=>BOOKS[bi][2][ci][0];

function blockText(bl){ return bl[0]==='t' ? bl[1].map(r=>r.join(' · ')).join(' | ') : bl[1]; }

function refSearch(q){
  const out=[]; const nq=norm(q).trim();
  if(nq.length<2) return out;
  BOOKS.forEach((b,bi)=>b[2].forEach((c,ci)=>{
    const head=norm(b[0]+' '+c[0]);
    let best=null;
    if(hits(head,nq)) best={snip:c[0],score:3};
    for(const bl of c[1]){
      const tx=blockText(bl), H=norm(tx);
      if(hits(H,nq)){ if(!best||best.score<2) best={snip:tx,score:2}; break; }
    }
    if(best) out.push({bi,ci,book:b[0],ch:c[0],snip:best.snip,score:best.score});
  }));
  return out.sort((a,b)=>b.score-a.score).slice(0,40);
}
// подсветка найденного: экранируем, потом размечаем
function mark(text,q){
  const e=esc(text); const nq=norm(q).trim(); if(!nq) return e;
  let r=e;
  for(const w of nq.split(/\s+/).filter(x=>x.length>2)){
    const s=stem(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    if(s.length<3) continue;
    r=r.replace(new RegExp('('+s+'[а-яa-z]*)','gi'),'<mark>$1</mark>');
  }
  return r;
}
function snippet(text,q){
  const nq=norm(q).trim().split(/\s+/)[0]||'';
  const i=norm(text).indexOf(stem(nq));
  if(text.length<170||i<0) return text.slice(0,170)+(text.length>170?'…':'');
  const a=Math.max(0,i-60);
  return (a?'…':'')+text.slice(a,a+170)+(a+170<text.length?'…':'');
}

function openBook(bi){ B.book=bi; B.ch=null; B.hl=''; render(); scrollTop(); }
function openCh(bi,ci,hl){ B.book=bi; B.ch=ci; B.hl=hl||'';
  B.recent=[[bi,ci],...B.recent.filter(x=>!(x[0]===bi&&x[1]===ci))].slice(0,5);
  saveRef(); render(); scrollTop(); }
function backRef(){ if(B.ch!==null&&B.book!==null){ B.ch=null; B.hl=''; }
  else { B.book=null; } render(); scrollTop(); }
function setRefQ(v){ B.q=v; const r=document.getElementById('refres');
  if(r) r.innerHTML=refResultsHTML(); else render(); }
const scrollTop=()=>window.scrollTo({top:0,behavior:'instant'});
async function saveRef(){ try{ await DB.set('ref_recent',JSON.stringify(B.recent)); }catch(e){} }

function refHomeHTML(){
  return `<div class="bar"><h1>Справочник</h1>
      <div class="stats"><button class="ghost" onclick="go('home')">назад</button></div></div>
    <div class="topbar"><div class="line">
      <input class="search" id="rq" value="${esc(B.q)}" oninput="setRefQ(this.value)"
             placeholder="Найти по всем книгам" autocomplete="off">
    </div></div>
    <div id="refres">${refResultsHTML()}</div>`;
}
function refResultsHTML(){
  const q=B.q.trim();
  if(q.length>=2){
    const res=refSearch(q);
    if(!res.length) return `<div class="empty2"><b>Ничего не нашлось</b>
      Попробуй одно слово — «туйон», «мацерация», «агава».</div>`;
    return `<div class="cnt"><span>${res.length} глав</span></div>
      <div class="glist">${res.map(r=>`
      <button class="card2" onclick="openCh(${r.bi},${r.ci},'${jq(q)}')">
        <div class="t"><span class="nm">${esc(r.ch)}</span></div>
        <div class="sub2">${mark(snippet(r.snip,q),q)}</div>
        <div class="tags"><span class="tag s">${esc(r.book)}</span></div>
      </button>`).join('')}</div>`;
  }
  let h='';
  if(B.recent.length){
    h+=`<div class="ghead">Продолжить</div><div class="glist">${B.recent.map(([bi,ci])=>`
      <button class="card2" onclick="openCh(${bi},${ci})">
        <div class="t"><span class="nm">${esc(chTitle(bi,ci))}</span></div>
        <div class="tags"><span class="tag s">${esc(BOOKS[bi][0])}</span></div></button>`).join('')}</div>`;
  }
  h+=`<div class="ghead">12 книг</div><div class="glist">${BOOKS.map((b,i)=>`
    <button class="card2" onclick="openBook(${i})">
      <div class="t"><span class="nm">${esc(b[0])}</span>
        <span class="pr">${b[2].length} гл.</span></div>
      <div class="sub">${esc(b[1]==='Справочник бармена'?b[2].map(c=>c[0].replace(/^\d+\.\s*/,'')).slice(0,4).join(' · '):b[1])}</div>
    </button>`).join('')}</div>`;
  return h;
}
function bookHTML(){
  const b=BOOKS[B.book];
  return `<div class="bar stick"><h1>${esc(b[0])}</h1>
      <div class="stats"><button class="ghost" onclick="backRef()">назад</button></div></div>
    <p class="note" style="margin-top:-4px">${esc(b[1])}</p>
    <div class="glist">${b[2].map((c,i)=>`
      <button class="card2" onclick="openCh(${B.book},${i})">
        <div class="t"><span class="nm">${esc(c[0])}</span></div>
        <div class="sub">${esc(c[1].filter(x=>x[0]==='h').map(x=>x[1].replace(/^\d+\.\d+\.\s*/,'')).slice(0,3).join(' · ')
          ||c[1].map(blockText)[0]||'')}</div>
      </button>`).join('')}</div>`;
}
function chapterHTML(){
  const b=BOOKS[B.book], c=b[2][B.ch], q=B.hl;
  const body=c[1].map(bl=>{
    if(bl[0]==='t'){
      const rows=bl[1];
      return `<div class="tw"><table>${rows.map((r,i)=>`<tr>${r.map(cell=>
        i===0?`<th>${mark(cell,q)}</th>`:`<td>${mark(cell,q)}</td>`).join('')}</tr>`).join('')}</table></div>`;
    }
    if(bl[0]==='h') return `<h4 class="sub-h">${mark(bl[1],q)}</h4>`;
    if(bl[0]==='n') return `<p class="callout">${mark(bl[1],q)}</p>`;
    return `<p>${mark(bl[1],q)}</p>`;
  }).join('');
  const prev=B.ch>0?B.ch-1:null, next=B.ch<b[2].length-1?B.ch+1:null;
  return `<div class="bar stick"><h1>${esc(c[0])}</h1>
      <div class="stats"><button class="ghost" onclick="backRef()">главы</button></div></div>
    <div class="rc read">
      <div class="meta">${esc(b[0])}</div>
      <h2>${esc(c[0])}</h2>
      ${body}
    </div>
    <div class="nav2">
      ${prev!==null?`<button onclick="openCh(${B.book},${prev},'${jq(q)}')">← ${esc(chTitle(B.book,prev))}</button>`:'<span></span>'}
      ${next!==null?`<button onclick="openCh(${B.book},${next},'${jq(q)}')">${esc(chTitle(B.book,next))} →</button>`:'<span></span>'}
    </div>`;
}
function refHTML(){
  if(B.book===null) return refHomeHTML();
  if(B.ch===null)   return bookHTML();
  return chapterHTML();
}

/* ---------- render ---------- */
function render(){
  const app=document.getElementById('app');
  app.className='wrap'+((V==='trainer')?' game':'');
  if(V==='home')      app.innerHTML=homeHTML();
  else if(V==='ref')  app.innerHTML=refHTML();
  else if(V==='work') app.innerHTML=W.open?cardHTML():workHTML();
  else                app.innerHTML = R ? header()+(R.result?resultHTML():roundHTML()) : setupHTML();
}
function header(){
  const p=pool(), learned=p.filter(d=>st(d.name,S.mode).streak>=2).length;
  return `<div class="bar"><h1>${MODES[S.mode].t}</h1>
    <div class="stats"><span>подряд <b>${shift.streak}</b></span>
      <span>выучено <b>${learned}</b>/${p.length}</span>
      <button class="ghost" onclick="toSetup()">меню</button></div></div>`;
}
const step=(t,inner)=>`<div class="step"><h2>${t}</h2><div class="opts">${inner}</div></div>`;
const optBtn=(v,f)=>`<button class="opt" aria-pressed="${R[f]===v}" onclick="setF('${f}','${jq(v)}')">${esc(v)}</button>`;
function setF(f,v){ R[f]=(R[f]===v?null:v); render(); }

function roundHTML(){
  const d=R.d;
  if(R.mode==='shift'){
    let h=`<div class="guest"><div class="face">${R.guest}</div>
      <div class="bubble"><div class="who">Гость · ${esc(d.cat)}</div><p>${R.phrase(esc(d.name))}</p></div></div>`;
    h+=step('Бокал',R.glassOpts.map(g=>optBtn(g,'glass')).join(''));
    h+=step('Техника',R.techOpts.map(t=>optBtn(t,'tech')).join(''));
    h+=`<div class="step"><h2>Состав${S.qty?' и грамовки':''}</h2>
      <div class="opts">${R.chips.map(n=>`<button class="opt${R.picked.some(p=>p.n===n)?' on':''}" onclick="tog('${jq(n)}')">${esc(n)}</button>`).join('')}</div>
      <div class="built">${R.picked.length?R.picked.map((p,ix)=>`
        <div class="row"><span class="nm">${esc(p.n)}</span>
        ${S.qty&&!isDec(d,p.n)?`<input inputmode="decimal" value="${esc(p.q)}" placeholder="0" oninput="R.picked[${ix}].q=this.value;upd()"><span class="unit">мл/г</span>`:`<span class="unit" style="width:auto">${S.qty&&isDec(d,p.n)?qlab(d,d.ing.find(x=>x.n===p.n)):''}</span>`}
        <button class="x" onclick="tog('${jq(p.n)}')" aria-label="убрать">×</button></div>`).join('')
        :'<p class="empty">Пока ничего не налито.</p>'}</div></div>`;
    if(R.garnOpts) h+=step(d.cat==='Кофе'?'Подача':'Украшение',R.garnOpts.map(g=>optBtn(g,'garnish')).join(''));
    return h+cta(R.glass&&R.tech&&R.picked.length,'Отдать гостю');
  }
  if(R.mode==='rev'){
    let h=`<div class="guest"><div class="face">🍸</div><div class="bubble">
      <div class="who">На баре стоит собранный напиток</div>
      <p>${d.glass} · ${d.tech}<br>${d.ing.map(i=>qlab(d,i)?esc(i.n)+' · '+qlab(d,i):esc(i.n)+' <b class="order">'+esc(i.q)+'</b>').join('<br>')}</p></div></div>`;
    h+=`<div class="step"><h2>Что это?</h2><div class="opts">
      ${R.opts.map(n=>`<button class="opt wide" aria-pressed="${R.answer===n}" onclick="setF('answer','${jq(n)}')">${esc(n)}</button>`).join('')}
    </div></div>`;
    return h+cta(!!R.answer,'Ответить');
  }
  if(R.mode==='num'){
    let h=`<div class="guest"><div class="face">📋</div><div class="bubble">
      <div class="who">Карта · ${esc(d.cat)}</div><p><b class="order">${esc(d.name)}</b><br>${esc(d.glass)} · ${esc(d.tech)}</p></div></div>`;
    h+=`<div class="step"><h2>Дозировки</h2><div class="built">
      ${d.ing.map((i,ix)=>qlab(d,i)?`<div class="row"><span class="nm">${esc(i.n)}</span>
        <span class="unit" style="width:auto">${qlab(d,i)}</span></div>`
        :`<div class="row"><span class="nm">${esc(i.n)}</span>
        <input inputmode="decimal" value="${esc(R.vals[ix])}" placeholder="0" oninput="R.vals[${ix}]=this.value;upd()">
        <span class="unit">мл/г</span></div>`).join('')}</div></div>`;
    return h+cta(R.vals.some(v=>v!==''),'Проверить');
  }
  if(R.mode==='err'){
    const f=R.fake;
    let h=`<div class="guest"><div class="face">${R.guest}</div><div class="bubble">
      <div class="who">Стажёр собрал напиток</div><p>Одна строка неверная. Какая?</p></div></div>
      <div class="card"><div class="hd">${esc(d.name)}</div>
      ${f.lines.map((l,ix)=>`<button class="pick${R.answer===ix?' on':''}" onclick="setF('answer',${ix})">
        <span>${l.ing?esc(l.k):'<span class="k">'+esc(l.k)+'</span>'}</span><span>${esc(l.v)}</span></button>`).join('')}
      </div>`;
    return h+cta(R.answer!==null,'Это она');
  }
}
function readyNow(){
  if(!R) return false;
  if(R.mode==='shift') return !!(R.glass&&R.tech&&R.picked.length);
  if(R.mode==='rev')   return !!R.answer;
  if(R.mode==='num')   return R.d.ing.some((i,ix)=>!qlab(R.d,i)&&String(R.vals[ix]).trim()!=='');
  if(R.mode==='err')   return R.answer!==null;
  return true;
}
function cta(_ignored,label){
  return `<div class="cta"><div class="in">
    <button class="serve" id="ctaBtn" ${readyNow()?'':'disabled'} onclick="grade()">${label}</button>
    <button class="skip" onclick="giveUp()">Не знаю</button></div></div>`;
}
function upd(){ const b=document.getElementById('ctaBtn'); if(b) b.disabled=!readyNow(); }
function giveUp(){
  if(R.mode==='shift'){R.picked=[];R.glass=null;R.tech=null;R.garnish=null;}
  if(R.mode==='rev') R.answer=null;
  if(R.mode==='num') R.vals=R.d.ing.map(()=>'');
  if(R.mode==='err') R.answer=null;
  grade();
}
function tog(n){
  const ix=R.picked.findIndex(p=>p.n===n);
  if(ix>=0) R.picked.splice(ix,1);
  else{ const src=R.d.ing.find(i=>i.n===n); R.picked.push({n,q:S.qty?'':(src?src.q:'')}); }
  render();
}

function resultHTML(){
  const d=R.d,r=R.result,perfect=r.wrong===0;
  let h=`<div class="receipt">
    <div class="top"><span>${esc(d.cat)}</span><span>${esc(d.glass)} · ${esc(d.tech)}</span></div>
    <p class="name">${esc(d.name)}</p>`;
  for(const l of r.lines){
    h+=`<div class="rline"><span class="mark ${l.ok?'ok':'bad'}">${l.ok?'✓':'✕'}</span>
      <span>${l.label?esc(l.label)+': ':''}${esc(l.val)}${l.ok?'':` <span class="fix">→ ${esc(l.fix)}</span>`}</span></div>`;
  }
  if(!perfect && (R.mode==='rev'||R.mode==='err')){
    h+=`<div class="sep"></div>${d.ing.map(i=>`<div class="rline"><span class="mark">·</span><span>${esc(i.n)}${qlab(d,i)?' · '+qlab(d,i):' '+esc(i.q)}</span></div>`).join('')}`;
  }
  h+=`<div class="sep"></div><span class="stamp ${perfect?'good':'bad'}">${perfect?'ПРИНЯТО':'НА ПЕРЕДЕЛКУ'}</span>`;
  if(!perfect&&R.mode==='shift'&&d.steps&&d.steps.length)
    h+=`<div class="howto"><b>Как надо:</b><ol>${d.steps.slice(0,7).filter(s=>!/^(выход|примечан|оборудован|требован)/i.test(s)).map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
      ${d.steps.filter(s=>/^выход/i.test(s)).map(s=>`<div>${esc(s)}</div>`).join('')}</div>`;
  h+=`</div>`;
  if(R.mode==='shift'){
    const mood=perfect?HAPPY:(r.wrong<=2?OKAY:ANGRY);
    h+=`<p class="reaction"><span class="who">${R.guest} Гость:</span><br>${esc(rnd(mood))}</p>`;
  }
  h+=`<div class="cta"><div class="in"><button class="serve" onclick="newRound()">Дальше</button></div></div>`;
  return h;
}

function setupHTML(){
  const p=pool();
  const rows=CATS.map(c=>{
    const it=DRINKS.filter(d=>d.cat===c), done=it.filter(d=>st(d.name,S.mode).streak>=2).length;
    return `<tr><td>${esc(c)}</td><td>${done}/${it.length}</td></tr>`;}).join('');
  return `<div class="bar"><h1>Тренажёр</h1>
      <div class="stats"><span>${DRINKS.length} позиций</span>
      <button class="ghost" onclick="go('home')">назад</button></div></div>
    <div class="step"><h2>Режим</h2><div class="modes">
      ${Object.entries(MODES).map(([k,m])=>`<button class="mode${S.mode===k?' on':''}" onclick="setMode('${k}')">
        <b>${m.t}</b><span>${m.d}</span></button>`).join('')}</div></div>
    ${S.mode==='shift'?`<div class="step"><h2>Грамовки в «Смене»</h2><div class="chips">
      <button class="opt${S.qty?'':' on'}" onclick="setQty(false)">Без цифр</button>
      <button class="opt${S.qty?' on':''}" onclick="setQty(true)">С цифрами</button></div></div>`:''}
    <div class="step"><h2>Категории</h2><div class="chips">
      ${CATS.map(c=>`<button class="opt${S.cats.has(c)?' on':''}" onclick="togCat('${jq(c)}')">${esc(c)}</button>`).join('')}</div></div>
    <div class="step"><h2>Выучено в режиме «${MODES[S.mode].t}»</h2><table class="learn">${rows}</table></div>
    <p class="note">Позиция считается выученной после двух безошибочных подач подряд — отдельно в каждом режиме.
      ${store_ok?'Прогресс сохраняется.':'Прогресс не сохраняется — хранилище недоступно.'}</p>
    <div class="cta"><div class="in">
      <button class="serve" ${p.length?'':'disabled'} onclick="newRound()">Начать</button>
      <button class="skip" onclick="reset()">Сбросить</button></div></div>`;
}
function togCat(c){ S.cats.has(c)?S.cats.delete(c):S.cats.add(c); save(); render(); }
function setMode(m){ S.mode=m; save(); render(); }
function setQty(v){ S.qty=v; save(); render(); }
function toSetup(){ R=null; render(); }
function reset(){ if(confirm('Сбросить весь прогресс?')){ P={}; shift={served:0,streak:0}; save(); render(); } }

load().then(render);
</script>
</html>
