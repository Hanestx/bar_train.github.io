<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>За баром — тренажёр</title>
<style>
  :root{
    --wood:#241A16; --wood2:#2F211B; --panel:#3A2A22; --line:#4E3A2F;
    --paper:#EDE3D0; --ink:#2B211C; --brass:#C9974A; --brass-dim:#8A6A34;
    --ox:#9B3A2E; --herb:#6E8A4E; --mut:#A28C7B; --r:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--wood);color:var(--paper);
    font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
    font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:14px 14px 100px}
  h1{font-size:21px;margin:0;letter-spacing:-.01em;font-weight:650}
  h2{font-size:15px;margin:0 0 8px;font-weight:600;color:var(--mut)}
  button{font:inherit;color:inherit;cursor:pointer}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;
    border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}
  .stats{display:flex;gap:13px;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums;align-items:center}
  .stats b{color:var(--brass);font-weight:600}
  .ghost{background:none;border:1px solid var(--line);border-radius:var(--r);
    padding:7px 11px;font-size:13px;color:var(--mut)}
  .ghost:hover{border-color:var(--brass-dim);color:var(--paper)}

  .guest{display:flex;gap:12px;align-items:flex-start;margin-bottom:18px}
  .face{width:46px;height:46px;flex:0 0 46px;border-radius:50%;background:var(--panel);
    border:1px solid var(--line);display:grid;place-items:center;font-size:24px}
  .bubble{background:var(--panel);border:1px solid var(--line);border-radius:4px 14px 14px 14px;
    padding:11px 14px;flex:1}
  .bubble p{margin:0}
  .bubble .who{font-size:12px;color:var(--mut);margin-bottom:3px}
  .order{color:var(--brass);font-weight:650}

  .step{margin-bottom:18px}
  .opts{display:flex;flex-wrap:wrap;gap:7px}
  .opt{background:var(--wood2);border:1px solid var(--line);border-radius:var(--r);
    padding:9px 13px;font-size:14.5px;text-align:left}
  .opt:hover{border-color:var(--brass-dim)}
  .opt.on,.opt[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#231910;font-weight:600}
  .opt.wide{width:100%}

  .built{border:1px dashed var(--line);border-radius:var(--r);padding:10px;margin-top:9px;background:rgba(0,0,0,.14)}
  .built .empty{color:var(--mut);font-size:13.5px;margin:2px 0}
  .row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  .row:last-child{border-bottom:0}
  .row .nm{flex:1;font-size:14.5px}
  .row input{width:66px;background:var(--wood);border:1px solid var(--line);border-radius:7px;
    color:var(--paper);padding:6px 7px;font:inherit;font-size:14px;text-align:right}
  .row input:focus{outline:2px solid var(--brass-dim);outline-offset:1px}
  .row .unit{font-size:12px;color:var(--mut);width:24px}
  .row .x{background:none;border:0;color:var(--mut);font-size:19px;padding:0 4px;line-height:1}
  .row .x:hover{color:var(--ox)}

  /* карточка «найди ошибку» */
  .card{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .card .hd{background:var(--panel);padding:9px 13px;font-weight:650}
  .pick{display:block;width:100%;text-align:left;background:var(--wood2);border:0;
    border-top:1px solid rgba(255,255,255,.06);padding:11px 13px;font-size:14.5px;
    display:flex;justify-content:space-between;gap:10px}
  .pick:hover{background:#3A281F}
  .pick.on{background:var(--brass);color:#231910;font-weight:600}
  .pick .k{color:var(--mut);font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}
  .pick.on .k{color:#5B4318}

  .cta{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--wood) 26%);padding:16px 14px 14px}
  .cta .in{max-width:560px;margin:0 auto;display:flex;gap:9px}
  .serve{flex:1;background:var(--brass);border:0;border-radius:var(--r);padding:14px;
    font-size:16px;font-weight:650;color:#231910}
  .serve:disabled{background:var(--panel);color:var(--mut)}
  .skip{background:none;border:1px solid var(--line);border-radius:var(--r);padding:14px 13px;font-size:14px;color:var(--mut)}

  .receipt{background:var(--paper);color:var(--ink);border-radius:3px;padding:16px 15px 20px;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13.5px;line-height:1.6;
    box-shadow:0 10px 30px rgba(0,0,0,.45)}
  .receipt .top{display:flex;justify-content:space-between;border-bottom:1px dashed rgba(43,33,28,.4);
    padding-bottom:7px;margin-bottom:9px;font-size:12px}
  .receipt .name{font-size:17px;font-weight:700;margin:0 0 10px;font-family:inherit}
  .rline{display:flex;gap:8px;align-items:baseline}
  .rline .mark{width:14px;flex:0 0 14px;font-weight:700}
  .ok{color:#3F6B2E}.bad{color:#96291D}.fix{color:#96291D}
  .receipt .sep{border-top:1px dashed rgba(43,33,28,.4);margin:10px 0}
  .stamp{margin-top:12px;display:inline-block;border:2.5px solid;border-radius:5px;padding:3px 11px;
    font-weight:800;letter-spacing:.06em;transform:rotate(-3.5deg);font-size:15px}
  .stamp.good{color:#3F6B2E}.stamp.bad{color:#96291D}
  .howto{margin-top:8px;font-size:12.5px;color:rgba(43,33,28,.75)}
  .howto li{margin-bottom:2px}
  .reaction{margin:14px 0 0;font-size:15.5px}
  .reaction .who{font-size:12px;color:var(--mut)}

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
  .note{font-size:13px;color:var(--mut);margin:0 0 18px}
  .modes{display:grid;gap:8px;margin-bottom:18px}
  .mode{text-align:left;background:var(--wood2);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px}
  .mode.on{border-color:var(--brass);background:#3A2A1C}
  .mode b{display:block;font-size:15px;margin-bottom:2px}
  .mode span{font-size:12.5px;color:var(--mut)}
  .mode.on b{color:var(--brass)}
  table.learn{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
  table.learn td{padding:4px 0;border-bottom:1px solid rgba(255,255,255,.06)}
  table.learn td:last-child{text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion:no-preference){
    .receipt,.guest,.card{animation:in .22s ease-out}
    @keyframes in{from{opacity:0;transform:translateY(6px)}}
  }
</style>
<div class="wrap" id="app"></div>
<script>
const DRINKS = [{"name": "Кайман", "cat": "Авторские", "glass": "Рокс", "tech": "Шейк", "garnish": "Слайс киви", "ing": [{"n": "Ром белый", "q": "40"}, {"n": "Ликёр трипл сек", "q": "10"}, {"n": "Сок ананасовый", "q": "30"}, {"n": "Сироп маракуйя", "q": "20"}, {"n": "Сок лайма", "q": "15"}], "steps": ["1.Шейкер наполни льдом, достань охлажденный рокс.", "2.В шейкер залей Ром 40, Трипл Сек 10, Сок Ананас 30, Сироп Маракуйа 20, Сок Лайма 15", "3.Шейк шейк шейк", "4.Перелей в рокс", "5.Укрась слайсом киви"]}, {"name": "Милк-шейк орео", "cat": "Милкшейки", "glass": "Банка", "tech": "Блендер", "garnish": "Взбитые сливки 30 + печенье орео 10", "ing": [{"n": "Печенье орео", "q": "20"}, {"n": "Сироп шоколад", "q": "30"}, {"n": "Молоко", "q": "180"}, {"n": "Сливки 11%", "q": "50"}, {"n": "Лёд", "q": "20"}, {"n": "Пломбир", "q": "70"}], "steps": ["1.В блендер помести: печенье орео-20гр(2шт), сироп шоколад-30мл, молоко-180мл, сливки-50мл, лёд-20гр, пломбир-70гр.", "2.Взбей и перелей в банку.", "3.Укрась взбитыми сливками-30гр и печеньем орео-10гр.", "Выход:400мл"]}, {"name": "Милкшейк ваниль-кокос", "cat": "Милкшейки", "glass": "Банка", "tech": "Блендер", "garnish": "Взбитые сливки 30", "ing": [{"n": "Сироп ваниль", "q": "15"}, {"n": "Молоко", "q": "200"}, {"n": "Сливки 11%", "q": "50"}, {"n": "Лёд", "q": "20"}, {"n": "Пломбир", "q": "70"}, {"n": "Сироп кокос", "q": "15"}], "steps": ["1.В блендер помести: сироп ваниль-15мл, сироп кокос-15мл, молоко-200мл, сливки-50мл, лёд-20гр, пломбир-70гр.", "2.Взбей и перелей в банку.", "3.Укрась взбитыми сливками-30гр", "Выход:400мл"]}, {"name": "Милкшейк Клубника", "cat": "Милкшейки", "glass": "Банка", "tech": "Блендер", "garnish": "Взбитые сливки 30", "ing": [{"n": "Сироп клубника", "q": "30"}, {"n": "Молоко", "q": "170"}, {"n": "Сливки 11%", "q": "50"}, {"n": "Лёд", "q": "20"}, {"n": "Пломбир", "q": "70"}, {"n": "Пюре клубника", "q": "30"}], "steps": ["1.В блендер помести: сироп клубника-30мл, молоко-170мл, сливки-50мл, лёд-20гр, пломбир-70гр, пюре клубника-30мл.", "2.Взбей и перелей в банку.", "3.Укрась взбитыми сливками-30гр", "Выход:400мл"]}, {"name": "Облепиха", "cat": "Чай фирменный", "glass": "Чайник 0.9", "tech": "Заваривание", "garnish": "", "ing": [{"n": "облепиха с/м", "q": "200"}, {"n": "Мёд", "q": "130"}, {"n": "Чай чёрный", "q": "5"}], "steps": ["1.В питчер помести облепиху-200гр мед 130 и 100 воды кипяченой. и намни мадлером.", "2. налей сок апельсин 250", "3.Подогрей форсункой до 90С.", "4.Перелей в чайник и долей кипятком."]}, {"name": "Цитрусовый", "cat": "Чай фирменный", "glass": "Чайник 0.9", "tech": "Заваривание", "garnish": "", "ing": [{"n": "Сок апельсиновый", "q": "250"}, {"n": "Сироп маракуйя", "q": "70"}, {"n": "Апельсин", "q": "30"}, {"n": "Лимон", "q": "20"}, {"n": "Чай чёрный", "q": "5"}], "steps": ["1.В чайник помести чай чёрный хаус-5гр., слайсы лимона-20гр и апельсина-30гр. И залей кипятком-200мл.", "2.В питчер залей- сироп маракуйя 60мл., апельсиновый сок-200мл.", "3.Подогрей форсункой до 90С.", "4.Перелей в чайник и долей кипятком."]}, {"name": "Клубника Личи Лайм", "cat": "Чай фирменный", "glass": "Чайник 0.9", "tech": "Заваривание", "garnish": "", "ing": [{"n": "Сироп личи", "q": "75"}, {"n": "Пюре клубника", "q": "75"}, {"n": "Мята п/ф", "q": "4", "dec": true}, {"n": "Чай чёрный", "q": "5"}], "steps": ["1.В чайник помести чай чёрный хаус-5гр., листья мяты-4гр., залей кипятком на 200мл.", "2.В питчер залей сироп личи-75мл., пюре клубники-75мл., добавь кипятка-100мл.", "3.Подогрей форсункой до 90С.", "4.Перелей в чайник и долей кипятком."]}, {"name": "Персик-манго", "cat": "Чай фирменный", "glass": "Чайник 0.9", "tech": "Заваривание", "garnish": "", "ing": [{"n": "Сироп манго", "q": "75"}, {"n": "Сок персик", "q": "250"}, {"n": "Мята п/ф", "q": "4", "dec": true}, {"n": "Чай чёрный", "q": "5"}], "steps": ["1.В чайник помести чай чёрный хаус-5гр., листья мяты-4гр., залей кипятком на 200мл.", "2.В питчер залей сироп манго-75мл., сок персик-250мл., добавь кипятка-100м };

let S={cats:new Set(CATS), mode:'shift', qty:true};
let P={}, R=null, store_ok=false;
let shift={served:0,streak:0};

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const jq =s=>esc(s).replace(/'/g,"\\'");
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const rnd=a=>a[(Math.random()*a.length)|0];
const isDec=(d,n)=>{const i=d.ing.find(x=>x.n===n);return !!(i&&i.dec);};
const num=q=>{const m=String(q).replace(',','.').match(/[\d.]+/);return m?parseFloat(m[0]):NaN;};

async function load(){
  store_ok = !!(window.storage && window.storage.get) || DB.kind==='ls';
  try{ const a=await DB.get('bar_progress2'); if(a) P=JSON.parse(a.value); }catch(e){}
  if(!Object.keys(P).length){
    try{ const o=await DB.get('bar_progress');
      if(o){ const old=JSON.parse(o.value); for(const k in old) P[k]={shift:old[k]}; } }catch(e){}
  }
  try{ const b=await DB.get('bar_settings2');
    if(b){ const s=JSON.parse(b.value); S.cats=new Set(s.cats); S.mode=s.mode||'shift'; S.qty=s.qty!==false; } }catch(e){}
}
async function save(){
  try{ await DB.set('bar_progress2',JSON.stringify(P)); }catch(e){ store_ok=false; }
  try{ await DB.set('bar_settings2',JSON.stringify({cats:[...S.cats],mode:S.mode,qty:S.qty})); }catch(e){}
}
const st=(name,mode)=>{ const p=P[name]||(P[name]={}); return p[mode]||(p[mode]={seen:0,ok:0,streak:0}); };
const pool=()=>DRINKS.filter(d=>S.cats.has(d.cat));

function pick(){
  const p=pool();
  const w=p.map(d=>{const s=st(d.name,S.mode);
    return {d,w:(s.seen===0?6:1)+Math.max(0,3-s.streak)*2+(s.seen-s.ok)*1.5};});
  let t=w.reduce((a,b)=>a+b.w,0), r=Math.random()*t;
  for(const x of w){ r-=x.w; if(r<=0) return x.d; }
  return p[p.length-1];
}
// похожие напитки — для вариантов ответа и для подмен
function similar(d,n){
  const mine=new Set(d.ing.map(i=>i.n));
  return DRINKS.filter(x=>x.name!==d.name)
    .map(x=>({x,s:x.ing.filter(i=>mine.has(i.n)).length*3+(x.cat===d.cat?2:0)+(x.glass===d.glass?1:0)+(x.tech===d.tech?1:0)+Math.random()}))
    .sort((a,b)=>b.s-a.s).slice(0,n+4).map(o=>o.x).slice(0,n);
}

function newRound(){
  const d=pick();
  R={d,mode:S.mode,result:null,guest:rnd(GUESTS),phrase:rnd(PHRASES)};
  if(S.mode==='shift'){
    const correct=d.ing.map(i=>i.n);
    const same=DRINKS.filter(x=>x.cat===d.cat&&x.name!==d.name).flatMap(x=>x.ing.map(i=>i.n));
    const dis=[...new Set([...shuffle(same),...shuffle(ALLING)])].filter(n=>!correct.includes(n))
      .slice(0,Math.min(8,Math.max(5,correct.length+2)));
    Object.assign(R,{glass:null,tech:null,picked:[],garnish:null,chips:shuffle([...correct,...dis]),
      glassOpts:shuffle([d.glass,...shuffle(GLASSES.filter(g=>g!==d.glass)).slice(0,3)]),
      techOpts:shuffle([d.tech,...shuffle(TECHS.filter(t=>t!==d.tech)).slice(0,3)]),
      garnOpts:d.garnish?shuffle([d.garnish,...shuffle(GARNISH.filter(g=>g!==d.garnish)).slice(0,3)]):null});
  }
  if(S.mode==='rev'){ R.answer=null; R.opts=shuffle([d.name,...similar(d,5).map(x=>x.name)]); }
  if(S.mode==='num'){ R.vals=d.ing.map(()=>''); }
  if(S.mode==='err'){ R.answer=null; R.fake=makeFake(d); }
  render();
}

function makeFake(d){
  const lines=[{k:'Бокал',v:d.glass},{k:'Техника',v:d.tech},
    ...d.ing.map(i=>({k:i.n,v:i.dec?'':String(i.q),ing:true,dec:!!i.dec}))];
  const qtyIx=d.ing.map((i,ix)=>i.dec?-1:2+ix).filter(x=>x>0);
  const kinds=qtyIx.length?['glass','tech','ing','qty','qty']:['glass','tech','ing'];
  const kind=rnd(kinds);
  let bad, was;
  if(kind==='glass'){ bad=0; was=d.glass; lines[0].v=rnd(GLASSES.filter(g=>g!==d.glass)); }
  else if(kind==='tech'){ bad=1; was=d.tech; lines[1].v=rnd(TECHS.filter(t=>t!==d.tech)); }
  else if(kind==='ing'){
    bad=2+(Math.random()*d.ing.length|0); was=lines[bad].k;
    const mine=new Set(d.ing.map(i=>i.n));
    const near=similar(d,6).flatMap(x=>x.ing.map(i=>i.n)).filter(n=>!mine.has(n));
    lines[bad].k=rnd(near.length?near:ALLING.filter(n=>!mine.has(n)));
  } else {
    bad=rnd(qtyIx); was=lines[bad].v;
    const n0=num(was);
    let v; if(isNaN(n0)) v='30';
    else { const opts=[n0*2,n0/2,n0+10,n0-10,n0+5].filter(x=>x>0&&Math.abs(x-n0)>0.4); v=String(rnd(opts)); }
    lines[bad].v=v;
  }
  return {lines,bad,was,kind};
}

function grade(){
  const d=R.d, res={lines:[],wrong:0};
  const add=(ok,label,val,fix)=>{res.lines.push({ok,label,val,fix}); if(!ok)res.wrong++;};

  if(R.mode==='shift'){
    add(R.glass===d.glass,'Бокал',R.glass||'—',d.glass);
    add(R.tech===d.tech,'Техника',R.tech||'—',d.tech);
    const need=d.ing.map(i=>i.n);
    for(const i of d.ing){
      const got=R.picked.find(p=>p.n===i.n);
      if(!got){ add(false,'',i.n+' — не налито',i.n+' '+i.q); continue; }
      if(!S.qty||i.dec){ add(true,'',i.n+(i.dec?'':' '+i.q),''); continue; }
      const a=num(got.q),b=num(i.q);
      add(!isNaN(a)&&Math.abs(a-b)<0.001,'',i.n+' '+(got.q||'—'),i.n+' '+i.q);
    }
    for(const p of R.picked) if(!need.includes(p.n)) add(false,'',p.n+' — лишнее','убрать');
    if(R.garnOpts) add(R.garnish===d.garnish,'Украшение',R.garnish||'—',d.garnish);
  }
  if(R.mode==='rev') add(R.answer===d.name,'Ответ',R.answer||'—',d.name);
  if(R.mode==='num') d.ing.forEach((i,ix)=>{
    if(i.dec) return;
    const a=num(R.vals[ix]),b=num(i.q);
    add(!isNaN(a)&&Math.abs(a-b)<0.001,'',i.n+' '+(R.vals[ix]||'—'),i.n+' '+i.q);
  });
  if(R.mode==='err'){
    const f=R.fake, l=f.lines[f.bad];
    const shown=l.ing?l.k+' '+l.v:l.v;
    const right=f.kind==='ing'?f.was+' '+l.v:(l.ing?l.k+' '+f.was:f.was);
    const mine=R.answer===null?'не ответил':(f.lines[R.answer].ing?f.lines[R.answer].k+' '+f.lines[R.answer].v:f.lines[R.answer].v);
    if(R.answer===f.bad) add(true,'Подмена',shown+' → надо '+right,'');
    else add(false,'Ты выбрал',mine,'подменили '+shown+', надо '+right);
  }

  R.result=res;
  const s=st(d.name,R.mode); s.seen++;
  if(res.wrong===0){ s.ok++; s.streak++; shift.streak++; } else { s.streak=0; shift.streak=0; }
  shift.served++;
  save(); render(); window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- render ---------- */
function render(){
  const app=document.getElementById('app');
  app.innerHTML = R ? header()+(R.result?resultHTML():roundHTML()) : setupHTML();
}
function header(){
  const p=pool(), learned=p.filter(d=>st(d.name,S.mode).streak>=2).length;
  return `<div class="bar"><h1>${MODES[S.mode].t}</h1>
    <div class="stats"><span>подряд <b>${shift.streak}</b></span>
      <span>выучено <b>${learned}</b>/${p.length}</span>
      <button class="ghost" onclick="toSetup()">меню</button></div></div>`;
}
const step=(t,inner)=>`<div class="step"><h2>${t}</h2><div class="opts">${inner}</div></div>`;
const optBtn=(v,f)=>`<button class="opt" aria-pressed="${R[f]===v}" onclick="setF('${f}','${jq(v)}')">${esc(v)}</button>`;
function setF(f,v){ R[f]=(R[f]===v?null:v); render(); }

function roundHTML(){
  const d=R.d;
  if(R.mode==='shift'){
    let h=`<div class="guest"><div class="face">${R.guest}</div>
      <div class="bubble"><div class="who">Гость · ${esc(d.cat)}</div><p>${R.phrase(esc(d.name))}</p></div></div>`;
    h+=step('Бокал',R.glassOpts.map(g=>optBtn(g,'glass')).join(''));
    h+=step('Техника',R.techOpts.map(t=>optBtn(t,'tech')).join(''));
    h+=`<div class="step"><h2>Состав${S.qty?' и грамовки':''}</h2>
      <div class="opts">${R.chips.map(n=>`<button class="opt${R.picked.some(p=>p.n===n)?' on':''}" onclick="tog('${jq(n)}')">${esc(n)}</button>`).join('')}</div>
      <div class="built">${R.picked.length?R.picked.map((p,ix)=>`
        <div class="row"><span class="nm">${esc(p.n)}</span>
        ${S.qty&&!isDec(d,p.n)?`<input inputmode="decimal" value="${esc(p.q)}" placeholder="0" oninput="R.picked[${ix}].q=this.value;upd()"><span class="unit">мл/г</span>`:`<span class="unit" style="width:auto">${S.qty&&isDec(d,p.n)?'украшение':''}</span>`}
        <button class="x" onclick="tog('${jq(p.n)}')" aria-label="убрать">×</button></div>`).join('')
        :'<p class="empty">Пока ничего не налито.</p>'}</div></div>`;
    if(R.garnOpts) h+=step(d.cat==='Кофе'?'Подача':'Украшение',R.garnOpts.map(g=>optBtn(g,'garnish')).join(''));
    return h+cta(R.glass&&R.tech&&R.picked.length,'Отдать гостю');
  }
  if(R.mode==='rev'){
    let h=`<div class="guest"><div class="face">🍸</div><div class="bubble">
      <div class="who">На баре стоит собранный напиток</div>
      <p>${d.glass} · ${d.tech}<br>${d.ing.map(i=>i.dec?esc(i.n):esc(i.n)+' <b class="order">'+esc(i.q)+'</b>').join('<br>')}</p></div></div>`;
    h+=`<div class="step"><h2>Что это?</h2><div class="opts">
      ${R.opts.map(n=>`<button class="opt wide" aria-pressed="${R.answer===n}" onclick="setF('answer','${jq(n)}')">${esc(n)}</button>`).join('')}
    </div></div>`;
    return h+cta(!!R.answer,'Ответить');
  }
  if(R.mode==='num'){
    let h=`<div class="guest"><div class="face">📋</div><div class="bubble">
      <div class="who">Карта · ${esc(d.cat)}</div><p><b class="order">${esc(d.name)}</b><br>${esc(d.glass)} · ${esc(d.tech)}</p></div></div>`;
    h+=`<div class="step"><h2>Дозировки</h2><div class="built">
      ${d.ing.map((i,ix)=>i.dec?`<div class="row"><span class="nm">${esc(i.n)}</span>
        <span class="unit" style="width:auto">украшение</span></div>`
        :`<div class="row"><span class="nm">${esc(i.n)}</span>
        <input inputmode="decimal" value="${esc(R.vals[ix])}" placeholder="0" oninput="R.vals[${ix}]=this.value;upd()">
        <span class="unit">мл/г</span></div>`).join('')}</div></div>`;
    return h+cta(R.vals.some(v=>v!==''),'Проверить');
  }
  if(R.mode==='err'){
    const f=R.fake;
    let h=`<div class="guest"><div class="face">${R.guest}</div><div class="bubble">
      <div class="who">Стажёр собрал напиток</div><p>Одна строка неверная. Какая?</p></div></div>
      <div class="card"><div class="hd">${esc(d.name)}</div>
      ${f.lines.map((l,ix)=>`<button class="pick${R.answer===ix?' on':''}" onclick="setF('answer',${ix})">
        <span>${l.ing?esc(l.k):'<span class="k">'+esc(l.k)+'</span>'}</span><span>${esc(l.v)}</span></button>`).join('')}
      </div>`;
    return h+cta(R.answer!==null,'Это она');
  }
}
function readyNow(){
  if(!R) return false;
  if(R.mode==='shift') return !!(R.glass&&R.tech&&R.picked.length);
  if(R.mode==='rev')   return !!R.answer;
  if(R.mode==='num')   return R.d.ing.some((i,ix)=>!i.dec&&String(R.vals[ix]).trim()!=='');
  if(R.mode==='err')   return R.answer!==null;
  return true;
}
function cta(_ignored,label){
  return `<div class="cta"><div class="in">
    <button class="serve" id="ctaBtn" ${readyNow()?'':'disabled'} onclick="grade()">${label}</button>
    <button class="skip" onclick="giveUp()">Не знаю</button></div></div>`;
}
function upd(){ const b=document.getElementById('ctaBtn'); if(b) b.disabled=!readyNow(); }
function giveUp(){
  if(R.mode==='shift'){R.picked=[];R.glass=null;R.tech=null;R.garnish=null;}
  if(R.mode==='rev') R.answer=null;
  if(R.mode==='num') R.vals=R.d.ing.map(()=>'');
  if(R.mode==='err') R.answer=null;
  grade();
}
function tog(n){
  const ix=R.picked.findIndex(p=>p.n===n);
  if(ix>=0) R.picked.splice(ix,1);
  else{ const src=R.d.ing.find(i=>i.n===n); R.picked.push({n,q:S.qty?'':(src?src.q:'')}); }
  render();
}

function resultHTML(){
  const d=R.d,r=R.result,perfect=r.wrong===0;
  let h=`<div class="receipt">
    <div class="top"><span>${esc(d.cat)}</span><span>${esc(d.glass)} · ${esc(d.tech)}</span></div>
    <p class="name">${esc(d.name)}</p>`;
  for(const l of r.lines){
    h+=`<div class="rline"><span class="mark ${l.ok?'ok':'bad'}">${l.ok?'✓':'✕'}</span>
      <span>${l.label?esc(l.label)+': ':''}${esc(l.val)}${l.ok?'':` <span class="fix">→ ${esc(l.fix)}</span>`}</span></div>`;
  }
  if(!perfect && (R.mode==='rev'||R.mode==='err')){
    h+=`<div class="sep"></div>${d.ing.map(i=>`<div class="rline"><span class="mark">·</span><span>${esc(i.n)}${i.dec?'':' '+esc(i.q)}</span></div>`).join('')}`;
  }
  h+=`<div class="sep"></div><span class="stamp ${perfect?'good':'bad'}">${perfect?'ПРИНЯТО':'НА ПЕРЕДЕЛКУ'}</span>`;
  if(!perfect&&R.mode==='shift'&&d.steps&&d.steps.length)
    h+=`<div class="howto"><b>Как надо:</b><ul>${d.steps.slice(0,7).map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`;
  h+=`</div>`;
  if(R.mode==='shift'){
    const mood=perfect?HAPPY:(r.wrong<=2?OKAY:ANGRY);
    h+=`<p class="reaction"><span class="who">${R.guest} Гость:</span><br>${esc(rnd(mood))}</p>`;
  }
  h+=`<div class="cta"><div class="in"><button class="serve" onclick="newRound()">Дальше</button></div></div>`;
  return h;
}

function setupHTML(){
  const p=pool();
  const rows=CATS.map(c=>{
    const it=DRINKS.filter(d=>d.cat===c), done=it.filter(d=>st(d.name,S.mode).streak>=2).length;
    return `<tr><td>${esc(c)}</td><td>${done}/${it.length}</td></tr>`;}).join('');
  return `<div class="bar"><h1>За баром</h1>
      <div class="stats"><span>${DRINKS.length} позиций</span></div></div>
    <div class="step"><h2>Режим</h2><div class="modes">
      ${Object.entries(MODES).map(([k,m])=>`<button class="mode${S.mode===k?' on':''}" onclick="setMode('${k}')">
        <b>${m.t}</b><span>${m.d}</span></button>`).join('')}</div></div>
    ${S.mode==='shift'?`<div class="step"><h2>Грамовки в «Смене»</h2><div class="chips">
      <button class="opt${S.qty?'':' on'}" onclick="setQty(false)">Без цифр</button>
      <button class="opt${S.qty?' on':''}" onclick="setQty(true)">С цифрами</button></div></div>`:''}
    <div class="step"><h2>Категории</h2><div class="chips">
      ${CATS.map(c=>`<button class="opt${S.cats.has(c)?' on':''}" onclick="togCat('${jq(c)}')">${esc(c)}</button>`).join('')}</div></div>
    <div class="step"><h2>Выучено в режиме «${MODES[S.mode].t}»</h2><table class="learn">${rows}</table></div>
    <p class="note">Позиция считается выученной после двух безошибочных подач подряд — отдельно в каждом режиме.
      ${store_ok?'Прогресс сохраняется.':'Прогресс не сохраняется — хранилище недоступно.'}</p>
    <div class="cta"><div class="in">
      <button class="serve" ${p.length?'':'disabled'} onclick="newRound()">Начать</button>
      <button class="skip" onclick="reset()">Сбросить</button></div></div>`;
}
function togCat(c){ S.cats.has(c)?S.cats.delete(c):S.cats.add(c); save(); render(); }
function setMode(m){ S.mode=m; save(); render(); }
function setQty(v){ S.qty=v; save(); render(); }
function toSetup(){ R=null; render(); }
function reset(){ if(confirm('Сбросить весь прогресс?')){ P={}; shift={served:0,streak:0}; save(); render(); } }

load().then(render);
</script>
